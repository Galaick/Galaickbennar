 #Goverment Reforms

 law_of_change:0 "Law of Change"
 law_of_change_desc:0 "For as long as we have written and oral records the K'ajooin have controlled the urban centers of the land we inhabit. Secretive societies of tech hoarders that hide away in their great realms of stone. As we develop and expand we have come to settle these cities ourselves yet chafe under K'ajooin rule. They sit atop their stone temples both physically and metaphorically above our people. Yet no matter where they go they look down on us all the same. We need to create an institution to rival them, one that will share the glory of knowledge with the people instead of hiding it away within themselves. One that will rule with us instead of above us. The law, as it is, must change."
 kooras_federation:0 "League of All Kooras"
 kooras_federation_desc:0 "Our Tsahl started as a small federation of minor tribes, yet now grows to rule over a League of All Kooras. Hundreds of elves turn into thousands and a small village turns into a bustling city. Tribes once isolated in worlds as small as the wooden walls of their village now intermingle and cooperate throughout vast plains, dense jungles, and rolling hills. Our federation must grow to meet the needs of these varied people and rise to the challenges such scale brings to truly be for all Kooras."
 
 #Tooltips

 kooras_settling_buff_tt:0 "From now on, settling provinces of §YKooras§! culture will grant them '§YReclaimed City§!' for §Y50§! years:\nLocal Development Cost: §G-10%§!\nLocal Tax Modifier: §G+10%§!\nLocal Development Modifier: §G+10%§!"
