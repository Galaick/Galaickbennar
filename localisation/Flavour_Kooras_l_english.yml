 #Estate Privileges

 estate_artificers_kooras_riftbridgers:0 "Riftbridgers"
 estate_artificers_kooras_riftbridgers_desc:0 "By permitting our Artificers to study the Riftwatchers and their visions we may get closer to the truth of how and why these happen. Perhaps even being able to use them to our advantage whether on the battlefield, in the market, or perhaps in inventing technologies decades ahead of our contemporaries. Some scientists hesitate, saying we shouldn't look too closely into visions granted by the Dark World, less something sinister looks back. However, when has the unknown ever stopped us?"
 enable_estate_action_BUILD_MAGICAL_LONGHOUSE_tt:0 "[Root.EnableEstateDecisionText] §YArtificers: Build Magical Longhouse§!"

 #Custom Loc
 customMissionTitleOneG03:0 "The K'ajóo'in Societies"
 customMissionTitleOneU29:0 "Pastoral Life"
 customMissionTitleOneG44:0 "The Blood Dives"
 customMissionDescOneG03:0 "The K'ajooin Societies are an ancient group of secret societies which originated in the Paleptaiinky city-states from which the Yamchiil Tsahl has taken a lot of influence. Although the Paleptaiinky have since long been subsumed within the Harafic-descended Kooras, the K'ajooin Societies still form a microcosm of the bygone culture according to their esoteric customs. Indeed, the K'ajooin, or “Knowledge-Sick”, are scholars that were originally intended to function as repositories of knowledge, so that the average Paleptaiinky would not have to become learned in any capacity, in accordance with their odd societal fear of knowing. However, as history went by and most of their position was stripped, they became keepers of now-abandoned cities and holders of long-forgotten secrets. Tli'yam Kyin, our capital, is the largest Kooras city that was originally Paleptaiinky-built, and by consequence, the rule of our Tslakiirpaal dynasty has always been heavily subservient to the K'ajooin."
 customMissionDescOneU29:0 "The members of the Kaiinpi Tsahl have always kept a lifestyle closer to their Harafic ancestors, living semi-nomadic pastoral lives on the great plains called the Tokal. Unlike the other Tsahl, who claim to organize themselves around a single settlement, we know that the only place we can call our home is the Tokal itself. Instead, our tribes cycle their habitation between the different Tsaneiin, temple-stables which adorn our land, meeting in the great Nochtsaneiin in times when every tribe needs to be gathered together."
 customMissionDescOneG44:0 "According to the Ja'akaiin faith, the god of water Kseldos was the last god uncorrupted by the Dark World, who sacrificed himself after killing his fellow gods in order to save the world from being fully engulfed by evil. To the Kooras, Damestear is in fact the blood that still flows from Kseldos' corpse high in the heavens, and is hence considered a highly sacred material. During their ever-going search for Damestear, the Leptone Tsahl was the first to discover a completely untapped source: the seafloor. With the help of specific magical rituals, they now organize the “Blood Dives” as a rite of passage into adulthood, sending expeditionary groups to the bottom of the ocean in order to look for Damestear and other treasures."
 customMissionTitleTwoG03:0 "Concealed Knowledge"
 customMissionTitleTwoU29:0 "War- and Worksongs"
 customMissionTitleTwoG44:0 "Power of the Wave"
 customMissionDescTwoG03:0 "According to Kooras beliefs, magic originates from tapping into the energy of the dualistic elemental worlds. The Yamchiil, by way of their Paleptaiinky ancestry, are renowned for their powerful Riftwatchers, eldritch diviners who they say have been cursed by the power of the Dark World to see far into its deepest reaches. Riftwatching, unlike most forms of magic, isn't truly controlled by its caster, and occurs randomly, often showing unwanted visions at inopportune times. However, one of the main areas of K'ajooin concerns the ability to control Riftwatching casting and subject. As we throw off the shackles of their rule over Tli'yam Kyin, perhaps it would do good for our Tsahl to require them to teach us some of these secrets."
 customMissionDescTwoU29:0 "According to Kooras beliefs, magic originates from tapping into the energy of the dualistic elemental worlds. The Kaiinpi, in accord with the traditional ways of their Haraf'ne ancestors, prefer the art of the Kaiineloo, necromantic bards who control the flow of energy from the Dark World to the Water World and vice versa. Through channeling the sound of our forefather's voices, they can control emotions and effect visible physical changes on their audience. They are often called both during times of war and during times of work, as to motivate the brave elves of the Tsahl to bring pride to their ancestors, and calm negative emotions such as grief and fatigue."
 customMissionDescTwoG44:0 "According to Kooras beliefs, magic originates from tapping into the energy of the dualistic elemental worlds. The Leptone, always foremost servants of Kseldos, prefer to sponsor the Ja'adkali, water-controlling mages who they believe can use the bounty of the Water World to protect and bring prosperity to all that is good. The Ja'adkali are for the largest part actually warlocks of water elementals, provided it requires to find some which are intelligent enough to conscientiously give them pact magic. They are also instrumental in organizing the Blood Dives and controlling irrigation across the land."
 customMissionTitleThreeG03:0 "The Nameless Wellspring"
 customMissionTitleThreeU29:0 "Back to Our Roots"
 customMissionTitleThreeG44:0 "Our Soul in a Pearl"
 customMissionDescThreeG03:0 "The priest-king of Sayab Kyin ruled much of this land in service to his nameless god, but he was cast down, and being a K'ajooin, all of his knowledge died with him. Yet, the ruins of Sayab Kyin still stand in Tolalkal. A graveyard of stone and silence with buildings rising as high into the sky as the grand cenote goes deep into the earth. From this wound in the earth, Sayab Kyin stole the blood and bone of a dead world. Many of its esoteric relics litter the temples of the city, but our explorers have determined yet more remain in the labyrinthine veins below."
 customMissionDescThreeU29:0 "While it seems that the other Kooras have altogether abandoned the worship of the Paragons in favor of Kseldos and his servants, we know that our ancestors are a part of our religion as important as the gods and the spirits. Indeed, only our neighbors in the Kinah Federation truly hold any respect towards the Paragons anymore. Our roots in their northern savannahs grow deep, but it has been centuries since our forefathers left that land. If we are to truly unite the Kooras, we need to do so in honor of our ancestors, and not in spite of them: the children of the Paragons need not fight, but unite once again."
 customMissionDescThreeG44:0 "The Leptone Tsahl is renowned among the Kooras for being the origin of the quasi-monotheistic worship of the water god Kseldos, that then became the basis of the Ja'akaiin faith which spread across Yaahsepaal thanks to the Tsahl's economic dominance during the 13th century. However, there are still many Kooras who do not respect the sole authority of Kseldos: to our east, some of the more-isolated Tsahl have clinged on to their archaic gem worship, revering the god of earth Etkal. While their practices might seem odd to us, we should try to understand them to bring them closer to us. According to them, pearls are the children of Etkal with Kseldos; perhaps adorning the K'il'uil Siiken, the greatest monument of Tsewee Kyin, with magnificent pearls we have found in our Blood Dives might convince them of our goodwill?"
 customMissionTitleFourG03:0 "Age of Wonders"
 customMissionTitleFourU29:0 "Bounty of Our Land"
 customMissionTitleFourG44:0 "Braving the Deep Tide"
 customMissionDescFourG03:0 "Our Riftwatchers have for long been restricted in their visions by the strange ways of the K'ajooin, who wished to tell us what we could or could not know. However, now that we have rid ourselves of their influence - at least in the city of Tli'yam Kyin proper - we may be finally able to use their potential to its fullest. If we want our civilization to prosper, we need to grasp the secrets our future holds: this skill gifted to us by our Paleptaiinky ancestors needs to help us attain prosperity and insight."
 customMissionDescFourU29:0 "Among the people who arrived in Yaahsepaal within Tslakiir's Host, a large portion were part of the Ch'inbaide people, one of the major Harafic groups that rose during the resettlement of Haraf. Once the foremost Haraf'ne culture, history hit these people again and again, until they were left only in the fringes of the Kinah Federation. We Kaiinpi hence have the duty to honor their legacy as experts of the land and of the plants; despite our herder heritage, we also know how to navigate through the dense jungles of our land, and cultivate singular and amazing plants such as the sacred cocoa bean."
 customMissionDescFourG44:0 "Our Tsahl's knowledge and reverence of the sea comes in great part from the great water elemental Chiiluil. Taking the form of a great seahorse made of a strange prismatic liquid and an outer crust of solid Damestear, she has led our people to settle on the Guardian Isles and ever-expand our Ja'adkali's abilities. However, she has now been gone from our reach for decades, with no sign of her in our Blood Dives or on our shores. Our shamans have been maintaining that this is only a test from Chiiluil, who wishes to see how we fare without her constant guidance. We need to dive deeper, so that we know whether they are right or whether she has truly abandoned us."

