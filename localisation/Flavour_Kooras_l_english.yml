 kooras_upon_the_ruins_title:0 "Upon the Ruins"
 kooras_upon_the_ruins_desc:0 "In its early days, Yaahsepaal was home to the Paleptaiinky people, an agrarian society who lived in isolated cities along the streams of the region. In 1000 AA, a major ecological disaster known as the Fiery Droughts touched all of Western Aelantir, sparing not even the rainforests of southern Haraf from the disruption. The Paleptaiinky, alongside the Yamchiil, their child culture with the Harafics, were no longer able to sustain their lifestyles and had to migrate closer to the coast. They assimilated into the many Tsahl of the Kaiinpi, bringing a new wave of cultural synthesis between the peoples of Yaahsepaal. However, a group of Paleptaiinky secret societies called the K'ajooin Societies have continued maintaining and living in the husks of their ancient cities, including those abandoned by all but them. Their help could be instrumental in reclaiming the interior of the region, despite their strange and secretive customs of knowledge-loathing."

 kooras_settling_the_interior_title:0 "A Burgeoning Civilization"
 kooras_settling_the_interior_desc:0 "With the prosperity of our society and advance of our government has come an increasing agrarianism of our people. Aided by the water wielding Ja'adkali, and with reluctant help from the K'ajooin, we have been able to successfully irrigate large swaths of land into fertile farmlands and our control over water advances almost as much as our statecraft. But our state has yet to be fully forged and there are new challenges in the process. The sheer amount of farmable land has led to a veritable population boom, and our government may soon buckle under the weight less it reforms swiftly."

 kooras_our_former_brothers_title:0 "Our Ashen Cousins"
 kooras_our_former_brothers_desc:0 "Working as a single political entity, we are able to look far beyond our home in Yaahsepaal. To our north lay the Kinah Federation of the Haraf'ne people. Although we descend from them, ours was a violent divorce. With our people rebelling from the first Kinah Federation centuries ago, yet being as long as it was, relations have normalized and we frequently trade with each other. Should we remember our rebellion and fight the Kinah or put the past behind us and welcome them as our Harafic kin?"

 kooras_largest_in_haraf_title:0 "League and Federation"
 kooras_largest_in_haraf_desc:0 "We have formed a grand League, eclipsing even the Haraf'ne. As we look to expand our League and reach one Kinah is of particular note, the Kinah of Hoila'kosu. Situated on the western coast they're an urbanized and maritime people, somewhat unlike the rest of their Haraf'ne kin. Occupying an entrance to the Wormway as well as a remaining section of the Tunnels of Renewal, this combined with their maritime abilities make them an especially pragmatic target for incorporation. Should we attempt to do so peacefully or bring them in by sword?"

 kooras_what_they_call_artifice_title:0 "What they Call Artifice"
 kooras_what_they_call_artifice_desc:0 "The smallfolk have honoured their word, providing us with a plentitude of strange inventions and concepts they call artificery. particularly being the domain of their “Gommo”. Although it is a strange and unfamiliar use of both magic and the blood of holy Kseldos, it aligns both with our visions and our existing view of magic. Already the scholars of our society are using these new technologies to find the answers to the world's many mysteries such as the Riftwatchers and the Tunnels of Renewal."

 kooras_unite_the_tribes_title:0 "Unite the Tsahl"
 kooras_unite_the_tribes_desc:0 "Ever since the collapse of Sayab Kyin in 1420, Yaahsepaal has been in chaos, a grand wellspring of blood and violence as myriad Tsahl and opportunistic warlords fight for dominance in the shadow of greatness. No more. We have stood in the tide of blood, waded through death, and put a stop to this wellspring at its source. Now, all Kooras are united under our banner, whether through pen or sword and none can deny our authority. We must work together to build a grand society, one much greater than Sayab Kyin before it."

 kooras_making_amends_title:0 "Making Amends"
 kooras_making_amends_desc:0 "As we've grown in strength, distant dreams have come into the view of foreseeable reality. With many in our society claiming we could create a league of all Kooras, One people under One Tsahl. But to do so requires unity and understanding. There must be peace between ourselves and the remaining Tsahl and we must seek to unite with them through diplomacy, winning them over with nobility and honesty as opposed to might and ferocity. Only through the united consent of all Kooras can we truly be a Tsahl for them all."

 kooras_proclaim_the_federation_title:0 "Proclaim the League"
 kooras_proclaim_the_federation_desc:0 "Pacts have been made, alliances honoured, kinship forged. Our dream of a united Kooras, once adrift on the endless sea of possibility, comes ever closer to the docks of reality. Most if not all of the remaining Tsahl are closely ingratiated to us and already there is talk of unification, of our children growing old in a grand unified realm. Our leaders have decided to call a council meeting, not atop some grand stone monument, but in a humble wooden longhouse, the leaders of the Tsahl will proclaim unity on equal footing of their people, truly cementing we stand for all."

 kooras_singers_of_the_grass_title:0 "Singers of the Grass"
 kooras_singers_of_the_grass_desc:0 "The Kainpii people are known pastoralists, living off the land with their great goat herds, as such urbanism is relatively rare among their people and their Tsahl is notably decentralized. As we spread through Yaahsepaal, the Kainpii take their herds and have outpaced us in some aspects. These tribes of fierce warriors with notable land and a desire for independence can be… difficult to work with. We should give them considerable autonomy to keep their warriors content and let them better administer the wide open plains they inhabit."

 kooras_army_of_all_kooras_title:0 "A Glimpse of Thunder"
 kooras_army_of_all_kooras_desc:0 "As of late our Riftwatchers have been experiencing similar visions of a future most peculiar. Small men, some green,some pale, and some scaled, coming to the region. But regardless of their varied appearance one thing is common among them all in the visions. Great sticks of wood and steel that fire lightning and roar like thunder. Should our Tsahl survive the future we must adapt to these new age weapons long before these “Smallfolk” ever reach us."

 kooras_the_arrival_title:0 "The Arrival"
 kooras_the_arrival_desc:0 "What our Riftwatchers foresaw has now come to pass. Smallfolk of various shapes and colours arrive at our shores with their chaa'kák' in tow. More curiously than their weapons however are the many wondrous inventions and concepts they bring with them. In meetings with our Tsahl they have offered to give us access to their technology and its production in exchange for our help in navigating the region. We should assist them in their endeavours as they seem benevolent enough."

 kooras_sister_cities_title:0 "Sister Cities"
 kooras_sister_cities_desc:0 "Our relationship with the smallfolk of Haraf has proven both mutually beneficial and fruitful. The colonial conflicts and massacres that plague the rest of this continent failed to infect our lands, either due to our martial strength or our shrewd diplomacy. In the meantime, the smallfolk have erected great cities of their own across the region with Gommoport, Mestikardu, and Zurzumexia being grand wonders in architectural styles and fashions unknown to us. Yet this friction cannot last, if there is to be peace in Yaahsepaal we must seek federation with the smallfolk, at the tip of a sword or a pen."

 kooras_age_of_jaakaiin_title:0 "Age of Ja'akaiin"
 kooras_age_of_jaakaiin_desc:0 "A market bustles with activity as an Eordan trader negotiates price with a local businessman and his smallfolk assistant before being successfully outbid by a blue tinged Kheionai from afar, shaded, but not eclipsed, by grand temples and other such stonework. Sights like these become ever more common in our League when merely a century ago nothing but untamed jungle stood in these spots. We've become the hegemon of Yaahsepaal and arguably of all Haraf beyond. Settling the Water World's many islands and discovering what lay beneath the waters surface, delving deep into the tunnels and cenotes that dot our land, we've discovered much but the most meaningful discovery was that of a future for our people, one of union and alliance with the many peoples that have come to inhabit Haraf. Kseldos would be proud, knowing his noble sacrifice allowed life to flourish in a once doomed land."

 kooras_blood_wars_title:0 "Spirit of Unity"
 kooras_blood_wars_desc:0 "Perhaps the first Kooras were the Kaiinpi; the members of Tslakiir's Host who fled their home in the Haraf'ne savannahs to search for a better life in the jungles and plains of Yaahsepaal in the 670s. Perhaps the first Kooras were the Yamchiil, born during the 9th century AA out of the union of the Paleptaiinky, the Singing Watchers, and those Harafics who chose to settle alongside them in the great city of Tli'yam Kyin. Perhaps the first Kooras were the Leptone, who constructed Tsewee Kyin on the side of a seacliff in honor of their dead god Kseldos - and grew rich from the flourishing sea-trade of the period.\n\nIt doesn't matter who the first Kooras were: what matters is that today, we all are Kooras. We have been living apart for too long, but now is the time to start building towards a unified future."

 kooras_gather_the_tribe_title:0 "Gather the Tribes"
 kooras_gather_the_tribe_desc:0 "Kooras society is organized around the various Tsahl, large, decentralized tribal confederations which evolved from the similar Haraf'ne system of Kinah. The Tsahl group various semi-nomadic tribes together around specific settlements, where inter-tribal councils may be held, and whose ownership cycles between tribes according to a specific seasonal calendar in order to avoid land overuse and overcrowding around these often widely-revered and ancient cities. While this is our traditional system of government, if we want to build a unified Kooras civilization, we first need to gather the tribes who make up our Tsahl to represent a truly undivided entity in order to stand tallest amongst our kin."

 kooras_city_of_brothers_title:0 "City of Brothers"
 kooras_city_of_brothers_desc:0 "Tli'yam Kyin once occupied only one bank of the Nohyam, being a settlement of the Paleptaiinky centuries. Later, Tslakiir's Host arrived and built a settlement on the opposite side of the river. Eventually the two would unite as the Yamchiil and create a sprawling city that covers not only the land on either side of the river but the very waterway itself, owing to the hydrological mastery and union of the two proceeding peoples. Now, as we prosper, the city has been growing again and it looks to once more become the largest in all Yaahsepaal."

 kooras_the_water_arts_title:0 "The Water-Arts"
 kooras_the_water_arts_desc:0 "The prosperity of our society has led to a renaissance of art and architecture. As our population has expanded rapidly in recent years there is a higher demand for building infrastructure and idle hands not needed on farms. Art, once lost as the K'ajooin deemed it unnecessary, has returned to our society with emblazoned pottery and grand murals galore. Great stone temples rise into the sky as our knowledge of stoneworking improves significantly. Most important to our society however is the great hydrological wonders we've come to create: grand aqueducts that bring water to whole cities, improvements in farm irrigation, the ability to divert or otherwise control rivers. We've become one of the greatest hydrological societies of Aelantir with many people coming from all over Haraf to learn and gaze upon our Water-Arts."

 kooras_the_torn_land_title:0 "The Torn Land"
 kooras_the_torn_land_desc:0 "Many water elementals such as the great Chiilluil and the lesser Wavebeasts and Tidestriders call the Torn Sea home. Being such noble servants of Kseldos that they are, we feel little of the anxiety at the sea that plague the minds of many other Ruinborn. Thus, much like ages ago Chiiluil guided our Leptone cousins to the Guardian Islands, we too must stake our claim to the great azure expanse and its many islands."

 kooras_across_the_waterworld_title:0 "Beyond the Horizon"
 kooras_across_the_waterworld_desc:0 "Although we lack the knowledge of the Caamasi to build great seafaring ships, we have the loyalty of the water elementals, honorable servants of Kseldos, as well as the magic of our Ja'adkali, the most studious of the Water World there ever was. With the waves and beasts of the sea on our side we'll go yet further than the Caamasi dared to tread and search every pathway of the wide open sea."

 kooras_blood_to_afar_title:0 "Restore the Sea-Trail"
 kooras_blood_to_afar_desc:0 "For ages strange traders from far away Eordand and blue hued explorers from places yet unknown to us have occasionally come to Yaahsepaal. Every time they have exotic goods on sale and tell wondrous stories of their far off homes. Now, we too can ply the waterways of the world as the Caamasi have. Although our boats are smaller and more personal, each one is helmed by a Ja'adkali, a water mage able to take them further out to sea than ever before. Knowing from previous encounters that the traders frequently pay large sums for our damestear, we shall export it ourselves rather than wait for them to come to us."

 kooras_in_honor_of_kseldos_title:0 "In Honor of Kseldos"
 kooras_in_honor_of_kseldos_desc:0 "Overlooking the Haraf from high upon and on a cliff rests the city of Tsewee Kyin. Not just important for its geographic position but also for a subterranean temple known to our people as K'il'uil Siiken, a grand monument of Kseldos made of the greys of stone and the ethereal blue of Damestear. Such a masterpiece of our religion stands to become an important center of pilgrimage and worship for the Ja'akaiin faithful should we develop the city further."

 #Events

 kooras_events.1.t:0 "Resettling Ancestral Homes"
 kooras_events.1.d:0 "Perhaps the city of Vap Kyin once proudly wore its name as the Green City because of its magnificent gardens and jade mosaics; now, however, the name was only apt to describe the luxuriant jungle greenery that had overgrown its stony steps. [Root.Monarch.GetTitle] [Root.Monarch.GetName] and [Root.Monarch.GetHerHis] retinue had been searching within the labyrinthine streets of the ancient settlement, winding between tall pyramids and ruined market stalls for hours before they could find what they had been looking for: a small set of well-used steps leading down to a circle of candle-lit rooms.\n\nEven during the days of the Paleptaiinky, when they were the very ones to govern the cities, the K'ajooin were hidden from sight - by purpose, of course. Indeed, their goal was to serve as repositories of knowledge to allow the common people to live in blissful ignorance: even the very process of asking for their advice was a highly ritualized affair, so as to not accidentally create an external source of expertise which could corrupt their society.\n\nThe K'ajooin Societies, rather unexpectedly for groups with such specialized knowledge, were nothing if not good survivalists and hard workers to maintain the ancient cities of the Paleptaiinky “intact”. Of course, while the work of less than twenty sages clearly wasn't enough to keep their ancestral homes untouched by the passage of time, that many of the buildings of Vap Kyin even stood tall after these few hundred years was testament to their dedication to preservation.\n\nThe society which took care of Vap Kyin seemed to have served mainly as a source of knowledge regarding the creation and use of magical foci. While their mastery over this craft could have served the Kooras well, [Root.Monarch.GetName] knew that this knowledge would be inaccessible to [Root.Monarch.GetHerHim] before at least three generations of trust-building and belief-changing. Instead, [Root.Monarch.GetSheHe] was here today to negotiate the rights for his people to resettle Vap Kyin for the League of All Kooras, which, in ironic K'ajooin fashion, was a much easier agreement to reach (although, not exactly easy either, as the K'ajooin were renowned for being hard to understand because of their esoteric turns of speech - again, by purpose). Per usual in this kind of deal, the society would retain the nominal administration of the city, although how much hold they would have over the new settlers was still unproven."
 kooras_events.1.a:0 "A small price to pay to reclaim the interior of Yaahsepaal."

 kooras_events.2.t:0 "Forever Our Rival"
 kooras_events.2.d:0 "When our ancestors rebelled against the First Kinah Federation, we did so to be able to live our lives in a land that was all our own, without the ever-encumbering presence of greater tribes than us forbidding prosperity to our people. While the Kinah Federation spoke of unity, prosperity, and peace, the Kinah and ways of lives of our ancestors were neglected in favor of the Great Kinah. Most damning, they had forgiven and even granted power to Kinah Keiin'achi, despite their dangerous beliefs and their previous actions against the Ch'inbaide peoples!\n\nIt has been centuries since then, and as the Kooras became themselves, trade and cooperation with the Haraf'ne became widespread once more. However, it seems that the Kinah Federation, now on its third iteration, still cannot keep its own promises to the Haraf'ne. Only a few decades ago did a new Lord of Fire, Tehre'tseelo, rise up amongst Kinah Keiin'achi, in a period of great internal turmoil of the Federation; the Ashen Council was almost dissolved, as even the rest of the Great Kinah refused to travel to Nani Kinn, and Tehre'tseelo cause widespread devastation across the savannahs. If the ruling Kinah Alas'gasidi cannot see the fundamental threat that Dikaal's worshippers cause to their survival and instead keep focusing on seizing more power for themselves, we can have no peace with their shameful federation.\n\nWith tales of our prosperity spreading up the Nohyam's flow, many minor herding Kinah have already started flocking to our lands. While they mistakenly express their disarray as fear rather than anger towards the Kinah Federation, we have reassured them that today, there is no need for our Haraf'ne cousins to rebel and leave their homes: the League of All Kooras will protect all, even beyond Yaahsepaal."
 kooras_events.2.a:0 "No longer will the Kinah Federation reign uncontested over their people."

 kooras_events.3.t:0 "A Seat Around the Bonfire"
 kooras_events.3.d:0 "The great bonfire crackled as the sun set over Nani Kinn. Tonight, just like thousands of nights before, and thousands of nights thereafter, the chiefs of the five Great Kinah had been called for an Ashen Council to deliberate and decide on policies for the Kinah Federation. However, this night, a sixth figure rested in the light of Nani Kinn's bonfire: the [Root.Monarch.GetTitle] of [Root.GeName]. [Root.Monarch.GetHerHis] presence as an observer of the Ashen Council was already enough of an exception to the Federation's traditions, that [Root.Monarch.GetSheHe] did not have the right to speak at all during the session.\n\nThe first few hours of the council were dedicated to rather mundane affairs. Even with the unprecedented presence of [Root.Monarch.GetName], the Haraf'ne chiefs always had dozens of matters to attend to: resource allocation, an unruly faction of the Rider's Assembly, tribal confederations in the desert, the organization of the year's World Songs festivals across the Dai'Nadeilhil priestly hierarchy, and many more yet…\n\nWhen the topic finally turned to the League of All Kooras, even the proud Datai'tsel chief could not save himself from a quick glimpse at the concerned party, who was still maintaining a stoic silence.\nThe first to speak was the chieftain from Kinah Hoila'kosu: “As you have seen tonight, [Root.Monarch.GetTitle] [Root.Monarch.GetName] knows to respect our traditions. The Kooras and us have long traded, and their new so-called league has seen their civilization rise to heights that may one day even catch up to ours. I see no reason not to create a closer relationship with them.”\nThen, the Keiin'achi. “I have no qualms with the Kooras. But we all know that in this case, creating a closer relationship means allowing your Kinah to obtain advantageous trading rights with a growing power close to you, and we cannot allow your greed to strengthen a potential rival to the federation.”\n“Please, we cannot claim to be the protectors of the Harafics if we refrain from dealing with our southern cousins. I'm sure [Root.Monarch.GetName] holds no ill will towards the federation.“ retorts the Leeti'haàt.\nFinally, the Alas'gasidi, ruler of all the federation. “Perhaps a stronger League of All Kooras would be beneficial to the Kinah Federation… Fine. The Kinah may be allowed independent diplomacies with the league, and we will designate an area of Nani Kinn for a Kooras embassy. However, this is on the condition that they respect our authority, and show no favoritism towards any Kinah. Understood?"
 kooras_events.3.a:0 "[Root.Monarch.GetName] nodded in silence."

 kooras_events.4.t:0 "Expanding the League"
 kooras_events.4.d:0 "The wars against the Kinah Federation have gone well. Already, the western half of the Haraf'ne have been integrated under the League of All Kooras, with Kinah Hoila'kosu agreeing to bend the knee and be integrated into our realm as a new Tsahl, centered around their ancient tunnel-city of Nean'kabahn.\n\nIn fact, today marked the first official visit of the Hoila'kosu chief to Tli'yam Kyin. In the depths of the Nochtsaneiin, the House of Kings, which houses the rulers of the Yamchiil and now of the League of All Kooras, the Hoila'kosu ruler could finally properly speak of his plans in private:\n“The remaining Great Kinah are still too prideful and entrenched in their traditions to dissolve the Ashen Council, which means I still have a seat there. Whatever my allegiance to you may be, they will allow me to take part in the sessions. I know that your people dislike the Kinah Federation, but we Haraf'ne have been living as part of it for centuries now. We cannot just destroy such a venerable institution; however, we can change who presides over its great councils. My proposal is simple: with the military prowess and prosperity of your people's realm, we can work together to bring the rest of the Haraf'ne to heel without the need for such crude conquests, by simply pushing for my Kinah's dominance in the federation. You already know of my loyalty to you, and the federation's inability to defend itself now, so you have no reason to believe our Kinah's rule would be hostile to the league. What better way is there to ensure both the contentment and the prosperity of the Haraf'ne?”"
 kooras_events.4.a:0 "That is an interesting proposal to consider…"

 kooras_events.5.t:0 "Kinah or Tsahl?"
 kooras_events.5.d:0 "Today was the Day of Bounty's Choosing in Nean'kabahn. Today, in parallel with one of the grandest festivals of Haraf, the richest farmers of the region would elect the new members of Kinah Hoila'kosu's ruling council. And today would be decided the future of the relationship between the League of All Kooras and the Kinah Federation. The chiefs of both every major Tsahl and every Great Kinah had come all the way to the city for the festivities, a somewhat unprecedented event as even the other Haraf'ne chiefs rarely had much interest in the republican customs of Kinah Hoila'kosu.\n\nIndeed, there had been a growing movement amongst the Hoila'kosu that sought even closer connections to the Kooras as the two peoples grew closer following the Ashen Council which formalized relations between the Kinah Federation and the League of All Kooras, with the ultimate goal of perhaps even integrating the Kinah into the latter. Technically, the Kinah Federation only existed insofar as it grouped every tribe impacted by the decisions of the Ashen Councils: considering they were allowed to hold an independent diplomatic relationship with the Kooras, nothing stopped the Hoila'kosu to be part of both the league and the federation.\n\nThe stake of this Day of Bounty's Choosing was hence whether the oligarchs of the Kinah would choose to support this idea, and elect leaders who would act accordingly; sure enough, when the results were revealed, the face of the Alas'gasidi chief took on a color previously unseen on such as ashen-skinned Harafic.\n\nIt soon became clear to the other rulers of the Great Kinah that they could do nothing that would not be perceived as undue antagonism towards either the Hoila'kosu or the League of All Kooras. This situation did, after all, fit within the ancestral laws of the federation. Of course, the Kooras chiefs had anticipated this scenario, and managed to assuage all the concerns of their Haraf'ne peers, who always left their meetings adorned with some brand-new mysteriously acquired Damestear and pearl jewelry."
 kooras_events.5.a:0 "We welcome this new addition to the League of All Kooras with open arms."

 kooras_events.6.t:0 "Learning from the Smallfolk"
 kooras_events.6.d:0 "When Dichenen discovered that she was born with some magical talent, she made the choice of orienting herself towards the arts of Ja'adkali. It was an uncommon choice, as most arcane-talented mages would have become Kaiineloo instead, but not unheard of either. In the end, it didn't matter, because not late after growing into adulthood, she had already moved to Sutsumek Kyin, where she was learning the craft of artificery under the mentorship of a middle-aged kobold teacher.\n\nHer brother, on the other hand, had recently joined a K'ajooin Society which had apparently lived in their home city for more than a thousand years now. Becoming a K'ajooin was a highly-selective, sacrificial, and ever-more deeply unattractive process for most Kooras. She didn't understand how their societies managed to keep their numbers steady in this day and age, all the while they still refused the great majority of potential candidates, but in all fairness, how they managed to even slightly interest her brother into joining their strange order was already beyond her grasp. One thing that was for certain though was that they weren't happy with the recent developments of Kooras society: the influx of new technologies and ways of thought from Cannor were surefire signs of civilizational danger - not because of their foreign origin, but because they represented yet another source of knowledge they could not block.\n\nPerhaps he was right in some way, with all his talks of “blissful ignorance”, because this entire artifice business certainly didn't prevent her from getting headaches. The latest invention in her lists of concepts that were way too hard to understand for their relatively simple function was a new model of pump created by her tutor. A pump! She could do its job with way less complicated machinery back when she was 14 years old. Of course, not everyone could, which was why they needed to develop this kind of technology in the first place, and in fact, her knowledge in the manipulation of water had been a great help to help refine its inner engineering. Indeed, while the tool remained mostly mechanical-based, a little automatized magical water-lifting process certainly did not hurt its efficacy."
 kooras_events.6.a:0 "Pumps may not be the most flashy tool, but they're never unhelpful…"

 kooras_events.7.t:0 "A Wavecrossed Meeting"
 kooras_events.7.d:0 "Iwandar had just arrived in Tsewee Kyin, docking his ornate cargo ship adorned with the sigils of the summer at the foot of the great sea-cliff. As soon as he arrived, he was greeted by Netsaliip's servant, who guided him through the complex way up the cliff towards the abode of the Kooras trader. They scaled one string of steps, the another, and another after that, always a few inches and a carved guardrail from the vertiginous drop into the azure waves below, before entering the deep cave system which held the heart of the city. As they approached their destination, Iwandar could notice the lighting from grand lanterns be gradually replaced by an ethereal teal glow which seemed to coat the entirety of the caverns, but before he could catch a glimpse of its source, the servant showed him inside a grand troglodyte house: they had arrived.\n\nIwandar found Netsaliip already engrossed in conversation with another, rather bluer elf. A Kheionai, most likely. “Oh, it seems my other guest has already arrived!” greeted the cheery trader. “I'm sorry for the inconvenience, if you would rather have dealt with me on your own. To be frank, I did not expect both of your travels to end in such a close interval! I'm sure you will find plenty of common ground with my good friend, however.”\nThe Kheionai welcomed Iwandar in turn, speaking in heavily-accented Kooras:  “Welcome. My name is Darastarthes. I presume you are from the land of Eordand?”\n“Indeed, and you must be one of the Kheionai. It's odd really, to meet here in Haraf instead of either of our lands: our family histories tell plenty about their travels across the western seas, but they rarely speak of the Kooras. Perhaps my ancestors had simply never seen the beauty of Tsewee Kyin.”\n\nAs the day progressed and enough pleasantries had been exchanged, the time was to properly talk of business. Iwandar proposed great pelts of unseen beasts, wooden amulets and colorful dyes; Darastarthes had brought artisanal wonders from the Kheions, such as Kaydhano glass, fine silk and aged wine. Both went quiet when Netsaliip revealed his stock, however: neither had ever seen a stock of Damestear so tall. Indeed, his close relationship to the shamans allowed him to receive a good portion of the finds from the Blood Dives. Both Kheionai and Eordan could only fight tooth and nail then: the promise of Darastarthes to bring back rare books from Lokmeion was what won him the largest portion."
 kooras_events.7.a:0 "At least we know that they will tell stories of us to their children now."

 kooras_events.10.t:0 "The Council of Tli'yam Kyin"
 kooras_events.10.d:0 "On the largest island of Tli'yam Kyin, the greatest assembly in all the history of Haraf has been gathered, surrounded by the auspicious streams of the Nohyam, the great river of brotherhood. It is here that Tslakiir first met the Paleptaiinky with his Harafic host, 800 years ago, here that he decided to settle, hoping for a better life for his people than in the northern savannahs, and here that his descendants are now building a unified society together.\n\nThe beginning of the council is dedicated to negotiations. Every tribe of every Tsahl across the land is present in some capacity, but standing as proud and respected figureheads above all are the leaders of the Yamchiil, Leptone and Kaiinpi, speaking for those who imposed themselves as the greatest Tsahl. Diplomatic talks do not take long, however, as much of the work has already been done: after all, if most of the participants even accepted to travel to the City Upon the River was because they already held faith in the notion of the League of All Kooras.\n\nThe rest of the week is a time of celebration. Through countless traditional ceremonies, every tribe shares their traditions, their culture, their arts and their magic. A group of Kaiineloo and Ja'adkali unite their talents to create a great pyramid out of rushing water in the middle of the Nohyam, Riftwatchers nearby slightly embarrassed that their magical talents aren't nearly as spectacular. Children share their excitement to take part in the Blood Dives or receive their first Riftwatching vision, while elders recount their stories of the elemental Chiiluil or the iron-fisted hegemony of Sayab Kyin.\n\nTo close the council, a great conclave of shamans is called on the shores of the river, knees halfway in the water and faces adorned with Damestear powder, the blood of their god. For their rapt audience, they speak of what it means to be a Kooras. For the Kaiinpi, it is reverence, for the Leptone, it is worship, for the Yamchiil, it is vision, but for all, to be Kooras is to be greater than the sum of your parts: it is to be greater than your mother and your father, greater than your birth and your experiences, greater than Harafic and Paleptaiinky."
 kooras_events.10.a:0 "Today is the day the Kooras civilization is truly born!"

 kooras_events.16.t:0 "The Gilded Prison"
 kooras_events.16.d:0 "This morning, just like every morning, the Nochtsaneiin was quiet. The great building stood tall over the rest of Tli'yam Kyin, surrounded by the streams of the Nohyam and the stilt houses of the river-city. Built on the halfway point between the original Paleptaiinky and Harafic settlements which now made up the great city of the Yamchiil, the Nochtsaneiin, or House of Chiefs, was a symbol of the meeting of two peoples, and of the kingly authority the Tslakiirpaal dynasty inherited from their eponymous ancestor. And just like every morning, its patriarch Kilenchoom wished only sit, eat and sleep, rather than lead his people.\n\nThe priest-king of Sayab Kyin had ruled over much of the Kooras in great part thanks to the influence the K'ajooin Societies, who flocked to support one of their own's attempt at returning Yaahsepaal to the days of Paleptaiinky obscurantism. While the Yamchiil had led the rebellion which overthrew Sayab Kyin's hegemony in the region, the societies were still both highly secretive and highly influential among the Kooras. Now, just like the priest-king held their family captive in the wellspring city, the Tslakiirpaal stayed in the Nochtsaneiin as to leave the rule proper of Tli'yam Kyin to the esoteric societies.\n\nAnd Tiilachii Tslakiirpaal was not happy with this situation. “Brother, we need to talk.” announced the young elf entering his chief's room. “You stay here all day, while the same people who bowed down to Sayab Kyin's hegemony continue to hold a disproportionate hold on our Tsahl. What about the rebellion? What about the unity of our people?”\nKilenchoom sighed, clearly already annoyed by Tiilachii's antics. “Don't you see this is what Tslakiir would have wanted? We have everything we may ever need in this House, and no need to risk our minds by learning things we shouldn't have known. If his legacy was to have rejected the K'ajooin, we would have been born south, among the Kaiinpi. There is no need for a time of change: stasis is the answer to all society's worries, just like it has been since the days of the Paleptaiinky.”\n“You know what? Fine. You can stay here, naive and pampered. But Yaahsepaal is changing now, whether you want it or not. If I go out, and tell the people of the city that you died and passed down rule to me, they would believe me. I don't think they even know your face. I don't think you even care enough to show it to them.”"
 kooras_events.16.a:0 "Perhaps. So be it. But don't come crying when the K'ajooin's predictions come true."

 kooras_events.17.t:0 "Coming of Age"
 kooras_events.17.d:0 "The atmosphere within the Leptone Tsahl was electric this day. Young adults from every member tribes of the Tsahl had gathered for their great ritual of passage to adulthood, the Blood Dives. They flocked around the assemblies of Ja'adkali, already fully prepared for the spells and prayers that would precede their first dive into the deep ocean, the greatest realm of the Water World.\n\nAs Lechelo approached her designated guide for the day, she could not help but feel apprehensive: of course, she had learned all the steps of the rituals, and the, twice more, perhaps even more dutifully than anyone else she knew, but she had always been the least athletic among her peers in the tribe. She didn't want to fail under the pressure of fifty fathoms and return to her people empty-handed. She wanted to honor her dead god.\n\nAfter multiple hours of preparations, the groups were ready to be sent. They had all been warded, given breathing amulets, taught how to properly move underwater, given small waterproof lanterns to light their paths in the depths, and many other precautions. The Blood Dives were nothing if not well-prepared for any possibility.\n\nThe feeling of sinking was terrifying and wonderful at the same time. The sun's light faded away above Lechelo's head, before she found herself deep enough to not recognize the difference between up and down anymore. Thankfully, the concentric hermetic seals placed on her allowed her to stay so deep beneath the surface without being crushed by the overwhelming pressure around her. Quickly, she realized that the most overwhelming feelings of the deep ocean were not fear, or wonder, or immensity, but simply the freedom and peace of existing here, in the moment. It was the first time she felt like her thoughts had stopped, replaced by an all-ecompassing bliss.\n\nAfter hours of searching, Lechelo had to resolve herself: she was already too tired to continue for much longer. She felt calm when making her decision - in the end, experiencing Kseldos' domain was more important than any physical reward she could bring back. While returning to the surface, however, she did find something: a small water elemental, taking the form of a bubble floating in the middle of the currents with only miniscule eyes to prove its sentience. She stopped in her ascension to cradle it, since it seemed lost. When it opened its grateful eyes, she knew it had become her patron, and her, a Ja'adkali."
 kooras_events.17.a:0 "Perhaps becoming an adult could mean a lot of different things."

 kooras_events.18.t:0 "Sheperding Harmony"
 kooras_events.18.d:0 "Recently, as the Kaiinpi Tsahl has expanded their pastoral lands across Yaahsepaal, some tribes that are members of the Tsahl had begun to reach the territory of even the borders of the Kinah Federation. The exact line of demarcation between their tribal territories are blurry, so conflicts between the Kaiinpi tribes and minor Haraf'ne goatherder Kinah had started becoming common.\n\nNear the eastern borders of the Kaiinpi, however, something unexpected happened, as two herders discovered that they came from similarly-named tribes. Indeed, fate had decided to unite a Kaiinpi with another descendant of the Ch'inbaide, who had so long ago made up the majority of the members of Tslakiir's Host. The Ch'inbaide had in major part disappeared among the Kinah Federation, but, near the jungles where they first arose, there were still some traces of their legacy.\n\nOver the years, the two herders grew close, sharing myths about their ancestors and traditions passed down by their parents, comparing where they could meet, and where they diverged. When the Haraf'ne herder passed away, the Kooras made sure to bury him deep beneath the soil for him to grow into his own plant someday, as was the Ch'inbaide way, despite the practice having died down among the Ja'akaiin faithful. Perhaps there was something that could unite the disparate ashen-skinned Harafics closer than they thought after all."
 kooras_events.18.a:0 "Kooras and Haraf'ne only make one greater whole in the end."

 kooras_events.19.t:0 "Eyes Closed, All-Seeing"
 kooras_events.19.d:0 "When Tiilachii received his first Riftwatching vision, he had already been ruling over the Yamchiil for years. It was certainly an unexpected experience: most Riftwatchers knew of their condition since their late childhood, at most. That the first vision would come so late was unusual, but not unheard of either. In truth, not much had been unheard of when talking about the workings of Riftwatching, which was why it had always been so arduous to understand how it worked at all. With the knowledge he had gathered from the Ni'lik Society, the chief of the Yamchiil had decided to use this opportunity to try and organize a grand communal Riftwatching ritual among the powerful Riftwatchers of his Tsahl.\n\nThe room where it would all go down had been meticulously prepared beforehand: a large part of the control of Riftwatching they had managed to understand from the teachings of the K'ajooin regarded the Riftwatchers' normal senses. As to both over- and understimulate their perception of the world, the room had been filled with large lanterns, beacons, dyes and gems in a frankly blinding display of Yamchiil art. When the Riftwatchers arrived, however, they had all been carefully blindfolded, so as to not distinguish anything beyond vague plays of light and shadow just beyond their vision.\n\nAs incense, chanting, soporific herbs and deep meditation were progressively introduced to the ritual, Tiilachii could start to see the shadows dancing in shapes that vaguely resembled elves. And then, he could hear them, and touch them, the shadows of elves who played the story of his people before him. A tall elf, then a taller one, embracing under the starlight, then a grey-verdant city abandoned. The cycles of life and death and love and birth, as a young infant rose from the water with carefree laughter.\nTiilachii knew it was the future then, because he knew it was, and because the light of the sun had started to become teal. Drowning, three and three more into one, and the sounds of worship. As he searched, learned, knew, the light became brighter and brighter, and he could see…\n\nWhen his blindfold ripped, he was blind perhaps, or simply still in a vision - one of black all around, and nothing at all, except the deeper void left by the rip itself."
 kooras_events.19.a:0 "My head hurts… What could this mean?"

 kooras_events.21.t:0 "Our Prismatic Guardian"
 kooras_events.21.d:0 "Lechelo felt anxious about the coming dive in a way she hadn't felt ever since her original Blood Dive. Her apprehension was not because of her experiences with the raptures of the deep; no, in fact, that experience helped the community of Ja'adkali understand the effects of the deep sea on the mind better than before, which allowed them to . Why she felt so nervous was because today, she would be seeking out Chiiluil, to see whether her prolonged absence was truly a test to their people.\n\nA group of the most powerful Ja'adkali in all the Tsahl had gathered in Tsewee Kyin. In order to brave the deepest reaches of the ocean any Kooras had ever breached, they needed all of their powers to navigate the ocean floor, and Lechelo had been invited to take part in the expedition.\n\nThe dive went without issues. Thanks to Lechelo's previous experiences with the dangers of the depths, the Ja'adkali knew what to avoid, and their combined mastery allowed them to search and navigate throughout the waters with efficiency and experience.\nAnd then, they saw it. Hidden within a crevice, at a depth where nearly no sunlight could filter at all, a powerful prismatic glow the likes of which they had never seen before. As they approached the fissure, they knew that they had reached their destination. A great being There were no words needed to be spoken beneath the water between either of the Ja'adkali or Chiiluil at this moment. Chiiluil was gracious, beautiful, powerful! … and she was looking at them with the eyes of a proud parent. Truly, such a being would never abandon them.\n\nImmediately, the great elemental took the Ja'adkali under her fins. No longer would they have to tire themselves in search of their guardian: now, they could simply accompany her as she rose once more to meet the people of the Leptone Tsahl, and see how they now fared in this world."
 kooras_events.21.a:0 "Chiiluil has come back for us!"

 kooras_events.23.t:0 "Curing the Knowledge-Sickness"
 kooras_events.23.d:0 "In usual cases, the K'ajooin Societies recruit new members through the basis of examining volunteers over an arduous process that sought to examine their devotion to their beliefs and their readiness to isolate themselves from the rest of society, followed by years of specialized learning destined to initiate them to the secrets of that specific society. However, there is a particular society made up of less willing members: the Ni'lik Society. Indeed, the Ni'lik Society is tasked with transmitting ancient knowledge about the origin and control of Riftwatching. They are undoubtedly the largest and most influential of their kind, spanning across cities around all of Yaahsepaal, in contrast to many of their more isolated peers. Because of their belief that the minds of powerful Riftwatchers will always eventually be corrupted by unwanted knowledge, they consider them knowledge-sick by default, and hence force any Kooras to take their vows of secrecy as soon as they showed too much Riftwatching potential.\n\nTiilachii had traveled all the way to the cliff-city of Tsewee Kyin to meet the Ni'lik and deal with this practice. “I don't know why you insist on keeping our people from living and progressing freely. But I know that we cannot let you continue forcing our Riftwatchers into your strange society.”\nThe K'ajooin which came forth as the leader answered in their typical cracked voice. “Listen. If we told you more about our purposes, and why knowledge is the ultimate threat to your people, you would know too much - which is, again, the ultimate threat to your people. The K'ajooin have always known of the danger of falling into curiosity, whatever the purpose of that quest for knowledge might be, and cannot blame you for it. But we also cannot allow powerful Riftwatchers to go and spread their uncontrollable visions around all of Yaahsepaal.”\n“And what have these ideas granted us? Thousands of wasted opportunities to know of the future of our people, to prepare for what the unknowable mists of time hold for us! If you just fear that the Riftwatchers will tell us of things, then just teach us your so-powerful secrets to control their visions. We. Need. To. Know.”"
 kooras_events.23.a:0 "If there is no changing your mind, we should at least teach you how to use it responsibly."

 kooras_events.24.t:0 "Voices of the Ancestors"
 kooras_events.24.d:0 "There had been a death in the tribe recently. Keseiilo didn't know much of the elder who passed away, but he knew enough that he understood what his role within the tribe would be in the following days. Indeed, as a Kaiineloo, it was his duty to honor the ancestors, and guide his people out of grief and into glory: a member of the tribe so respected as the elder was sure to require an appropriately esteemed ballad. Apparently, the elder had mostly been a successful farmer in his life, as well as a beloved father to many children - cultivation, growth, nurture. The elf had surely joined the Rain after his passing, the realm of the Water World which healed and brought new life to the land every time it manifested.\n\nKeseiilo took place in the central court of the Tsaneiin his tribe had been staying in. He called the people to attend his performance: the rite of remembrance would start soon.\nAt first Keseiilo only sung with his own voice. His song wasn't particularly remarkable; every member of the tribe, young or old, had already heard that particular elegy before. But then, he was joined by the voice of the elder, hauntingly beautiful, who called out to the people he remembered. Slowly, as the song rose through the verses, more and more of his peers in the Rain joined the song. A harmony of hundreds of voices, who all spoke of the virtues of their realm. Of giving, and working, and nurturing, and flourishing. This is the true magic of the Kaiineloo: not the quality of his own voice, but the channeling of those of the departed.\n\nNo longer would the elder be part of the material world, in constant back and forth between the Water World and the Dark World. Now, his soul would join the Rain, and dissolve into the virtues of that realm. The members of the tribe could pass on their memories of the elder to the Water World, as he now needed to be freed of his individuality. Instead of grief for his loss, the attendees had been reminded that day of all the elder stood for, and what they needed to strive towards to honor his memory, as well as that of all those like him."
 kooras_events.24.a:0 "Whatever his name might have been doesn't matter now. Only the Rain does."

 kooras_events.25.t:0 "Raptures of the Deep"
 kooras_events.25.d:0 "Lechelo had been growing into her newfound role as a Ja'adkali rather well. Her elemental patron, who had been titled Kénchaiil by her superiors for its beauty and fragility, had adapted well to the more amphibious life it had now chosen to lead, mostly thanks to the conscientious care Lechelo granted him. She had created a special pouch to store Kénchail in, as to always keep it safe and close to her while they were on solid land. A bubble was so easy to accidentally pop, after all.\n\nThanks to her newfound powers, she was allowed to dive into the deep sea often, as she could use her magic to deal with most of the complicated spells that were necessary to keep non-mage Kooras safe during the Blood Dives. Although Kénchaiil seemed small and fragile, it was far from powerless, even compared to the patrons of most of her Ja'adkali companions. In particular, its ease in controlling air bubbles thanks to its nature allowed Lechelo to have little fear for her protection against the elements of the depths.\n\nToday, Lechelo had gone diving once again, in part to explore some new portion of the ocean floor, but in greater part to feel at peace once more. Except, this time, she chose to go even deeper than usual. As she dove down and down, closer to the core of the earth than she had ever been, something started to shift in her. There was a new feeling, one quite different to those of her usual dives: it was not calming, but exhilarating. Perhaps this was it, the true realm of Kseldos, pristine and uncorrupted. She wanted to just leave it all behind, and live down here, below everything bad that may happen in the Dark World. She wanted… to… sleep…\n\nWhen she woke up, she was back at the surface, safely snuggled in a bubble thicker than she had ever seen. Kénchaiil was over her, its face making an expression as close to worried as it could."
 kooras_events.25.a:0 "Perhaps the true danger of the deep is simply to love the Water World's beauty too much."

 kooras_events.26.t:0 "The Foreign Cities"
 kooras_events.26.d:0 "The settlement of the smallfolk on the coast of Haraf had propelled changes in the region at lightning speed. Truly, despite their strange customs, the smallfolk are an intriguing people: their technology, their government, their language, even the way they set up their cities was previously unknown to us. However, this doesn't change the fact that they settled in Yaahsepaal, our land, without our agreement. While we may try to be benevolent and understand their wish to live in the great land of Kseldos, we cannot simply let them live on our land without dealing with this matter.\n\nTo remedy this, we had sent an envoy from each major Tsahl to each of their cities: one from the Yamchiil to Gommoport, one from the Kaiinpi to Mestikardu, and one from the Leptone to Zurzumexia. Today, the first response came in Tli'yam Kyin, from Gommoport. Their small people look the most like our own, yet they feel in many ways the most alien to us, with such an individualistic and impersonal outlook on life.\n\nTheir delegation presented us with every possible logical argument as to why their presence was useful here: they can bring new technologies, economic advances, diplomatic connections to the distant continent of Cannor, while we weren't even fully exploiting the territory they now live in! While many of these do make sense, it seems that they still haven't understood the right our people have towards this land."
 kooras_events.26.a:0 "We will not let them run their little operations by themselves in the land of our ancestors!"
 kooras_events.26.b:0 "They seem well-intentioned enough. We can give them some time to understand."

 kooras_events.27.t:0 "Arrival of the Small"
 kooras_events.27.d:0 "As Aelantir reconnects to the wide world of Halcann following its rediscovery by Cannorians, there has been a great influx of new settlers trying to claim the lands of the continent. We have been following such developments around the continent for a while now, but the unified strength and advantageous position of the League of All Kooras has allowed us to stay rather free from worries of strangers invading our shores.\n\nHowever, those who have arrived recently aren't exactly here to invade. Three different groups of small races, previously completely unknown to us, have wished to settle on our lands: the “gnomes” say that their old overlords were too overbearing on their clan, the Gommo, and they decided to seek new lands for themselves; the “goblins” talk of how they were forced to flee their homes thrice, before finally finding a land where they could nurture a new future for themselves; and the “kobolds” speak of their old kin, who didn't wish them to seek the knowledge that could allow them to grow into the best forms of themselves.\n\nTheir struggles we can understand from our own history, and the League of All Kooras has plenty of land and empty cities to allow them to settle in. Even though their customs may be foreign to us, we Kooras were born of a fusion of many peoples, and as a new chapter of our civilization opens it only makes sense that a new people would come to join our story."
 kooras_events.27.a:0 "Let them settle! One day, they will show us their own concept of what it means to be Kooras."

 kooras_events.28.t:0 "Our New Partners"
 kooras_events.28.d:0 "Over the last few years, the smallfolk who settled in our region have slowly integrated into our way of life and our traditions. As they come to understand what it means to be Kooras, their younger generations have been starting to consider themselves an integral part of the League of All Kooras, and have formed three entirely new Tsahl to represent their cultures within our frameworks.\n\nThe Gnome Tsahl, centered around the city of Yomo Kyin, is made up of those still most reluctant to truly adopt the ways of life of Yaahsepaal. They dislike foraying too far beyond the confined walls of their cities, and lack much enthusiasm to partake in the worship of Kseldos. However, one thing they have brought to our people is their scientific rigor, which has completely changed our manner of thinking about the world. We know now that everything must have an answer, which must be sought if we are to truly understand our place in the universe.\n\nThe Goblin Tsahl, centered around the city of Metsli Kyin, has a rather odd relationship with the original Kaiinpi Tsahl. While the other two smallfolk races are not able to make children with the ruinborn elves, the goblins seem to have this ability to a small degree. Indeed, half-goblin half-ruinborn children, called the Voltoj, are themselves infertile. Because of their already high degree of intermixing with the Kaiinpi, the two Tsahl have hence decided to take on the shared role of parenthood towards these tribeless peoples, quickly forming a bond stronger than between any of the other Tsahl. The goblins have been more than happy to leave the still-fresh hyper-urbanized customs of the Bayveki in favor of a semi-nomadic lifestyle closer to that of their cousins in the Serpentspine and in Escann, although the development Metsli Kyin has been far from neglected.\n\nFinally, the Kobold Tsahl, centered around the city Sutsumek Kyin, have been strangely keen to adopt our worship of Kseldos, and of the Ja'akaiin faith in general. Their bio-artificers have been working in close partnership with the Ja'adkali to understand how the Blood Dives are possible: perhaps the sight of Chiiluil has replaced their wish for the freedom of flight by the call of mystery from the depths of the sea, as they are already thinking of ways to adapt bodies to survive underwater without magical help."
 kooras_events.28.a:0 "Three Tsahl then, and three Tsahl more, but always one people."

 kooras_events.29.t:0 "The New League"
 kooras_events.29.d:0 "We have been working in close tandem with the smallfolk cities which decided to settle in Yaahsepaal after the rediscovery of Aelantir. After we graciously allowed them autonomy on our ancestors' lands, and after we made them understand that they would not win against us in a fight easily, it was time for diplomacy yet again to deal with their integration in the League. Our benevolence only goes so far, but as we expected, their leaders have seen the good integrating the League of All Kooras could bring.\n\nTo celebrate the creation of this new, greater league, a new, greater council of Tli'yam Kyin was called in turn. Once again, the council was much more a time of cultural celebration than of diplomacy, as all the groundwork had been laid over years before the council itself. After the final negotiations were done, the traditional spectacles and showcases of the original Tsahl were complimented by new and wondrous displays of ingenuity and engineering thanks to the smallfolk's mastery of artificery.\n\nAlready, the city was filled to the brim with ideas as the traditional Kooras magical arts and the knowledge of the artificers clashed and interfaced.\nA gnome was talking with a Riftwatcher about how it was impossible that his visions' origins were so unknowable and their subjects so unpredictable. There had to be a logical explanation for their prevalence in Kooras society and a pattern to their activation!\nA group of five kobolds was harassing a poor Ja'adkali on questions about the nature of her magic, who her patron might have been, and oh could they make them be able to breathe underwater for a short while please? They promise they won't get taken away by the strong streams of the river, even if it was particularly capricious that day.\nAnd then, many goblins were… crying? Thanks to a considerable amount of effort, a group of the strongest Kaiineloo had gathered to try and channel the oh-so-distant voices of the goblins' Halcanni ancestors. This act of reconnection healed a part of them, even as they now lived so far away from their homes."
 kooras_events.29.a:0 "A new, greater league, for a new, greater future."

 kooras_events.30.t:0 "Union of Magic and Artificery"
 kooras_events.30.d:0 "“Riftbridger Unit, log 28.\n\nSome more preliminary testing today. I'm not sure what kinds of results the shamans expect us to be able to show to the public - and the rest of the artificer community - once the project is officially announced, but none of what I can think of are certainly being made right now.\n\nWe still haven't figured out what Riftwatching actually looks like during a vision, if it's even a single unified phenomenon, for Kseldos' sake!\nSome of the subjects say that they feel as though nothing within their senses has ever changed, but that their memories get morphed into those of their vision after the fact; some say that it is as though their whole body and spirit is transported in the realm of their divination for its duration; some describe it as each of their senses overlapping with the others, creating a whole new perception from the same information (whatever that means). Those interpretations aren't consistent with the individual or the topic either: we've already had the same Riftwatcher describe completely different experiences regarding a seemingly-identical vision.\n\nThe first assumption we based ourselves on was that the Riftwatchers needed to be blindfolded in order to not be distracted when manifesting their powers. Even that seems to only work half of the time! So much for K'ajooin expertise, if they cannot even get that part right. On this note, I will highlight that we've recently received new reports from the investigative branch which indicate that positions seem to have a certain impact on communal Riftwatching rituals (how much impact? and positioning of what? I know that the K'ajooin are hard to get information from, but it's been months for only this little insight…). We'll have to see how we can use their corresponding illustrations for testing in the future.\n\nThe one thing we have found which seems to somewhat consistently help results in vision control is the presence of Kaiineloo in the room. Whether it is impacted by their singing, and their magical efforts, we need to conduct more research to obtain statistically significant information. Perhaps the help of the Kaiineloo suggests we should look more into spiritual help for the project in general? A large part of our colleagues' work is to interact with the blood of Kseldos, after all. The influences of the twin worlds on Riftwatching may help us understand its inner workings better.”"
 kooras_events.30.a:0 "Aren't artificers supposed to be optimistic about their work?"

 kooras_events.32.t:0 "Dive Goods Runs Out"
 kooras_events.32.d:0 "All good things come to an end eventually.\nA dispatch from [Root.GetName] tells us the [Root.GetTradeGoodsName] we found during the past Blood Dive is exhausted. The elves of the province will have to make do without the extra income."
 kooras_events.32.a:0 "Drat!"

 #Decisions

 kooras_settle_across_the_waterworld_title:0 "Settle Across the Waterworld"
 kooras_settle_across_the_waterworld_desc:0 "For centuries our people have looked across the land to the Water World with a childlike curiosity. a grand azure expanse inhabited by noble servants of Kseldos. Many of us have tried to cross it and see what lay beyond but few have ever succeeded. Now, however, we are in a position to settle the many isles of the Water World, using each previous isle as a springboard to reach the next. We shall spread far and wide."
 kooras_recruit_explorer_title:0 "Recruit an Adventurous Ja'adkali"
 kooras_recruit_explorer_desc:0 "As we attempt to explore the Water World we run into issues of shipcraft. The Caamasi of far away Eordand jealously guard their techniques which means we must look elsewhere. Fortunately a young and adventurous Ja'adkali has offered their service. Their mastery over the energy of the water should serve to make up for our lack of shipbuilding expertise."
 BUILD_MAGICAL_LONGHOUSE_title:0 "Artificers: Build Magical Longhouse"
 BUILD_MAGICAL_LONGHOUSE_desc:0 "As our magical expertise grows there is increasing demand for a base of operations for our mages. Recently an architect has come to us with a proposal for a grand longhouse that will suit the needs of each school of magic by channeling the energy of the worlds, the Kaiineloo will be situated in the center, with energy of the Dark world being allowed to flow freely to the Riftwatchers on the right flank and similarly the Water World to the Ja'adkali on the right flank."

