 #Missions
 B26_you_own_nothing_title:0 "You'll Own Nothing"
 B26_you_own_nothing_desc:0 "The Zargom seem to think now that the strongest is dead, they deserve more. That they’re anything but the bottom, the scum, the weak. They want to try and pretend like they don’t already have their place in our clan. Instead of fighting alongside Korgus and his armies, the cowards accepted their fate as lessers, and now that we’re at our lowest, they dare try and take what is ours! Are ya going to accept that? Will I accept it? NO! Remind them. The weak serve. The strong rule. Tell them where they belong: under our feet."
 B26_forceful_settlements_title:0 "Forceful Settlements"
 B26_forceful_settlements_desc:0 "The Rabble wanted something to do so badly they tried dying to their betters, so we, as the strong, have found a job for them. While they were fighting against order, we were taking what belongs to us: rich farmland, lacking only someone to tend to it. Send them out—if they do a good enough job working our conquests, they might earn the honor of calling themselves part of the clan again. Until then, they are less than weak; they are nothing, they are Zargom, but they will feed our expansion."
 B26_suppressive_strength_title:0 "Suppressive Strength"
 B26_suppressive_strength_desc:0 "Our clan is the strongest still left, and there is no questioning that. That means we deserve the best loot and gear. The Bladebreaker clan has access to stuff we don’t, but they’ll understand, my warriors, my strongest, my Bazuhgan. The moment they weren’t strong anymore, it no longer belonged to them; it was already ours. Remind them of that."
 B26_closing_the_gate_title:0 "Closing The Gate" 
 B26_closing_the_gate_desc:0 "Zargom might be scum, cowards and lesser, but if there’s something positive about them is that they don’t give up. Every day there’s another idiot trying to run away, as if they’d ever have a chance. They might be lucky enough to escape their chains, smart enough to flee from the wargs and stealthy enough to hide from our warriors, but they all end up facing the same view in the end: the humans’ closed white gates, and an unhappy taskmaster waiting to give them a hiding and bring them back to their land."
 B26_rise_of_the_dargom_title:0 "Rise of the Dargom" 
 B26_rise_of_the_dargom_desc:0 "Some of the lower castes end up proving themselves useful. Not strong, but not weak enough to be worthless. They are the Dargom, city dwellers, living in what was once one of the greatest human cities in Escann, now an orcish trophy belonging to our clan. The Dargom attempt to maintain and use it as best as they can, and spread the techniques they use to other settlements, allowing us to better utilize our new conquests."
 B26_taking_responsibility_title:0 "Taking Responsibility" 
 B26_taking_responsibility_desc:0 "Korgus fell, and that is undeniable. The strongest of all of us died to some human. Does the fault stand with us alone? No! Does it stand with him then? NO! It was the other clans! They are WEAK! They are COWARDS and failed all of us, and they will pay for that! They will take responsibility for their weakness, and toil under us until they give us back what we’re all owed!"
 B26_more_than_ears_title:0 "More Than Ears" 
 B26_more_than_ears_desc:0 "Some of them forget who we are, why we are called Severed Ear, but worse, forget what we do. They’re usually given a good hiding and remember, but every so often we get a couple of dumber ones with thicker hides. Those we use as an example, but lately we’ve been having to make a lot of examples. No more. I want every last one of these rabble captured and brought to me. We are giving them a final reminder."
 B26_hired_hunts_title:0 "Hired Hunts" 
 B26_hired_hunts_desc:0 "These human ‘heroes’ reveal their true faces when they’re a sack of broken bones, and show us who they really are: cowardly, weak, money hungry slavers with no honor. We can work with that. They’re more than willing to hunt down straggler orcs from defeated clans and bring them to join either our ranks or our Zargom as long as we bruise their ego and feed their pockets. Little more than scum and cowards, but our clan is used to dealing with those if they try something."
 B26_just_a_little_goblin_title:0 "Just A Little Goblin"
 B26_just_a_little_goblin_desc:0 "“I’m not gonna lie: when I woke up one day and had the excellent luck of being caught taking a piss by an orc, I started praying for my fat goblin ass, lied about being a mage and almost got killed, rapidly swapped to begging for my dumb little goblin life and somehow ended up being ‘hired’ by them to literally count money piles and tell them how much is in it. They even PAY me for it, not that it has stopped me from nabbing a few coins every so often but hey, at least I’m not dead. I even get to make fun of some orcs who are somehow even lower than me in the pecking order, and honestly, this is way better than eating grasshoppers off the floor or pretending that riding a dog is somehow cool.”"
 B26_the_draconian_throne_title:0 "The Draconian Throne" 
 B26_the_draconian_throne_desc:0 "The rabble refuses their rightful place beneath us and the humans reject their fate. But we do not care for their opinions. They are Zargom and cowards, and what they think about our clan does not matter, because we know these vermin do nothing but serve themselves. We claim back what Korgus conquered and bring prosperity to it, while they do nothing but writhe underneath us and try to fight against what we do. We don’t care because we are strong, and our goals will be achieved no matter how many worms we have to put back in the dirt."
 B26_with_some_little_eyes_title:0 "With Some Little Eyes" 
 B26_with_some_little_eyes_desc:0 "“We goblins are simple folk. Give us a back to stab or someone to spy on and we’ll do it, no questions asked except maybe ‘Can I get paid now?’ or ‘Wait wasn’t that our boss? Fuck give me the emergency self-stab knife we have to make this look like it was an accident’. So when our new, uh, ‘business partners’ from Severed Ear told us they wanted us to stare at people from the shadows and report back to them and get paid for it instead of doing it for fun, of course we took the deal. The fact that the smallest of them was double my size, fully covered by the best armor I’ve ever seen one of them wearing and extremely angry that we were squatting in their land doing nothing might have helped convince me and the boys that this was in our best interest.”"
 B26_willing_guards_title:0 "Willing Guards" 
 B26_willing_guards_desc:0 "The biggest and meanest in any clan are always prone to wanting to rise in standing, which usually involves punching someone who looks bigger and meaner than them. While this does weed out the weak and unworthy from our warriors, it’s also a risk to our chain of command, and most importantly, our chieftain. This tradition can be harnessed in our favour, however, by organizing recruitment events for the Bazuhgan. Our warriors will get an opportunity to fight each other, and the ones who survive and prove themselves worthy will be recruited for the guard. The losers who still live will have earned a cut ear, a broken bone, a torn snout or even a sliced hand, master’s choice, and be useful for nothing except joining the Zargom."
 B26_sponsor_raids_title:0 "Sponsor Raids" 
 B26_sponsor_raids_desc:0 "Our human ‘helpers’ appear to have gotten so accustomed to our deal that they’ve started talking about it to their fellow ‘heroes’—and as expected from the cowards, they are so afraid of our warriors that they’re all willing to take the same deal without being crushed in battle by us. Their weakness is apparent, but so is their use doing the dirty work our warriors are too proud to do. Our ‘helpers’ are now in enough numbers that they can threaten lesser clans and allow us to expand our Zargom even further, so we’ve started paying them per orc delivered, no questions asked."
 B26_apparent_strength_title:0 "Apparent Strength" 
 B26_apparent_strength_desc:0 "The Ozarm’Chadash. A rite of battle between the chieftain of a clan and an aspiring warrior who believes they are stronger and worthier of leading the clan. It is not uncommon in other clans, but in ours? Have you lost your mind? The chieftain would tear you apart before you even raised your axe. Do you know why his skin is so pale? It’s because he was in the front, fighting alongside Korgus in Castonath, and I’ve heard he fought Corin to a standstill before she cowardly took down Dookanson during an ambush! There hasn’t been even a single attempted duel against our chieftain because everyone knows it’d be suicide!"
 B26_in_a_little_house_title:0 "In A Little House" 
 B26_in_a_little_house_desc:0 "“Of all the things I expected to happen that one day I got caught pissing, this is certainly not one of them. Apparently I’m so good at counting coins and listening to people while they discuss stuff that they didn’t want a goblin hiding in their closet to hear, that our big green friends want to let me and some buddies take some of their enslaved big green enemies and just treat them like garbage and force them to work for us.\nNow, since I am as generous and forgiving as the best of my people, alongside being a representative of peace and diplomacy, I immediately told them yes, took my boys, took our new orc ‘helpers’ and got to our new job whipping the soul out of people who stare at me like they want to kill me but can’t do anything about it. I was going to do it for free, but I found out that this deal gets even better: We got a place to live with no orc stink in it, goblins as far as the eye can see! And all we have to do is make sure these rats keep working right!”"
 B26_you_are_being_saved_title:0 "You Are Being Saved" 
 B26_you_are_being_saved_desc:0 ""The damned humans are getting braver. Clans that once were considered too strong to even consider engaging are being attacked, hunting parties that weren’t worth the losses are being captured, and our warriors are getting pushed to the brink trying to keep them away from our settlements. The only clan that isn’t being touched are those bastards from Severed Ear, and I refuse to believe it’s an accident, since one of their messengers arrived last day and demanded us send them tribute to push the adventurers back from our lands, forcing us to disgrace ourselves and live or die a worthless warrior’s death.""
 B26_get_a_real_job_title:0 "Get A Real Job" 
 B26_get_a_real_job_desc:0 "The humans have some very notable characteristics, being incredibly efficient, easy for our warriors to crush and even easier to just scare into submission, but one would have to be blind to not notice another, much more problematic one: they are prone to disobeying commands when not under constant vigil. This will have to be fixed, and we will do so by bringing them directly under our heels. They will be directly commanded by us instead of remaining under their sad excuse for a clan they call their ‘parties’."
 B26_away_from_the_dregs_title:0 "Away From the Dregs" 
 B26_away_from_the_dregs_desc:0 "Our Zargom numbers are incomparable to what they were a few years ago, and while this means all of the work we need done gets completed in the expected time, it also means their superiors are forced to sully themselves by spending time near these vermin. This will not do. The humans used to have a mighty fortress on a hill north of their largest city, but their weakness has caused it to fall into disrepair. The rabble will work until it is once again a worthy court for our warriors and then they will leave and never return, allowing the worthy in our clan to be above the Zargom in every meaning possible."
 B26_thinking_big_title:0 "Thinking Big" 
 B26_thinking_big_desc:0 ""I always knew orcs were stupid. I mean it was really obvious, they’re really big so their blood doesn’t get into their heads right like it does for us, but I didn’t expect them to not know how to actually build a wall right. One of them was bragging about how impenetrable their new camp was, so I gathered the boys and we started poking the thing trying to find a way in, and that thing was so poorly made we changed our minds and made it a competition to see who could find the most ways in.\nIt was fun until the guy who was winning the competition got grabbed by the neck and dragged away by the orc who made the wall and she did not look happy. The rest of us kept doing it until our unlucky “winner” came back a bit dazed and bruised and said he scored us a new job doing that to the enemy walls instead of our own. Shame we didn’t get to finish that catapult that tosses angry orcs over walls, but maybe we should save that one for later.""
 B26_milk_them_dry_title:0 "Milk Them Dry" 
 B26_milk_them_dry_desc:0 ""The fucking messenger from the Severed Ear clan came back with a change to the tribute we pay them. According to him, since the adventurers are getting more aggressive, we would have to give them some warriors from our clan and extra loot for every raid they repelled. And of course, right on time, another one of their warbands showed up and started laying siege to our encampment, as if the bastard brought them here himself. We sallied out, planning on dying like real warriors, just for the damned Severed Ear warband to show up right as we started losing. Bastards didn’t even chase down the humans, they seemed to be more interested in making sure the men we delivered to them were strong and the loot valuable. That rat of a diplomat was smiling the entire time.""
 B26_the_white_demense_title:0 "The White Demesne" 
 B26_the_white_demense_desc:0 "The region inside of the white walls was once the beating heart of the humans’ weak empire, its shining stone a sign of security and hope. Now though, it’s a firm reminder that every one of our subjects, be they Zargom, orc, goblin or human, is always within our chief’s reach. The heart still beats, but instead of beating for their pathetic kingdoms, it beats because we will it. The innards have been carved into the shape we demand of it, always being watched by the fortresses we’ve built, and worked by the Zargom we’ve conquered. The white walls used to be a symbol of hope, but now, they’re the symbol of Clan Severed Ear’s dominion on Escann."
 B26_rule_by_strengths_title:0 "Rule By Strength" 
 B26_rule_by_strengths_desc:0 "“Now while I’m all for a harmonious relationship between us and the bosses, since the more they like us the easier it is to steal their stuff and get away with it, I’m not sure I expected exactly this type of harmony. One of the girls came up to me clearly a bit rounder than usual, and when I asked who the lucky goblin was, she froze up and told me it wasn’t one.\nI just assumed it was a bit of a sore topic, and when the little guy was born I just thought he was one of the ugliest goblins I’ve seen, but it got a bit hard to deny what happened when he ended up taller than an orc at the age of 10 and was taken by the clan’s warriors when he grew into an adult much taller and stronger than most orcs. Apparently our not-so-little guy is now working directly under the clanleader as one of the honor guard and is one of their captains; it’s enough to bring a tear to an old goblin’s eye, having one of our own in prime backstabbing position and getting paid for it.”"
 B26_the_more_the_merrier_title:0 "The More, The Merrier" 
 B26_the_more_the_merrier_desc:0 "While most of our people followed Korgus out of the spine and into the human lands, some of the more stubborn orcs refused to budge and stayed behind, all while calling Dookanson a false prophet. They might be misguided, but they’re still our blood, and whether they want it or not, they will be brought out of that miserable place they call home. We will send some of our humans into the spine to force our kin out, in chains if they need to."
 B26_a_fairer_share_title:0 "A Fairer Share" 
 B26_a_fairer_share_desc:0 "“We have taught our subjects their place time and time again, and the Zargom don’t dare to keep anything from us, but the Dargom and some of the lesser warriors do not seem to have gotten the message through their thick skulls. Everything they do is for the clan, and everything they own belongs to it as well. The Bazuhgan will be sent all over our lands to part them from the goods that rightfully are the clan’s, be it by threat or by the guards’ preferred means: overwhelming force."
 B26_safe_and_secured_title:0 "Safe and Secured" 
 B26_safe_and_secured_desc:0 "The land inside of the walls was barely more than ruins when we started, filled with both human resistance and orcish rabble who refused to work with us, but now, with the work we’ve done, it is flourishing. Fields upon fields of crops being worked by Zargom, Dargom settlements as far as the eye can see, and our Bazuhgan proudly keeping the first in their place and the second paying their dues to our chieftain: a true orcish paradise. Any subjects that dare rise up are quickly crushed and added to the Zargom, meaning we have more people for the fields, leading us to further prosperity."
 B26_me_not_that_kind_of_orc_title:0 "Me Not That Kind of Orc!" 
 B26_me_not_that_kind_of_orc_desc:0 "With the amount of Zargom working the fields that we now have, more and more of our free people are ending up part of the Dargom and working in the major settlements and the human cities we conquered. Most of those are taking up jobs creating goods with the resources harvested from our land, be that making hardy cloth, alcohol better than that garbage the dwarves have, or even trying their hand at copying the glass humans use for their cities."
 B26_march_to_the_citadel_title:0 "March To The Citadel" 
 B26_march_to_the_citadel_desc:0 "Our clan is on the verge of greatness, for our chieftain has proclaimed the end of our disorganized clan structure, and the creation of a kingdom, much like the ones previously present in the land we now command. The most powerful and loyal warriors will form the core of our nobility and be given rights over the Zargom alongside the land needed to put them to work, and our chieftain will take up the throne as our first king. The Bazuhgan are already gathering for the ceremony and preparing the location and defenses, for our future royal family deserves nothing less than the best they can offer."
