 #Events
 flavour_severed_ear.0.t:0 "The Spiteful Chain"
 flavour_severed_ear.0.d:0 "“KORGUS IS DEAD!”\n\nThe warriors scramble and shout senselessly, seemingly moments away from starting either a full rout or a brawl. Whatever choice Clan Severed Ear had in the matter wasn’t relevant, for the moment the first orc turned tail and started retreating for their clan’s settlement, the decision was made, and the tide broke. Garm Severed Ear, chieftain of his clan and a pale, tall orc, gathers his warriors and orders a retreat back to camp.\n\nThe march back home is silent, but the men are obviously tired and their spirits crushed, something that changes rapidly when they notice fires coming from their homes. One of the few warriors who stayed behind as a punishment meant to withhold glory from the unworthy runs up to the battered host and almost collapses before he can manage to say the Zargom rebelled and killed most of the others left behind, starting with the majority of the chieftain’s family.\n\nFor a second, Garm stands perfectly still, almost as if the news made him stop breathing entirely, before he simply snaps and screams:\n\n“KILL ALL OF THEM. IF ANY OF YOU FAILS TO BRING ME AT LEAST ONE HEAD FROM THESE RABBLE, YOU WILL BE JOINING THEM.”"
 flavour_severed_ear.0.a:0 "Crush these vermin, and remind them of their place!"
 flavour_severed_ear.1.t:0 "And You’ll be Happy"
 flavour_severed_ear.1.d:0 "Crushing the dregs was easy, routine work for Clan Severed Ear’s warriors. Despite orcs being a proud, strong race, the clan has mastered the art of crushing their spirits and forcing them to be Zargom, or under-people: indentured servants forced to slave away in designated plots of land, or sometimes given tasks considered lowly and dishonourable, be that espionage or other cowardly professions. These scum were the majority of the uprising, but they were led by some of their superiors as well, both Ozdan and some lesser warriors disgruntled with being left behind.\n\nAll of them showed why they’re lesser, cowardly and weak, and were crushed. Those who managed to survive were chained up and brought to Garm, who looked at them with fire in his eyes before saying,\n\n“Whip them. Beat them. Break their bones if you have to. Make them BEG for our forgiveness, teach them their place, and then take everything they have. Everything they had was due to our generosity, but they have proven themselves unworthy of it, so they will have nothing instead,” and walking away."
 flavour_severed_ear.1.a:0 "The taskmasters smile and get to work."
 flavour_severed_ear.8.t:0 "Of Dishonour"
 flavour_severed_ear.8.d:0 "It doesn’t take much to figure out why Clan Severed Ear is called that when one can walk across one of their settlements and see hundreds of enserfed orcs missing one of their ears. The clan was named after their most prevalent punishment for their Zargom, sometimes even self-inflicted in a desperate attempt to recover some of their honor, but it’s not the only punishment. Some need harsher lessons to know their place, but they all inevitably learn to obey and work without complaint.\n\nNot this time, however. As the Bazuhgan gather the last of the dissidents into the clearing where the punishment is meant to take place, the [Root.Monarch.GetTitle] looks into the eyes of the prisoners and knows - No amount of discipline would break these scum. They were all ready to die fighting for their freedom, and would never accept the fact they were weak and dishonourable. So [Root.Monarch.GetSheHe] raises [Root.Monarch.GetHerHis] voice and tells the guards:"
 flavour_severed_ear.8.a:0 "Summon the clan to witness, I will execute these myself"
 flavour_severed_ear.8.b:0 "Kill them and parade their corpses across our lands"
 flavour_severed_ear.3.t:0 "Crux of Destiny"
 flavour_severed_ear.3.d1:0 "When [Root.Monarch.GetName] announced the Bazuhgan were to organize a crowning ceremony to mark the end of their clan and the start of a new Kingdom, the responses were mixed. Some were afraid of the systematic dismantling of all that made up their society, others were proud that their strongest warrior was finally going to take what [Root.Monarch.GetSheHe] rightfully deserved, but the vast majority was wondering what the ceremony would feature.\n\nWhen the Bazuhgan officers were ordered to all come to the venue personally, all assumed it was meant to give presence to the affair, so it came as a shock to the participants when the Chieftain, no, the [Root.Monarch.GetTitle] commanded the Bolutunn Regalguard to seize all of them, many of which included their own parents, and was obeyed with no hesitation.\n\n“Your plan came to me as quite the shock. Not because I didn’t expect it, but because I expected it to be less disappointing than this. I waited all this time just for it to be as simple as trying to kill me during my own coronation?” [Root.Monarch.GetSheHeCap] says, and the officers go pale before breaking into panicked yelling. “SILENCE. You did an acceptable job organizing this, but it’s missing something. My country was forged through strength and blood, and I deserve to be crowned the same way. Guards.” Upon receiving the command, they all drew their axes and with a synchronized swing, all the prisoners had their lives taken, almost as if this was routine, and not a coup smothered in the cradle."
 flavour_severed_ear.3.d2:0 "Two goblins talking to each other and screaming is far from an uncommon sight in Clan Severed Ear settlements, but doing it inside a castle while poorly trying to hide in the shadows is definitely not as common.\n\n“What the fuck do you mean your WIFE told you about the hole in this wall? You’re MARRIED? And she built a CASTLE? I thought we were friends! Why didn’t you tell me we could have been robbing this-”\n\n“Shhhhhh, shut up, we’re meant to be SNEAKING IN HERE. And she didn’t tell me about the hole, I knew there was a hole because she’s as shit at building walls as you are at being quiet, you moro- oh fuck there’s a guard.” Both goblins stop arguing for a second and turn around to find a different corridor to sneak through, but are interrupted by that same guard, a hulking Bolutunn, grabbing them by the shoulders.\n\nThe second goblin opens his mouth and starts vomiting words out:\n\n“Madam-guard-we’re-allowed-to-be-here-I-swear PLEASE DON’T KILL-” before the other interrupts his begging by saying,\n\n“Oh hi kiddo how’s the plan going? Did your mom tell you to find us here? How’s-”\n\n“Father. Silence. Weren’t you meant to be in position an hour ago?”, says the massive Bolutunn.\n\n“Oh I got lost,” her father responds, causing her to sigh, and point towards the direction they should be heading.\n\n“Father? Kiddo? THAT’S YOUR DAUGHTER? What are we even doing here, man, do I even know you?”\n\n“We literally met yesterday, and yes, that’s my kiddo. Now for what we’re here to do? We’re here to kill Clan Severed Ear. Now let's get to work, there’s a lot of people to shank, we have a kingdom to destroy, mate.”\n\n—\n\n[Root.Monarch.GetName] gets to [Root.Monarch.GetHerHis] ceremony, and finds no one but the Bolutunn’s officers waiting. The official reports say a rogue Zargom broke in and killed the Chieftain, and a party of heroes seeking vengeance wiped the nobility in Urugarm. What matters, however, is that the Bolutunn High Overseers now rule Clan Severed Ear."
 flavour_severed_ear.3.d3:0 "[Root.Monarch.GetName]’s announcement about the impending dissolution of the clan and formation of a kingdom with Garm’s line on the throne now until the end of time was received incredibly poorly. The Bolutunn officers didn’t even bother with hiding their coup, and [Root.Monarch.GetName]’s supporters immediately started mobilizing for war. In mere days, Clan Severed Ear was on the verge of collapse, it was only a matter of time before all that was built across generations would be destroyed. None could tell which side would come on top, and whether they would be able to stop the nation from fading into history.\n\nThe people, however, did not care. Zargom, Dargon, Goblin, Orc, Human and even Bolutunn. All tired of the powerplays between nobility and officers, tired of being under the boot of Chieftains, Kings and Taskmasters, tired of chains. No more being prisoner to the whims of someone so far above them that they’d never know who ordered them to work until dropping, to engage in work so dishonourable no orc would be caught alive doing it, to kill without justification and bear the blame. They would be free, and no petty tyrant or powerhungry overseer would stop them.\n\nOfficers and Kings almost ruined the clan in days, but the revolters saved it in hours. The two sides of the civil war never expected for the ones they used to trample on to stand up for themselves, for the weak, cowardly and downtrodden to prove once and for all."
 flavour_severed_ear.3.a:0 "A Tyrant crowned in blood"
 flavour_severed_ear.3.b:0 "The weak tyrants shall never rule over the strong again"
 flavour_severed_ear.3.c:0 "There’s no chain that can’t be broken"
 flavour_severed_ear.4.t:0 "Rise of Chainbreaker"
 flavour_severed_ear.4.d1:0 "Clan Chainbreaker is a very young clan, having risen from the ashes of the now disgraced and extinct Severed Ears. They are an exception amongst the orcs, as their clan isn’t lead by a chieftain, but by a council of representatives from their people, with one of them being chosen as speaker meant to engage in external diplomacy. The clan was named after the bloody Chainbreaker Uprising, where disgruntled ex-Zargom rose up and slaughtered the ruling family and created a society led by the downtrodden and weak, with their once-oppressors firmly under their boot. The period of chaos caused by this should have been the end of their clan, but against all odds, the Chainbreakers managed to stabilize and turn into a powerful and respected clan. The cost for that, however, was abandoning their ideals, and continuing the practice that led to their rise in the first place."
 flavour_severed_ear.4.d2:0 "Clan Chainbreaker is a very young clan, having risen from the ashes of the now disgraced and extinct Severed Ears. They are an exception amongst the orcs, as their clan isn’t lead by a single chieftain, but by a council of representatives from their people, with one of them being chosen as speaker meant to engage in external diplomacy. Named after the Chainbreaker Uprising, where the people of Clan Severed Ear, abused and tired of the oppressive reign of Garm’s line and the poor treatment by the Bolutunn officers, rose up and against all odds managed to cleanly crush their oppressors. In a matter of days, they ended all of the tyrannical practices from the previous rule, freeing the downtrodden and bringing unimaginable prosperity to all the people under their rule, no matter their race or strata. For Chainbreaker is a clan of equals, of freedom, and most importantly:"
 flavour_severed_ear.4.a:0 "One must wonder how long until the next chains are broken…"
 flavour_severed_ear.4.b:0 "A clan where no chains exist"
 flavour_severed_ear.5.t:0 "Tyranny, Forevermore"
 flavour_severed_ear.5.d1:0 "Tyrant. A word that the humans sometimes use when referring to Garm. It appears to mean ‘a strong ruler willing to do whatever it takes’. It is a good title, as Garm has proven again and again that he will do anything, no, EVERYTHING in his power to keep the clan powerful. Everything he does is just because he is the chieftain, because he is strong. Time and time again, worms barely worth the land they live on and the air they breathe have risen up against Clan Severed Ear, and without fail, the chieftain was there to put them in their place. His rule is the law, and enemies both internal and external live in fear, because they know that if something can be done to crush them, Garm will do it, scruples be damned. These are the principles upon which he rules; there is no trick too dishonourable or cowardly for his Zargom, no army too mighty for his Bazuhgan and no warrior too powerful for him to defeat."
 flavour_severed_ear.5.d2:0 "Tyrant. A word that the humans sometimes use when referring to Garm. It appears to mean ‘a strong ruler willing to do whatever it takes’. It is a good title, as Garm had proven again and again that he would do anything, no, EVERYTHING in his power to keep the clan powerful. Everything he did was just because he was the chieftain, because he was strong. Time and time again, worms barely worth the land they lived on and the air they breathed rose up against Clan Severed Ear, and without fail, the chieftain was there to put them in their place. His rule was the law, and enemies both internal and external lived in fear, because they knew that if something could be done to crush them, Garm would do it, scruples be damned. These are the principles of Garmian rule, and every chieftain aspires to follow them as best as possible."
 flavour_severed_ear.5.a:0 "For he is Garm, the greatest Tyrant"
 flavour_severed_ear.5.b:0 "We follow in Garm’s stead, the greatest Tyrant to ever live"
 flavour_severed_ear.6.t:0 "Protection Subjugation"
 flavour_severed_ear.6.d:0 "A diplomat from Clan Severed Ear arrived today bearing a message that can only be taken one way: A poorly disguised threat that they feel no need to even bother hiding. It reads as follows:\n\n“Dear Mariorc: \n\nPlease come to the \nclan. I’ve baked  \na tribute for you . \nYours truly- -  \nPrincess Severed Ear”"
 flavour_severed_ear.6.a:0 "Mamma miorc, pay up!"
 flavour_severed_ear.6.b:0 "Who the fuck is Mariorc? No!"
 flavour_severed_ear.7.t:0 "The Mutual Contribution"
 flavour_severed_ear.7.d:0 "Having collected the excessive and frankly underserved loot kept stashed by the clan’s warriors and Dargom, the Bazuhgan bring it to the clan’s capital settlement for redistribution, but before that can happen, the council of the people demands to be brought a report stating how much loot the contribution contains exactly. The goblin responsible for the treasury makes a quick survey and finds out the exact number down to the last coin, and hearing that makes one of the members of the council say with thinly veiled greed:\n\n“The people wouldn’t mind if instead of going to them, the donation was used by us- I mean Clan Chainbreaker’s representatives, for the good of the nation, of course. Anything we do with the money would benefit the people more than what they’d do with it.”"
 flavour_severed_ear.7.a:0 "Send them to trial for corruption, and donate the loot as planned"
 flavour_severed_ear.7.b:0 "We know how to use this loot better than they do"
 flavour_severed_ear.2.t:0 "Children of Orcs and Goblins"
 flavour_severed_ear.2.d:0 "Some of the clan’s subjects from different races have proven themselves worthy of respect, primarily the goblins, and because of that, relations between the races have improved. An unexpected result of said improvement has been the surprising amount of children born between orc and goblin partners. In general, they have the knowledge of a goblin, and the strength of an orc, but some grow so much they surpass even the strongest orc warriors, rivaling even the trolls found in the caves of the Spine, earning them the name Bolutunn, High Troll. These Bolutunn are extremely loyal to the Bazuhgan, and many are already reaching the positions of captain and above due to their overwhelming might, but the vast majority of their number is left wasting their potential. An official decree should be made regarding where they serve."
 flavour_severed_ear.2.a:0 "They will serve as guards to the Chieftain"
 flavour_severed_ear.2.b:0 "Enlistment in the Bazuhgan will be mandatory and guarantee high rank"
 flavour_severed_ear.2.c:0 "Create an unit dedicated to safeguarding the people"
 bulwar_flavour_severed_ear.200.d:0 "In our conquests, we have managed to subjugate large numbers of weaklings with no honor, despite their protests and their branding us as tyrants. With the subjects of our clan being a rather productive bunch given enough motivation, it makes it quite easy for us to extract tribute. Though crowns were our main objective, we have also managed to secure many of the tools needed to administer our realm, such as detailed maps, stores of grain, and many books on effective taxation. The cowards looked terrified of the Bazuhgan as they handed over everything they owned, which may have inspired the ease with which they gave in to our demands." 
 flavour_severed_ear.9.t:0 "Backroom Dealings"
 flavour_severed_ear.9.d:0 "New prisoners being dragged through a settlement of Clan Severed Ear is a common enough sight that none of the Orcs there would bat an eye. What instead caught their attention was who exactly they were and where they were heading. Human prisoners in full gear would be enough to cause worry, but them being taken to the Chieftain’s lodging made the Bazuhgan tighten their grip on their weapons and wonder why they were personally ordered by the Chieftain to do so. Their questions would remain unanswered, however, since the moment they arrived, [Root.Monarch.GetName] commanded them to leave. \n\n“You have two choices” said the orc, “either you work for Clan Severed Ear, or I get rid of you, get my guards to bring the next group of humans and give them the same options.” One of the adventurers moves her hand to her scabbard but freezes when she notices her prospective employer signal to someone out of her view and feels a blade on her neck. “Since you are the first group I make this offer to, I’ll even be generous, and not break every bone in that one’s body. Now choose.” \n\nThe adventurers quickly accept."
 flavour_severed_ear.9.a:0 "You will go out, and bring me all the loot you find." 
 flavour_severed_ear.9.b:0 "You will serve my Bazuhgan as loyally as they serve me."
 flavour_severed_ear.9.c:0 "You will go out, and fight for what is right."
 flavour_severed_ear.10.t:0 "The Mutual Cause"
 flavour_severed_ear.10.d:0 "Ever since the fall of Clan Severed Ear and the rise of Clan Chainbreaker, the people have been directionless. Without the mutual goal of taking down the oppressors that kept them chained to the fields and living in squalor, the minor clans are squabbling amongst each other trying to find common ground. The two main sides in the debate are between the ones who believe that they have freed the clan, and that is enough, so the focus should be on working the land and guaranteeing prosperity. The other side is adamant that the clan’s work will not be done until all oppressors are dead, and that Clan Chainbreaker should take a proactive stance in conquering any who might prove themselves tyrants. An irrelevant minority also advocates for the end of the Zargom, but they have no support in the matter and are too cowardly to fight for it, so a choice should be made about the other two instead."
 flavour_severed_ear.10.a:0 "Clan Chainbreaker will do what we are named for, and end all tyrants."
 flavour_severed_ear.10.b:0 "We have done enough, it is time to feed our people, and prosper."
 flavour_severed_ear.11.t:0 "Crucible of A New Orcish Civilization"
 flavour_severed_ear.11.d:0 "When Clan Severed Ear first arrived in these lands, orcish civilization knew how to do two things: pillage, and conquer. No matter how skilled their warriors were, strength and might couldn’t repair the structures that the humans left behind when they were defeated, let alone build anything comparable. But many years have passed since. The Dargom have studied the conquered human cities, and using the techniques they learned from maintaining them, alongside human subjects that were convinced to teach advanced skills, Clan [Root.GetName] has started to thrive. Where there were once crude orcish settlements, flourishing cities are starting to grow, economies once based on little more than hunting and farming now produce valuable cloth, glass, and even paper, all goods necessary to supply a growing nation.\n\nFrom little more than a conquering horde, a real, thriving country has been built, and it’s clear who is responsible for this achievement."
 flavour_severed_ear.11.a:0 "The greatest Tyrant and his line!"
 flavour_severed_ear.11.b:0 "The strength of our Bazuhgan!"
 flavour_severed_ear.11.c:0 "The people and their unbreakable spirit!"
 flavour_severed_ear.1000.t:0 "Plowshares to Axes"
 flavour_severed_ear.1000.d:0 "It was meant to be a glorious death, one last attempt by the Zargom to do something, ANYTHING to recover their honor. Rising during the night, the taskmasters were the first to fall, and strangely enough, there seemed to be no other guards, no alarm, not even any screaming. At first, they tried to sneak towards the chieftain’s home, thinking about how there were always eyes on everyone in the clan, keeping track of every movement and failure, always ready to report everything to the ones holding the leash, but there was nothing in the shadows. Getting to [Root.Monarch.GetName] was comical, but every Orc knew, like all of [Root.Monarch.GetHerHis] line, [Root.Monarch.GetSheHe] was unbeaten in combat and the strongest Orc to ever live besides Dookanson himself—until they found the Chieftain cowering in a corner, begging, asking for someone to come help. The pleas were in vain, and [Root.Monarch.GetName] was torn apart by the Zargom that once knew nothing but pain and obedience.\n\nOnce they were done, they turned to the rest of the [Root.Dynasty.GetName] family and ripped them to shreds, some using even their teeth and bare hands, tearing chunks of them in a frenzy and feasting as if they were nothing more than animals. Once they were done, Severed Ear was no more."
 flavour_severed_ear.1000.a:0 "Now, Clan Chainbreaker rises"
