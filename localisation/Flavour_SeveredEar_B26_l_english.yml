 B26_garmian_reign_monarchy:0 "Garmian Reign"
 B26_garmian_reign_monarchy_desc:0 "This clan follows the principles established by Garm, the first great Tyrant of Clan Severed Ear. Be remorseless, have no scruples, and always have a plan to kill any rebel you meet. Garm taught his people that any real Tyrant should be strong, and willing to do anything to keep the rabble in check."
