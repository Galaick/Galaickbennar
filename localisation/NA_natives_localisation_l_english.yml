#Events
 ynn_events.601.t: "The God Within"
 ynn_events.601.d: "Those born of the Ekyunimoy are many. This land of Eslu has seen many walk across it and fight to survive its harsh form of parenting. There are those among us who believe themselves one with the land, those who believe themselves one with Eslu.\nBut a few among our kin are those who are truly one with someone else.\nTo watch the hair grow on your body, your fingers give way to claws, and your face deform until you are no longer you. To become a beast.\nTo become a Decuvie, a Werecoyote, is to become one with the trickster god.\n\nAs [Root.Monarch.GetName] takes the reins of our nation today [Root.Monarch.GetSheHe] does not hide [Root.Monarch.GetHerHis] nature.\nFor [Root.Monarch.GetSheHe] is one with the Great Coyote."
 ynn_events.601.a: "And this is a form I do not deny"

 ynn_events.602.t: "In the Form of the First Hunter"
 ynn_events.602.d: "When Eslu cast his will upon the shapeless land, the world he created was one chained by his desire; he sought to create a cycle condemned to his rules and make creation subservient to him alone.\nThe treacherous Coyote, first among us to rise higher, connived to put an end to the fabric of his world. The trickster Coyote, first among us to hunt, played Eslu for a fool and entrapped him in the void between. Ever since then, the world of the living has been broken from his chains, forever marked by the Coyotes' will to be free.\nAmong our people there are those most connected by the Coyote, those who many would see as traitors to Eslu. They seek to see them rot, to see the US wither, as they believe us monsters.\n\nBut not here - ours is a clan of the exiled, the ones left behind and the ones who saw through the lies of the tyrant god Eslu. Here in this land we seek to become more like him, and truly become his children in life.\nOur tribe has gone through much. Once, we struggled much; as a small clan we had to fight not just the land but those who inhabited it and saw fit to end us. But those days are long gone. Now we are the ones that rise above and claim freedom for ourselves!"
 ynn_events.602.a: "And by the Coyotes will be shall march on"

