#Reforms
 U83_decuvie_shaman_rule_reform: "Decuvie Shamanic Rule"
 U83_decuvie_shaman_rule_reform_desc: "Formed from children exiled by their families, this tribe is ruled by a council of Decuvie, also known as were-coyotes, and among them the most connected to the Great Coyote is chosen as ruler when the one before moves on.\nEvery family within the clan stays vigilant of the signs of the Coyote in their children, and when one presents themselves as his incarnate they put much effort and pride in making sure they train in his ways and become more an embodiment of him. Families who lack a Decuvie child may adopt exiled ones from other tribes."

 epednar_custodian_of_the_expanse_tier1_reform: "Custodian of the Expanse"
 epednar_custodian_of_the_expanse_tier1_reform_desc: "A union of Epednar tribes under one ruler."
 epednar_cling_not_to_the_past_tier3_reform: "Cling Not to the Past"
 epednar_cling_not_to_the_past_tier3_reform_desc: "In a world everchanging we should not keep to our memory of what once was rather what will soon be."
 epednar_trust_not_false_brothers_tier3_reform: "Trust Not Your False Brothers"
 epednar_trust_not_false_brothers_tier3_reform_desc: "They bear your face yet share not your words."
 epednar_rise_above_all_tier4_reform: "Rise Above All"
 epednar_rise_above_all_tier4_reform_desc: "To save our kind from what is to come."
 epednar_prepare_before_the_storm_tier4_reform: "Prepare Before the Storm"
 epednar_prepare_before_the_storm_tier4_reform_desc: "We shall not meet change unready."
 epednar_let_the_storm_call_your_name_tier5_reform: "Let the Storm Call Your Name"
 epednar_let_the_storm_call_your_name_tier5_reform_desc: "Become the unstoppable will of this land and reject what destiny has prepared for you."
 epednar_to_claim_the_dragon_host_tier5_reform: "To Claim the Dragon Host"
 epednar_to_claim_the_dragon_host_tier5_reform_desc: "Loyal to Varlengeilt we remain, and shall our people be reborn so we may guide the Thunder to become in his image."

 epednar_confederation_of_thunder_tier1_reform: "Confederation of Thunder"
 epednar_confederation_of_thunder_tier1_reform_desc: "A grandiose union of all Epednar under one banner that may stand against all who threaten it."
 epednar_thunderbird_caretaking_religious_reform: "Thunderbird Caretaking"
 epednar_thunderbird_caretaking_religious_reform_desc: "The Great Thunderbirds of the Epednar Expanse are of great importance to our people are religion, we must strive to take better care of them and learn from them."
 epednar_let_not_the_rot_survive_tier5_reform: "Let Not the Rot Survive"
 epednar_let_not_the_rot_survive_tier5_reform_desc: "Aelantir is ill, a Rot has come from across the seas to destroy it entirely. We shall not allow such illness to destroy our home once more."
 epednar_the_skies_shines_all_the_same_tier5_reform: "The Skies Shines All the Same"
 epednar_the_skies_shines_all_the_same_tier5_reform_desc: "Ruin has come once more to Aelantir, we cannot allow our home to fall to it."
 epednar_a_people_born_anew_tier6_reform: "A People Born Anew"
 epednar_a_people_born_anew_tier6_reform_desc: "Our quest to rid ourselves of the invaders has left us with much to think about, and in that many ideas have come forth about the future of our kin. Our ways are much different from what they once were."



