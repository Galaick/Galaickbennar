 estate_U83_rename_decuvie: "The Decuvie"
 estate_thunderpriests: "Thunderpriests"

 estate_burghers_taming_the_ekyunimoy: "Taming the Ekyunimoy"
 estate_burghers_taming_the_ekyunimoy_desc: "The land of Ekyunimoy is a treacherous one, but it is the only home we know, and we have made many efforts to stake our claim to this land. We are no longer content with just inhabiting it now, we must truly make it ours by building within it something we can call our own. By expanding our already existing technique of burrowing within the mountains we can strive to create something much greater."
 tame_ekyunimoy_region_tt: "Ekyunimoy Region:\nEvery owned §YMountain§! terrain province gains §G-30%§! §YLocal Development Cost§!.\nEvery owned §YHighland§! terrain province gains §G-20%§! §YLocal Development Cost§!.\nEvery owned §YDryland§! terrain province gains §G-10%§! §YLocal Development Cost§!."
 revoke_tame_ekyunimoy_region_tt: "Every owned province will lose the '§YTaming the Ekyunimoy§!' modifier."


