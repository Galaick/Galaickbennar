 storm_favor_power: "Storm Favor"
 storm_favor_power_desc: "Times are changing, this much we know. If we are to survive what is to come we must be united, and if we are to be united one must achieve the favor of the storm.\n\n-Passive Monthly Increase: §G+0.02§!\n-From Winning a War: §G+2§!\n-From Using '§YRansack Invader§!' Peace Deal: §G+3§!\n-From Constructing Buildings: §G+3§!\n-From New Technologies: §G+5§!\n\n-Passive Monthly Decrease from Being a Subject: §R-0.5§!\n-From Losing a War: §R-2§!\n\nOnce we reach §Y100§! §TStorm Favor§! we will be able to proclaim the §OGreat Epednar Host§!.\n\n"

