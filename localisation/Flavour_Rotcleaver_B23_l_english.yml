 flavour_rotcleaver.1.t:0 "Your Future, In This Land"
 flavour_rotcleaver.1.d:0 "The warrior looks on as the children play in the field. They gleefully jump throughout the clearing, leaping from rock to rock as they chase each other around the open space. They look back to him, and he smiles. He forgets the last time he had the innocence of youth. He hopes he can protect the children from the world longer than his own father sheltered him.\n\n“Ugol,” the shaman calls from the tree line. “The scouts have come back from the front.” The warrior sighs, standing from his reverie and walking towards the shaman, his armor glinting softly in the afternoon sun.\n\n“How many?” he asks, knowing the answer will not please him.\n\n“Five, each prepared for battle.” The shaman looks concerned as she relays the report. “They haven't crossed the boundary, but they will soon. Your reputation won't protect us forever.”\n\nThe warrior scowls, setting down his axe. “We've been over this before, Zien. When the time comes, we will be ready for them.”"
 flavour_rotcleaver.1.a:0 "“We have to be, for their sake.”"
