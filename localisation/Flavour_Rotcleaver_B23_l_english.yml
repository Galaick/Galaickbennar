 flavour_rotcleaver.34.t:0 "Stewardship of the Blade"
 flavour_rotcleaver.34.d:0 "Arriving in Bladeskeep, the two are approached by Blade Stewards who bear §O(Calindal, the Gleaming Blade)§!. [Root.Monarch.GetName] averts [Root.Monarch.GetHerHis] eyes and Sofina takes it, being accepted by it. She then swears an oath of fealty to [Root.Monarch.GetName] on the spot"
 flavour_rotcleaver.34.a:0 "Accept her oath"
 flavour_rotcleaver.34.b:0 "Refuse it"
 B23_friends_with_stewards:0 "Friends with Stewards"
 B23_blademarches_squire_state_tt:0 "As long as §YBlademarches§! is our §YMarch§!, they will §Ggain§!:"

 flavour_rotcleaver.35.t:0 "The End of the Hakhud Kabir"
 flavour_rotcleaver.35.d:0 "Etrega declares the end of the Great Roaming as orcish warriors begin to return to Rotcleaver lands. She also announces her abdication, and the establishment of a new government: The Ugolan Order, in emulation of the Knightly Orders that used to make this land their Home"
 flavour_rotcleaver.35.a:0 "There is not a dry eye in the crowd."
 B23_orcish_ridars:0 "Orcish Ridars"
 B23_learnings_of_the_hakhud:0 "Learnings of the Hakhud"
 B23_learnings_of_the_hakhud_desc:0 "Our people have travelled far and wide and learned much of other cultures."

 B23_hakhud_decision_unlock:0 "The §YHakhud§! Decision has been §Gunlocked§!, allowing [Root.GetName] to send orcs out to embark on a §YHakhud§!"
 B23_hakhud_decision_title:0 "Embark on Hakhud"
 B23_hakhud_decision_desc:0 "Send a group of orcs out on a Hakhud, a journey beyond the clan’s hearth to cleanse the lands their ancestors had despoiled and learn from both the old knightly orders and new adventuring bands to take the first steps towards reconciliation."
 B23_recent_hakhud:0 "Recent Hakhud"
 B23_recent_hakhud_desc:0 "We have recently embarked on a Hakhud, and will not be able to go on another until this modifier expires"
 flavour_rotcleaver.110.t:0 "Hakhud Handler"
 flavour_rotcleaver.110.d:0 "This should be hidden! If you are seeing this and didn't just load your save, please make a bug report on the discord!"
 flavour_rotcleaver.110.a:0 "<3"
