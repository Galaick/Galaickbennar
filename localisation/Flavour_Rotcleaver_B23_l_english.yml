 flavour_rotcleaver.25.t:0 "Inheritance"
 flavour_rotcleaver.25.d:0 "The boy finds him standing over the last embers of the fire. Rage burns hot behind his gaze as he throws an axe at the warrior's feet. “Old man!” the boy screams as the rest of the camp stirs. “You seek to destroy us by consorting with those who want us dead! Did you think I would sit idly by while you brought us all to ruin?!”\n\nThe warrior sighs, bending slowly to seize the axe from the ground. “We cannot fight them forever, Zathra. How far will you go to see every human in these lands dead?”\n\n“As far as I must to protect my people. Do you know how many of us died while you wandered?” The boy walks to the warrior, planting a finger in his chest. “Never again will we suffer a human to live. This I swear.”\n\nThe warrior looks down at the boy as only a father could. “So it's Ozarm'chadash, then.”\n\nThe boy gravely nods. “There can be no other way.”\n\nA crowd has formed around them now, obscuring them from outside view with the bodies of their people. The girl, waking from her slumber, steps out of her tent in the treeline and sees the crowd forming. She runs, trying to push through to the sound of axes clashing. Finally, she pushes into the circle.\n\nThe warrior lies defeated, blood pouring from a wound on his head. He looks around the crowd until his eyes find the girl. He gives one last weak smile. They both know what it means.\n\nThe boy pushes the warrior onto his back, planting his boot on his chest and leaning into his face. “Am I worthy now, father? Do you finally see how my strength will guide us forward?”\n\nThe warrior looks into the boy's eyes, his strength draining fast into the dirt. “You were always worthy,” he wheezes, “for a father cannot help but love his son.”\n\nThe boy screams, pushes off the warrior's body, and swings his axe into his chest.\n\nThe tyrant stands, looking over the people of his new clan."
 flavour_rotcleaver.25.a:0 "And the girl is nowhere to be found"
