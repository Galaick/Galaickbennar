l_english:
 flavour_zyujyut.900.t:0 "Integrating the Bokai"
 flavour_zyujyut.900.d:0 "The dense jungles of Zyujyut harboured many reclusive and disparate cultures, remnants of the past stubbornly refusing to integrate with the Naamjyut and accept the culture of the greater Yan. With the jungle haven of [Root.GetName] now under our control for the foreseeable future the locals have finally seen fit to change, and have begun to adopt the culture of the Yan in earnest."
 flavour_zyujyut.900.a:0 "Welcome to the fold."
 lamwun_vermillion_gov_tt:0 "§YGovernment Mechanics:§!\nOwning §YLamwun§! will grant: \nYearly Legitimacy: §G+0.50§! \nImprove Relations: §G+15.0%§!"
 vermillion_throne_gender_tt:0 "§YMonarchs§! and §YAdvisors§! are inherently §YMale§!\n§YGenerals§! are inherently §YFemale§!"
 
 flavour_zyujyut.100.t:0 "Women Wearing Pants in Rice Fields"
 flavour_zyujyut.100.d:0 "Recently, the $ESTATE_NOBLES$ have been complaining to $MONARCH$ about the attire of the women in [women_wearing_pants_target.GetName]. An increasing number of them are beginning to wear pants when working in the rice fields due to skirts being inconvenient to wear in the often flooded fields. The $ESTATE_NOBLES$ claims that our ancestors would not approve of such an attire being worn by women and it is sacrilegious of them to do so. They wish for us to forbid such outrageous attire within our borders."
 flavour_zyujyut.100.a:0 "Wearing skirts in the wet rice fields sounds awful!"
 flavour_zyujyut.100.b:0 "That's not just uncivilised, it's sacrilegious!"
 flavour_zyujyut.100.c:0 "Let’s try to find understanding between the parties"
 flavour_zyujyut.100.e:0 "The women shall obey our tradition and they shall do so obediently!"
 flavour_zyujyut.100.f:0 "This tradition is backwards, let’s encourage abandoning it"
 flavour_zyujyut.100.g:0 "They can wear what they want… for a price…"
