 naamjyut_appeased_clans_and_local_women:0 "Appeased Clans and Local Women"
 naamjyut_women_dress_code_enforcement:0 "Women’s Dress Code Enforcement"
 naamjyut_dress_code_reforms:0 "Dress Code Reforms"
 naamjyut_pants_tax:0 "Pants Tax"
 
 flavour_zyujyut.101.t:0 "Cha Wing Ying and the Blademaidens of [4837.GetName]"
 flavour_zyujyut.101.d:0 "While the many Halessi traditions of martial monasticism are most prominent around Xianjie, chi martial art practitioners are widely found across Haless with monasteries across much of Yanshen as well. One such monastic order settled on the isle of [4837.GetName] off the coast of Naamjyut, practicing their faith isolated in their temple near the peak of Mount Ginsin above the towns and villages of the island.\n\nYears ago, a local girl by the name of Wing Ying from the minor clan of Cha was harassed by suitors from larger local clans who wished to have her hand in marriage. When she escaped inland to the hills, the monks from the temple took pity on her and took her in as a lay apprentice. In just a short few years, she had mastered the martial arts of the Xia and combined it with techniques of spirit sword wielding from her homeland, creating her own form of martial art and formed a female-only martial order of her own known as the “Blademaidens”. It is said that their swordsmanship was unrivaled in Haless and each of their members could allegedly fend off many on their own."
 flavour_zyujyut.101.a:0 "Impressive! Invite her to court to teach our men how to fight"
 flavour_zyujyut.101.b:0 "Her skills will serve us well in the field"
 
 flavour_zyujyut.200.t:0 "Feuding Between Local Clans"
 flavour_zyujyut.200.d:0 "News has reached us about a long series of disputes and misunderstandings between two clans in [clan_war_target.GetName] that have just escalated out of control! The clans are now calling their allies for aid and preparing their militias for warfare.\n\nWhile the clans of Naamjyut have often battled one another and armed conflict isn’t anything new and we don’t have much to gain by intervening, it is the [Root.Monarch.GetTitle]’s duty to mediate the clans and coordinate cooperation between them, and doing so may prevent mindless bloodshed."
 flavour_zyujyut.200.e:0 "News has reached us about a long series of disputes and misunderstandings between two clans in [clan_war_target.GetName] that have just escalated out of control! The clans are now calling their allies for aid and preparing their militias for warfare.\n\nWhile the clans of Naamjyut have often battled one another and armed conflict isn’t anything new, unruly habits of theirs such as these that blatantly ignore the rule of law may make us seem neglectful and incompetent, but intervention might make the locals unhappy."
 flavour_zyujyut.200.a:0 "As the [Root.Monarch.GetTitle], it is my duty to mediate peace"
 flavour_zyujyut.200.b:0 "As the [Root.Monarch.GetTitle], I shall send troops in to keep the peace"
 flavour_zyujyut.200.c:0 "Try to talk some sense to them"
 flavour_zyujyut.200.f:0 "Enforce the peace by force"
 flavour_zyujyut.200.g:0 "We have nothing to gain here"
 local_naamjyut_clan_war:0 "Local Clan War"
 naamjyut_clan_war_crackdown:0 "Crackdown on Clan War"
 
 flavour_zyujyut.201.t:0 "Clans defies our decision"
 flavour_zyujyut.201.d:0 "Despite our best efforts, our attempts to broker peace have broken down. The clansmen have gathered and began to march for war against our wishes. Although their ire is not pointed at us, such pointless blood feud threatens the peace in our realm and risks allowing the winning side to gain much more influence in the local region, threatening our legitimacy to rule as [Root.Owner.Monarch.GetTitle]."
 flavour_zyujyut.201.e:0 "Despite our best efforts, our attempts to keep the peace have failed. The clansmen have gathered and began to march for war against our wishes. Although their ire is not pointed at us, such pointless blood feud threatens the peace in our realm and risks allowing the winning side to gain much more influence in the local region, threatening our legitimacy to rule as [Root.Owner.Monarch.GetTitle]."
 flavour_zyujyut.201.f:0 "Despite our best efforts, our attempts to broker peace have broken down. The clans refused to even participate in our mediation, claiming that outsiders like us have no right to intervene and have gathered to begin marching for war against our wishes. Although their ire is not pointed at us, such pointless blood feud threatens the peace in our realm and risks allowing the winning side to gain much more influence in the local region, challenging the rule of our empire as a whole."
 flavour_zyujyut.201.g:0 "Despite our best efforts, our attempts to broker peace have broken down. The clans ignored the presence of our peacekeeping forces and fought each other anyway and have gathered to begin marching for war against our wishes. Although their ire is not pointed at us, such pointless blood feud threatens the peace in our realm and risks allowing the winning side to gain much more influence in the local region, challenging the rule of our empire as a whole."
 flavour_zyujyut.201.a:0 "Enough with the diplomacy, crack down on their conflict"
 flavour_zyujyut.201.b:0 "How dare they claim this to be not my business! This is my realm!"
 flavour_zyujyut.201.c:0 "As the [Root.Owner.Monarch.GetTitle], they shall not defy my ruling!"
 flavour_zyujyut.201.h:0 "I am their sovereign! How dare they insult my right to rule!"
 flavour_zyujyut.201.i:0 "We tried, can’t do anything more than this"
 
 flavour_zyujyut.202.t:0 "Clans Attack Our Forces"
 flavour_zyujyut.202.d:0 "In an unexpected turn of events, the feuding clans have decided to band together against us, claiming our military presence to be infringing on their rights and autonomy and is disrespectful of Naamjyut culture! While their ire is not pointed at us, such a pointless blood feud threatens the peace in our realm and risks allowing the winning side to gain much more influence in the local region, and some within our court worry that if such a blatant act of disobedience goes unpunished, our rule would seem weak to our other subjects and demand actions to be taken immediately to save face."
 flavour_zyujyut.202.a:0 "It’s treason then!"
 flavour_zyujyut.202.b:0 "Fine! I’ll leave those childish savages to fight one another!"