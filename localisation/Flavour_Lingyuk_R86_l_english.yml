l_english:

 #Missions
 R86_cultivation_of_land_title: "Cultivation of Land"
 R86_cultivation_of_land_desc: "One of the four handmaidens of the order (though nominally led by Huszien Herself, she is much too busy with governance) has been charged with improving agricultural output however she can. To do so, she has come up with a revolutionary new plan:\n\nLandowning aristocracy pepper the countryside, parceling out the land they own and taking a share of the rice harvest. If these middlemen were eliminated, that much more of the common-folk's produce would make its way into the state's hands. Sure, they might oppose the seizure of their estates, but what use does a fox have for the opinions of rats?"

 R86_fading_is_the_harvest_moon_title: "Fading is the Harvest Moon"
 R86_fading_is_the_harvest_moon_desc: "Everything has gone to plan. At least, it has gone within acceptable parameters. Moving the land has taken some time to finalize, but Huszien be praised, we are finished! We have transferred the land directly to those who work it, allowing them to tend it however they see fit. The soil, energized by techniques that only the people working it know, grants them its bounty; The people, spurred to generosity by our deeds, give their bounty freely to us. Huszien's directive is accomplished; She shall feast well upon our deeds. More importantly, this plan can be applied to any new conquests..."

 R86_securing_of_riches_title: "Securing of Riches"
 R86_securing_of_riches_desc: ""The urbanites have learned their lesson. Perhaps they've learned it too well. I have learned of a conspiracy that exists between the biggest traders; they want to flee the country together, protecting one another while taking their riches with them. I have no intention of letting it happen. Our window for action is small, but I will handle all of it.""

 R86_light_is_cherry_blossom_title: "Light is Cherry Blossom"
 R86_light_is_cherry_blossom_desc: "The flaky, profit-obsessed burghers of the realm have been fully replaced with the vastly more faithful (and reliable) common-folk, the most industrious of which have been happy to take up the mantle of traders. Towns and villages prosper with their aid, the most successful of the new merchants happily reinvesting in their places of residence. Spurred on by a calling deeper than simply accumulating riches, they have been quite eager to help spread the word of Huszien everywhere they go. Sure, some money might be lost in the process, but so be it! If that is the cost of faithful, reliable men, then it will be paid a thousand times over!"

 R86_conclave_of_maidens_title: "Conclave of Maidens"
 R86_conclave_of_maidens_desc: "With the proclamation of [Root.GetName], we no longer need to hold aspirations of republican rule - the state will be run exclusively by the Maidens of Liho. Commoners, merchants, and nobles alike cannot be trusted with the reins of state, bound as they are to the petty shackles of the material world. Only we are able to properly serve Her. The new Yanshen must be reshaped from the top down to accommodate both Huszien and Liho's Maidens. To stop at anything less would be failure. To fail now would be sin inconceivable; Her will must be carried out."

 R86_endeavour_for_security_title: "Endeavour for Security"
 R86_endeavour_for_security_desc: ""I do not trust our military. The officers are quick to profess their loyalty for Huszien, but I doubt many of them would really die for Her cause. No, I don't think they're that pliable, either. That's why they need to go. Huszien has requested that we modernize the military... and this is just the way to do it. We'll replace them all with spirits and maidens. Bound by either oaths or pacts, they will be entirely willing to follow Her commandments as we deem necessary. This is a modern-day army: totally subject to the state!""

 R86_red_runs_the_yanhe_title: "Red Runs the Yanhe"
 R86_red_runs_the_yanhe_desc: "After a few years of "recruitment", the military leadership of [Root.GetName] is finally in the state it needs to be. Those traitors that infested the ranks before are forgotten. Their legacy will not be remembered. Replaced by spirits and the Maidens of Liho at all levels, the most faithful of our number will now be able to whip the soldiers into a righteous frenzy against our foes. Much organizational capacity was lost in doing this, certainly, but it is vastly more important that Her faithful are the only ones allowed any purchase in the military. No fifth columnists will be able to stop us from serving the spirits of Haless."

 R86_onwards_lingyuk_title: "Onwards, [Root.GetName]"
 R86_onwards_lingyuk_desc: "Haless is finally bleeding out its rotten blood! On all fronts, the High Philosophy scholars recede and shrink! Even the stronghold of their sin, Rahen, is besieged on the outside by maddened sun worshippers and godless hobgoblins, and on the inside by the slow revelation that all their faith has ever existed to do is torture spirits. Now is the time to smash them all and liberate Haless from the vice around its neck! Their temples must be destroyed; their scholars butchered, and their legendary decadence cleansed from Halann! Huszien smiles down upon us, for we bring glory to Her name!"

 R86_shi_quan_shi_mei_title: "Shi Quan Shi Mei"
 R86_shi_quan_shi_mei_desc: "It will take decades before the blood of the past few years has fully dried up. These losses are justified, though - in just a scant few years the entirety of Haless has been united under one faith, brought together under our banner. Many have not survived to see us bring peace and order back to these lands, united in their devotion to Huszien and Her siblings, but for the rest they will know paradise.\n\nPerhaps we have lost sight of why we were really doing this: for the good, spirit-loving people of Haless. The time has come to set down our weapons and pick up our plows, cultivating a perfect land; Here, the spirits and humans (and even the hobgoblins) will be able to live in harmony, working together to create a better future for all. It is time to rest. Haless has earned it."

 R86_enabling_of_truth_title: "Enabling of Truth"
 R86_enabling_of_truth_desc: ""Though it is an idea that is, on the surface, heretical, it is an unfortunate fact that Huszien and Her children are not entirely fit to govern a state. Her mind has not fully bridged over the gaps created by millennia of being sundered, and this bleeds into Her decisions. Our role as maidens, of course, is to follow Huszien's decrees - but should we also not attempt to prune them? She wants what is best for us, but we, who execute Her decrees, know better than Her what works and what doesn't. A lot of the state will need to go. But to help [Root.GetName], that's a small price.\n\n...No. No. Keep Sado far away. If she catches wind of this, it'll be all our heads.""

 R86_wise_is_the_maiden_title: "Wise is the Maiden"
 R86_wise_is_the_maiden_desc: "At last, through no small administrative nightmare, the state has been fully reorganized. From bottom to top, either the Maidens of Liho or the spirits they have summoned run all organs of state with total control. All knowledge runs through one of the four "Mothers of [Root.GetName]", the council that leads the Maidens. From here, it is processed and forwarded to Huszien and Her children, such that they may decide how best to act upon it. Only the most pertinent of information reaches Huszien; this way, we will not disrupt Her natural healing process until her mind is totally mended. Besides...\n\nWhat She doesn't know can't hurt Her."

 R86_a_knife_in_the_dark_title: "A Knife in the Dark"
 R86_a_knife_in_the_dark_desc: "The Xia, righteous as they might be, are misled. They have failed to adjust their ways, even in the face of countless revelations from around the Yanhe. It is utterly baffling that they, who so dearly respect the spirits, would be so willing to court the High Philosophy urbanites that have tortured the same spirits they revere. No, it is not just baffling - it is unforgivable. If they will not chase out the urbanites, then they are no better. We must save the Xia from themselves. Even if we must do it one step at a time, the spirits of Haless deserve no less. Perhaps we shall start by cultivating an old friendship..."

 R86_the_dakini_title: "The Dakini"
 R86_the_dakini_desc: "Less known than their cousins, the Dakini are a group of half-fox, half-dragon spirits descended from Yanhe and Huszien. Their nature as children, rather than fragments, are why they did not join the Huli-Jing and the Gumiho in the Eternal Debate. They still hold a great fondness for Huszien in their hearts. Convincing them to aid our cause in the Xia should not be too difficult. Since they hold within them power from both great spirits, it will be easy for them to wreak havoc enough for us to exploit it. We will not regret building ties with them later, either..."

 R86_martial_masters_title: "Martial Masters"
 R86_martial_masters_desc: "Now the urbanite scholars of the High Philosophy will be given the welcome they deserve: run out of the Xia, or worse! In the process of aiding the Dakini - and being aided by them in return - they have supplanted a variety of local spirits as the object of primary dedication for many of the monks residing there. It's not quite as desirable as worshiping Huszien Herself, but it is ironic that the Xia, children of Yanshen, would worship the children of the spirits of Yanshen. Their mastery shall augment our armies; their worship shall bolster our faith. All has returned to what should have been to begin with. Now, there is but one last affair to settle..."





 #Events
 flavour_lingyuk.1.t: "Liho's Maidens Seize Power"
 flavour_lingyuk.1.d: "Emboldened by their growing dominance in nearly all sectors of society, the Maidens of Liho have finally mobilized their influence and seized total control of the state! Executing a meticulously planned coup, they have dismissed the [Root.Monarch.GetTitle] and [Root.Monarch.GetHerHis] government entirely, enforcing their removal using the military. Though there are some objections (and Holi certainly is not pleased about the display), most have been hushed using the judicious application of gold."
 flavour_lingyuk.1.a: "All things considered, it's surprising it took this long..."
 flavour_lingyuk.2.t: "Huszien Gives to Us"
 flavour_lingyuk.2.d: "The first directive towards cultivating the practice of agriculture was simple: Huszien decrees that there will be no more privately-owned land. It would all return to the purview of the state, who would grant those living on it permission to use the land as they see fit, so long as appropriate tribute was paid to [Root.GetName]. For smaller, less greedy landholders, this is not that bad - they will probably end up with more-or-less the same land that they had before. For the influential aristocracy, however...\n\nThose with the resources to do so have raised armies, funded by themselves, in a desperate bid to stop [Root.GetName] from taking their land, in full knowledge that they defy Huszien's decree to hand over their land. Until they're dead, reorganizing their demesne is a risky move. Rout their armies and kill the leaders."
 flavour_lingyuk.2.a: "If they will not stand aside, they will be forced aside."
 flavour_lingyuk.3.t: "We Give to Huszien"
 flavour_lingyuk.3.d: "With the worst fighting out of the way, the land redistribution can finally begin in earnest. Instead of being owned by a single individual, all land will be owned solely by [Root.GetName]. If we decide someone is not using their land properly, we have full authority to drive them off of it. Hopefully it will not be needed. Each parcel of farming land will be distributed to an individual family, who will then be free to tend to it however they see fit. Whatever works best for them (and the land) is best for us; as long as the appropriate rice tax is paid, then there is no problem.\n\nThis system is currently undergoing growing pains. The new land-holding class is learning how to best work their land, now that they have been freed from crushing restrictions on what they can grow, and now the most we ought to do is let them learn the way of the land. While we might have lessened yield now, Huszien is patient - to have more later is worth having less now."
 flavour_lingyuk.3.a: "In time, Huszien will receive Her due."
 flavour_lingyuk.4.t: "A Sunny Day in [Root.GetName]"
 flavour_lingyuk.4.d: ""My life is a simple one. At sunrise, I rise from my bed, offer my prayers to Huszien, then get to work. If I have no work, then I have the day to myself. Ever since they gave me my own land to use, it's ended up that much more productive. Now that I have gotten the chance to keep the harvest myself, it's made growing more that much more enticing. I sell my produce, and then I buy things to make my farm grow crops better. Without having to worry about being taken off on campaign, or my property seized by an angry aristocrat, things have been only getting better.\n\n"Oh, do I know how my neighbors are doing? As far as I can tell, as good or better. Nobody has any land they or their families can't work, so none of it goes to waste. Paying the rice tribute isn't too difficult. It only takes up a small amount of the farmland, anyways. I'm very thankful that Huszien has done this for me. I only wish the competition at the market wasn't so fierce.\n\n"Anything else I'd like to add? Hmm...""
 flavour_lingyuk.4.a: ""I'm still not used to paying taxes in coin, rather than crops.""

 flavour_lingyuk.5.t: "Stirrings in the Countryside"
 flavour_lingyuk.5.d: "There is resentment across the farmlands of the realm; The common people of the land are beginning to see the High Philosophy urbanite merchants as greedy, self-centered and undeserving of the wealth they have doubtlessly lied and cheated their way into possession of. It can only be a few years at most until they take matters into their own hands and form mobs to attack the traders they have come to hate once more. Many of them are still armed from the last time they attacked the urbanites, so all it will take is enough provocation to make the common people take up arms once more.\n\nThis is not risk-free, of course. While unlikely, these same common folk might rebel against us for harboring these merchants, not understanding the deeper designs at play. In a few years - as few as five - they will assuredly harbor so much hatred for these merchants as to finally attack them, allowing us to kill two birds with one stone."
 flavour_lingyuk.5.a: "This time, Holi won't stop us."
 flavour_lingyuk.6.t: "Huszien Our Light"
 flavour_lingyuk.6.d: "Finally, the urbanites have been massacred! Militias of farmers gathered and, once more, assaulted the cities. Directly aided by our forces (and some strategically placed maidens), they have been able to finish the job of annihilating the disloyal merchant class. A myriad of traders, most caught halfway in preparing to flee the country, have been lynched and their wealth expropriated in the name of [Root.GetName]. Now comes the second part of the plan - redistributing that wealth.\n\nAfter being taken by the state, we will now arrange a grand celebration where only "the most pious" will receive shares of the treasure taken from the dead, courtesy of Huszien Herself. If Huszien were to give these individuals not only spiritual fulfillment, but material success at the same time, we could create a class of utterly devoted merchants who will both trade and spread Huszien's word at the same time. It will take some time until these commoners have settled into their new roles in the economy, but this matter is well worth the wait..."
 flavour_lingyuk.6.a: "The faithful must not be afraid to speak out."
 flavour_lingyuk.7.t: "Wealth of Huszien"
 flavour_lingyuk.7.d: ""Listen to me well! If you do, I will sell for half price!\n\nThere is no point convincing you to worship Huszien Herself, for you are not from Her domains. Even so, you must change your ways and embrace the spirits! You name yourselves followers of the Accretive Path; I say you are caught between your natural and good desire to worship the spirits around you and the dictations of the High Philosophy, who want to mandate that you must grit your teeth and bear the injustices visited upon the benevolent spirits of Haless!\n\n"You must remember that these urbanites hold no sway outside of Rahen, for the great and glorious [Root.GetName] has driven them back on all fronts! Do not be afraid to embrace harmony with these majestic beings! You have no cause to disguise it as respect anymore. That I, a mere farmer, might be able to travel abroad and tell you these wondrous things should prove their benevolence - for my wealth is Huszien's - and should also show you the tides of victory. Come! Purchase the fruits of my harvests! But remember who let me sell it to you!""
 flavour_lingyuk.7.a: ""Wake up, children of Haless! Harmony is returning to this land, step by step!""
 flavour_lingyuk.8.t: "Treason Against [Root.GetName]"
 flavour_lingyuk.8.d: "There is betrayal within the highest ranks! The highest echelons of the military, blinded by the prospect of career advancement, run the risk of acting contrary to [Root.GetName]'s needs. Their distrust of Liho's Maidens is well known, and has managed to perpetuate itself between generations of leaders. As the Maidens grow more influential in the government, the prospect of a disloyal organ of state is unfathomably risky. If we are not careful, they might think to challenge the maidens; considering their control of the military, they might well succeed.\n\nAs Huszien has asked us to create a modernized army for [Root.GetName], this presents us with an opportunity to follow Her designs while still advancing our interests. As far as anyone has to know, the officers leading [Root.GetName]'s military have already tried to sabotage it. The punishment, as with all forms of treason, is death. [Root.GetName] will harbor no traitors."
 flavour_lingyuk.8.a: "Especially future traitors."
 flavour_lingyuk.9.t: "Brigands of Yanshen"
 flavour_lingyuk.9.d: "Unfortunately, the annihilation of the officer class has not been without some... complications. Killing traitors requires no time at all, but training replacements takes a considerable amount longer. During this time, the lack of large sums of the command structure has caused discipline within the ranks to break down. With no figures to guide them, our army has earned the title of being the "Brigands of Yanshen"\n\nAs the lack of individuals to oversee logistics has set in, "living off the land" has become the dominant method of obtaining supply. With few to stop them, the soldiery has had the opportunity to indulge their greed - something they have taken to eagerly, for they take nearly everything not nailed down. With none to rally them, they have taken to breaking and fleeing as soon as they think their lives are endangered.\n\nSadly, this is blood that must be shed. These problems will disappear in due course as we replace our officers with new, loyal individuals. In due time (and perhaps some enchantment magic), the idea that our men are brigands will also be forgotten."
 flavour_lingyuk.9.a: "See? Sabotage! Look how the dead tried to make us dependent..."
 flavour_lingyuk.10.t: "An Officer's Career"
 flavour_lingyuk.10.d: ""I honor Huszien with everything I do. It's been that way for years. That's how I made it here, why I'm speaking to you all today. When I was born, it was into a High Philosophy family of glassmakers. We were pious people. Always thought the temples were for everyone's good. When news broke about what they were really there for, it shook me to my core. So I decided something needed to be done. My old studies were put to the torch and then I enlisted in the military.\n\n"Nobody trusted someone like me much. Even though I had put behind my roots as one of the spirit-torturers, nobody seemed to acknowledge my piety. With the new modernizations, though, I have finally been able to have my position match my faith. You need to trust in Huszien. That I am here and speaking to you all today is proof that your dedication to Her will be well rewarded. All you need to do is follow the decrees given down to you by Her and Her maidens, and in due course your valor will lead you to a rank as high as mine, if not higher. Now, with that being said...!"
 flavour_lingyuk.10.a: ""Who of your number will make an offering to the spirits first?!""
 flavour_lingyuk.11.t: "Treason Against the Maidens of Liho"
 flavour_lingyuk.11.d: "As it turns out, it was not just the military that sought to buck the Maidens of Liho. Members of the state on all levels, from high to low, have shown their disloyalty to the new [Root.GetName] in the form of reluctance to obey their betters. Though they understand fully well what needs to be done for Huszien's sake, they are willing to indirectly harm Her by depriving Her of an opportunity to recover. Everyone whose loyalty cannot be verified must be removed. If they do not leave their posts, then they will die. For the next few months, rather than grow, the state will instead have to shrink."
 flavour_lingyuk.11.a: "What we do is for the best, and they must understand that."
 flavour_lingyuk.12.t: "A Distracted State"
 flavour_lingyuk.12.d: "Lately, the state has been suffering from the changes in staff. Having yet to be replaced, a litany of positions have had to have their duties taken up by others in the chain. If anyone knew that a magistrate had to do the work of their tax collector and their courier at the same time, then it would explain the rushed, half-finished jobs that have become commonplace. Though the worst of it is concealed from outsiders, inside the bureaucracy itself there is even a moniker for it: we have become a "distracted state", in reference to the fact that nearly everyone is seemingly too busy with their extra tasks to really give their actual duties their all.\n\nThe worst of it has, by now, already begun to fade; as reality has set in and positions are re-filled, the strain placed upon those in office has begun to decrease. The new hires, unquestionably loyal to the Maidens of Liho, have taken to the extra work with eagerness. We will not be able to entirely be rid of this "distraction" until the reorganization is finished, but at least it probably won't get any worse."
 flavour_lingyuk.12.a: "Good help is hard to find. Especially when they need to also be unquestioningly zealous."
 flavour_lingyuk.13.t: "Dissemination of Truth"
 flavour_lingyuk.13.d: "Sado closed her ledger with a quiet thud. All of these accounts seemed too good to be true - especially when put beside one another. She put her gaze to Zhèng, who wore her ceremonial mask as if it would conceal her guilt. Certainly, it made it hard to read her face. For years, the entire government had been slowly closed off from Sado, and now she sat face-to-face with the woman who was, more likely than not, responsible.\n\n"After months of not contacting me beyond the bare minimum, you suddenly decide I need to see all of these stories...?" Sado asked, deadpan tone betraying her true feelings.\n\nThe maiden across from her clapped her hands. Her practiced speech failed to conceal her fear from Sado. "That is exactly why I'm bringing them to you! With the recent changes in administration, I thought that you might like to know how things are progressing around [Root.GetName]."\n\nSado gripped her ink brush tightly. She put on her best facade of patience. "I don't suppose you have been trying to lock me out of government?"\n\nZhèng did not react. Instead, she said, "You would need proof for an accusation like that. As far as I am aware, you have none." She placed a bottle of Mijiu onto the table, pulling it up from around her feet. "Here. Consider this my offering for this meeting. Everything we do is for Huszien's wellbeing - and that means yours, too."\n\nSado could only watch on as the handmaiden walked off and out of view. This problem wasn't going to be fixed quickly. She looked at the Mijiu. Perhaps Holi had a point..."
 flavour_lingyuk.13.a: "Sado drank long and hard into the night."
 flavour_lingyuk.13.b: "Sado picked up her brush."
 flavour_lingyuk.14.t: "The Children of the Fox and the Dragon"
 flavour_lingyuk.14.d: "As we suspected, the Dakini still have plenty of loyalty to their mother - working on Her behalf, we were quickly able to get many of them on board with our plans. In exchange for bribes of money and Mijiu, as well as the promise of future tribute, they have agreed to use both their charms and their wit to stir distrust and greed in the hearts of the myriad Xianjie. The ground will soon be perfect for our intervention.\n\nAt the same time, we have also set up good and lasting relations with the Dakini. Though they are not part of Huszien, they have been granted an observatory role in the government befitting their close relationship to Her grace. In the future, we can expect them to lend their magical talents to [Root.GetName] when we request."
 flavour_lingyuk.14.a: "Ah, what a lovely set of friends to have..."
 flavour_lingyuk.15.t: "Shí Quán Shí Mei"
 flavour_lingyuk.15.d: "For the first time in many, many, many years, the sun has risen to greet a peaceful Haless. For a brief, wonderful day, none sharpen their blades; there will be no war between the denizens of [Root.GetName], for they have been united with the spirits once and for all. None will need to worry about impending hobgoblin invasion, nor the threats of brigands, and especially not the threat of some spirit driven mad by torment killing family and livestock alike. There is only harmony.\n\nSuch a thing is not free, of course - the diligent work of [Root.GetName]'s agents is necessary to keep the peace. There are those who would see the harmony of Haless disrupted: Rebellious hobgoblins, heretical half-tiger beasts, and even stray oni still roam the countryside, unwilling to face the fate they deserve. It is the duty of the Maidens of Liho to exterminate those who would challenge the peace; to hunt them down and annihilate those who would interrupt the coming century of harmony.\n\nThe peace that will envelop Haless will be eternal, once it is secured. For a day, perhaps a week or even a month, there will be no conflict. Until those subversives within the nation are corralled, though, the threat of war will always loom over Haless. This is the meaning of internal perfection - there can be no nations, no borders to do battle over. There can only be the reverence of the spirits (Huszien most of all), holding no idols before them. It may take decades. It may even take centuries. But this is the inevitable fate of Haless."
 flavour_lingyuk.15.a: "There will only be [Root.GetName], and with it harmony between man and spirit."



