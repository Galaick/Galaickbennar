 estate_burghers_jungle_expansion:0 "Jungle Expansion"
 estate_burghers_jungle_expansion_desc:0 "Burghers and peasants alike have adapted to the difficult terrain of the tropical jungles, which allows them to build magnificent towns in even the most remote and the most overgrown rainforests of our [Root.GovernmentName]. By granting them more privileges we can ensure that they use their resources for the best of our country."

 flavor_butuguzi.1.t:0 "Taking Stock"
 flavor_butuguzi.1.d:0 "“Careful with that branch!” Mrs. Yi shouted across the courtyard. The goldscale froze, pruning shears still clasped around a limb, not resuming until she had finished her long winded tirade.\n\nThe favorite courtyard of the Council of Seventeen had seen better days. Several of its walls had been reduced to piles of rubble, the tiled roof still bore the marks of fires started during Gumti’s conquest, and the less said about the gardens the better.\n\nAll that mattered little, for all seventeen families were present once again. The Yi, Cin, and Tembo families had been unable to escape from Fuhoengwaan before it fell to the bandits of Gumti, and so all the meetings of the families-in-exile could not be held at full strength. Gossip about their fate had taken the form of a series of increasingly dramatic rumors, culminating in a claim that the entirety of the Cin family had been devoured by feral shifters, but returning to the city had put those rumors to rest. The families had mostly been lying low and preparing to rise back up, with the Tembo family waging an especially nasty campaign against the occupiers using alchemical explosives.\n\nOnce coffee had been poured and every family had complained about the quality of their assigned seat, the meeting could finally begin. The usual grievances and accusations were traded, but they had a perfunctory tone, for once the Seventeen were in agreement with each other. Fuhoengwaan, the heart of Butuguzi had been conquered, reconquered, burned, looted, and rebuilt for the last time. So long as the warlords continued their struggles for supremacy over Bamaliwuni, the city, and the Butuguzi with it, would suffer. After a brief debate, the beans were cast and a course was decided - it was time for the warlord era to be brought to a close.\n\nAs the scribes recorded the decision, copied of course in all three of the families languages, Mrs. Yi glanced suspiciously over at the kobold who had resumed his work, before grunting in disappointment after finding nothing to complain about."
 flavor_butuguzi.1.a:0 "United once more"

 flavor_butuguzi.2.t:0 "Forced Liquidation"
 flavor_butuguzi.2.d:0 "“You tea drinking rat, you don’t even care about the copper mines! I should just let you take the damn thing!”\n\nThe auction was once again interrupted by the representative of the Han-neip family taking out their anger against the Mbabzi representative, who was lounging smugly in her chair as Mrs. Han-neip grew increasingly red in the face with anger.\n\nWith the warlords driven from the mountainous interior, their claims over the region’s mines were declared void and placed before the Seventeen for auction. Merchants, smiths, caravan masters, and family agents crowded beneath the awnings, studying maps and ore samples while scribes and auctioneers worked to keep everything running smoothly, or at least as smooth as was possible with rival families involved.\n\nThe Han-neip were here for the copper mines. Their bronze forges consumed more metal every year as the Butuguzan army continued to grow, and direct control of the supply would free them from unreliable merchants and warlord tolls that had plagued them for decades. The Mbabzi instead coveted the gem mines, whose stones had long been among the most profitable goods carried by their caravans to the coast. Both of the rival families were determined to make the other bleed for every penny, and the auction had quickly turned ugly as a result. Hours later, the winning bids were tallied, and only one family could truly claim themselves victorious."
 flavor_butuguzi.2.a:0 "The Han-Neip family wins"
 flavor_butuguzi.2.b:0 "The Mbabazi family wins"

 flavor_butuguzi.3.t:0 "Returning to Normalcy"
 flavor_butuguzi.3.d:0 "The meeting opened with a toast to victory, unity, and the end of the warlord era. The porcelain coffee cups clinked together, platitudes and praise were passed around, and the infighting immediately began anew.\n\nEvery family had their own demands and schemes. The Mbabzi demanded reconstruction of the road system, the Lee, Kagona, and sa Sinwauk families had formed a coalition petitioning for further expansion of the fleet (though each insisted they should be in charge of such a project). Han-neip and Zong both argued that the funding should go into the army, though they disagreed on whether it should go towards expanding new bronze foundries or recruiting more trainees.\n\nThe Tembo family brought up their long standing proposal of building a new library that could rival the Library of Qasri Aqoon in Baddabi, and were greeted with eye roll by the others. The four families that dominated the coffee trade (though of course every family maintains their own plantations), the Umulisa, Yi, Urunekozi, Goeng had wandered off into some arcane spat about growing techniques and irrigation that no one truly cared to follow.\n\nThe other families stayed quieter, not caring to join the main arguments in earnest but interjecting on occasion to further their own agenda. Mrs. Rukundo was trying to pitch the other families on debt financing the necessary infrastructure projects to rebuild, with the Gunam-Neip acting as loyal lapdogs and yeswomen. The Mou and Kot families were ignoring everyone else to focus on their plans to visit relatives in Zyugok. Mrs. Nkurunziza had already left the meeting, having decided that more political capital could be gained by playing to the commonfolk of the city.\n\nIn the middle of it all, Mrs. Cin rose repeatedly to mediate, translate, or simply try to get everyone to stop shouting over each other. Her final appeal was interrupted when a porcelain cup sailed past her head and shattered just inches away from the kobold known as Silver Tooth, who was brewing the coffee in the corner. She ducked under the cart, hoping to avoid the ire of her masters, as the conquerors of Bwa Dakinshi descended ever further into argument. The warlords were gone, but unfortunately, so was the one matter upon which the families had agreed."
 flavor_butuguzi.3.a:0 "Peace at last"

 flavor_butuguzi.4.t:0 "Parley"
 flavor_butuguzi.4.d:0 "On an island in the middle of the ringlet sea, barely more than a sandbar in truth, sat a large table and a small kitchen, both nestled in the shade of the island's palm trees. In the kitchen, a team of kobolds of the highly sought after Silver Tooth lineage supplied by [Root.Monarch.GetTitle] [Root.Monarch.GetName] worked diligently, brewing the finest coffee and cooking a wide assortment of snacks to be brought over to the table every time it started running low.\n\nAt the table were seated a who’s who of the most important figures in the world of ringlet sea trade. The Seventeen families had a plethora of representatives, but joining them were Mengi merchants hailing from Yetemisira, hulking silk wrapped harimari from Vandipha, and Pinghoi buccaneers draped in their ill-gotten gains.\n\nAt this point negotiations had been going for hours, and the Vandiphan and Yetemisirans were looking worn down, having already been on the receiving end of a Dakinshi united from that had already extracted numerous concessions from them. The buccaneers were entirely disengaged, having spent the entire meeting eating their way through the food and drinking the fine coffee that had been provided without a care in the world. They knew their offer would come, and were happy to lounge around and wait.\n\nEventually the attention did turn their way. Instead of negotiation, a heavy chest was dragged over by the goldscale servants and opened, revealing a fortune of gold, silk, and gems within. [Root.Monarch.GetTitle] [Root.Monarch.GetName] informed them that more such chests awaited them onboard [Root.Monarch.GetHerHis] ship, should they agree to come work for Seventeen, as captains and sanctioned privateers."
 flavor_butuguzi.4.a:0 "Let us hope the offer is sufficient"

 flavor_butuguzi.5.t:0 "An Offer to the Captains"
 flavor_butuguzi.5.d:0 "Bwa Dakinshi has reached out to us with an interesting offer. They wish to buy out our pirate captains one and all, bringing them and their island strongholds into the fold, where they would serve as naval captains and sanctioned privateers with a great deal of autonomy. Our mainland possessions would be left alone, and given a great amount of fiscal and military backing by the now unified Dakinshi nation."
 flavor_butuguzi.5.a:0 "A generous offer, we accept!"
 flavor_butuguzi.5.b:0 "Perhaps not, we value our independence"

 flavor_butuguzi.6.t:0 "Family Reunions"
 flavor_butuguzi.6.d:0 "The harbormaster's office at Zyugok was stuffed full of representatives of seventeen families and various Naamjyut clans all crowded around a desk covered in charts and steaming cups. Coffee for the Dakinshi and tea for the Naamjyut. The Dakinshi delegation had arrived the day before, and the first day was all celebrations and reunions especially for families like the Kot and Lee, who still maintained connections with the local clans they descend from.\n\nNow it was all business, specifically trying to hammer out new trade agreements now the Bamaliwuni was no longer a mess of warlords and could be more relied upon for exports. The current issue of contention was the route the Naamjyut wanted to take through the ringlet isles, going straight south through them before turning west at the island of Gamdou. When pressed by the Kagona family representative on why they should not simply cut across along the coast of Vimadtron, they responded that there was a far greater chance of encountering Hujan on one of his rampages if they went via that route.\n\nHujan was of course a known factor to Dakinshi. The great spirit on the monsoon was known the trails of storms and destructions he left across haless and ringlet sea. It was a rare year indeed where one of Hujan's storms did not grace the coffee coast. But more interesting was why their Yan counterparts were so insistent on avoiding him at all costs. After all, every inch of the ringlet sea is ravaged by monsoons. They claim it was because of the chi Hujaan brought, making his storms bigger and the sea more unstable.\n\nThe recommended route was agreed on and the discussion moved on, but a seed of an idea stuck with the Dakinshi representatives. Chi was nigh on impossible to come by in Bamaliwuni. Even the shifters of the Bustebe Dajadera could only draw on the slightest amount from their soul animals. But if Hujan brought chi with him..."
 flavor_butuguzi.6.a:0 "...perhaps we might be able to collect it from his storms"

 flavor_butuguzi.7.t:0 "Baashiding Bidding"
 flavor_butuguzi.7.d:0 "Captain Tuyishme had visited Badda Caydhsadde before, though she scarcely recognized it now. The harbor was packed from breakwater to beach. Fishing boats slipped between merchant junks, laborers shouted over one another on the quays, and freshly arrived soldiers attempted to direct the chaos with little success. Everywhere were signs of the island’s recent conquest. The slave pens were in the process of being dismantled, to make way for more profitable industries, and in their place warehouses, workshops, and sprawling compounds had risen. The most prominent were the constructions of the Baashidi members of seventeen, who had taken the greatest interest in the island. She reckoned that was probably due to the lack of the language barrier that was ever present back in Bamaliwuni.\n\nThe Kagona family compound was closest to the shipyards, naturally. Its half-finished roofs overlooked newly cleared slips where local carpenters worked beside their in-house shipwrights. Farther inland, atop a hill overlooking the port, the Tembo family had claimed an old merchant estate and filled it with gardens, furnaces, and presumably glassware brimming with any number of bubbling alchemical concoctions.\n\nCaptain Tuyishme brought her ship alongside the quay and made her way to the harbormasters office. Pushing her way through the throngs, she presented her papers to the harbormaster, who was simultaneously arguing with a mason, two customs clerks, and a man with a parrot.\n\n“Cargo?” he asked without looking up, slamming a stamp down on another document."
 flavor_butuguzi.7.a:0 "Ropes, tar, and provisions for the Kagona family"
 flavor_butuguzi.7.b:0 "Alchemical supplies for the Tembo family"

 flavor_butuguzi.8.t:0 "Storm Seekers"
 flavor_butuguzi.8.d:0 "For months the finest gardeners and mages of Bamaliwuni had worked to transform the tip of Guwazi into something new, a sculpted wonder of nature and earthworks designed to be a perfect vessel for absorbing chi. Every bend in the canals, the alignment of each tree and bush, all part of a meticulous blueprint. In the middle of it all stood Mei Yan, a small part of a vast human pattern layered on top of the carefully crafted environment.\n\nThe apprehension in the air was almost tangible. Despite months of preparation and planning with the help of visiting masters from Yanshen, the truth was that this was all untested. So when the vast black clouds of Hujan appeared on the horizon, Mei Yan’s nerves almost broke, knowing that he was about to try to withstand and channel the storm of a great spirit. Steadying his breathing and calling on the familiar presence of his soul animal calms him down, and for a moment everything is peaceful. Then the storm lands and the world become chaos and violence.\n\nMei Yan’s eyes are forced shut by the rain as he is buffeted by small debris carried by the storm, every instinct telling him to run and find cover. Instead he reaches out into the storm. Every part of it is permeated with a richness of chi unlike he has ever felt, thrumming with energy and life. Falling back on his drills, he opens himself to the chi, channeling it into his self until he can hold no more and he releases it out, guiding it into the prepared earth below him.\n\nHours pass and he continues, one among many across Guwazi, falling into a trance of guiding the chi through himself into the land as the storm rages around him. When Hujan finally moves on to continue his endless journey elsewhere, Mei Yan falls to the ground in exhaustion, reaching out with his senses one time before passing out, smiling as he feels the channeled chi suffused around him."
 flavor_butuguzi.8.a:0 "I cannot believe it actually woked"

 flavor_butuguzi.9.t:0 "Brewing Beneath Waves"
 flavor_butuguzi.9.d:0 "Something was brewing beneath the waves of the Kedwali gulf. With the collapse of Baashidi power in the region came the collapse of the traditional surface trade routes of the merfolk kingdoms. Distrustful of the conquering Dakinshi, the trade was slow to resume, and occurred largely through local Baashidi middlemen who had no issues collaborating with the Seventeen. The most dominant force in this business proved to be the Moyo family, who quickly grew from a middling merchant family with solid ties to several merfolk merchant families, to holding a stranglehold on surface to undersea trade in Bwa Dakinshi.\n\nWith this monopoly their wealth has grown rapidly, though they have quick to reinvest it in new ventures, such as contracting merfolk for guiding ships through reefs, harvesting rare reagents from the deeper waters, employing merfolk help in expanding harbors in both Djinakkah and Bamaliwuni, and even funding the development of technology to facilitate the undersea brewing of coffee via a clever series of sealed copper vessels. That last one especially has endeared them to families such as the Urunekozi and the Yi, who appreciate the expanded coffee markets. Now they wish to use this goodwill to join the ranks of the Seventeen."
 flavor_butuguzi.9.a:0 "Of course we will welcome the Moyo family to the fold!"
 flavor_butuguzi.9.b:0 "They should focus on expanding their core business first"

 flavor_butuguzi.10.t:0 "Kneecappers"
 flavor_butuguzi.10.d:0 "The pen trembled badly enough that Rakoto Homeseeker had to sign twice, scratching out his first attempt. Across the desk, three halflings waited in silence, one seated, the other two flanking him on either side, each a wall of muscle and menace, with clothing bearing an embroidered emblem of a beetle between a pair of jaws. The heavy clubs in the hands of the two bruisers were far less fashionable.\n\nRakoto looked once more at the contract. It transferred his clove plantation, its warehouses, and all existing partnerships to the Beetlebiter family. In return, he would receive a sum that might have been fair 5 years ago, before the coffee merchants sent cloves demand soaring.\n\n“There,” he spat, pushing the paper away. “Now get out of my house.”\n\nThe eldest of the visitors inspected the signature and smiled, a gruesome image on his heavily scarred face. “A wise decision my friend. Plantations are difficult things to manage alone, and I would have hated to see such a prosperous little plot brought low by any unfortunate accidents, one hears such terrible stories.” One of the goons let out a low chuckle at that.\n\nThe three gathered the contract and left, tossing out a few more menacing comments as they went and leaving a small purse in the contract's place. Only once the door had slammed shut did Rakoto release the breath he had been holding in.\n\nThe Beetlebiters had once confined themselves to dockside gambling, protection payments, and taphouses. But ever since the Dakinshi had arrived and brought the coffee trade, they had not stopped expanding. Now they owned almost half of the clove plantations on the island, and were buying up more every week, just as they had done to him. Worse still, rumors claim they intend to leverage their wealth into a petition for a seat among the seventeen families that now rule them."
 flavor_butuguzi.10.a:0 "Their petition was one the Seventeen couldn’t refuse."
 flavor_butuguzi.10.b:0 "The Beetlebiter bid was rejected for their inexperience."

 flavor_butuguzi.11.t:0 "Hawking our Wares"
 flavor_butuguzi.11.d:0 "Ms. Lee was furious. Merchant after merchant had dared to laugh at her when she named her price for the coffee beans she had come to Cannor to sell. The last one had offered less than half of what they were worth as a counter offer, and it was all she could do to not spit in his face for the insult, storming out with her retinue in tow. By now she was on the fourth, and her anger was breaking through the carefully cultivated mask she wore while negotiating. She wished nothing more to be away from this accursed land, and return to her wives and husbands in Fuhoengwaan.\n\nNoticing the slip, the merchant (a much more agreeable one than the rest, it must be said) took a moment to talk with her, explaining that coffee was abundant in Aelentir, and colonial plantations exported more every year. When asked how they could possible grow them at such low prices, the man grinned avariciously, and spoke of how the green slave trade gave them incredibly cheap labor. A stark difference to the highly skilled and well respected laborers employed by the Seventeen.\n\nShe bought one sack of these Aelentiri “Jay-Beans” at a pittance. Upon examinations the beans were not particularly high quality, and had clearly been dried quite amateurishly. But that price. That price was a disaster in the making. If Cannorian could produce coffee for themselves at such a low price it would only be a matter of time before they started exporting along the same trade lanes she had just opened, becoming a competitor the Seventeen are ill prepared to face."
 flavor_butuguzi.11.a:0 "Bitter news indeed."

 flavor_butuguzi.12.t:0 "Foolish Investments"
 flavor_butuguzi.12.d:0 "The end is nigh!\n\nAt least, that was the conclusion reached by every coffee merchant in Fuhoengwaan.\n\nThe new trade lanes to Cannor had promised distant markets, wealthy buyers, and profits large enough to make even the Lee family envious. Instead, they revealed that Cannorian colonies in Aelentir were producing coffee in quantities few in Butuguzi had imagined possible. Their beans were inferior, merchants insisted, but they were abundant, cheap, and increasingly present in markets once dominated by Dakinshi plantations.\n\nThe Goeng family suffered the worst. Their estates around the Bustebe Dajadera monastery had long been buoyed by reputation and tradition, and were rapidly finding that neither held much water anymore. The Urunekozi fared little better - magically tended coffee remained excellent, but had an inherent inefficiency that could not compete with the sheer output of Aelentir. Both families now teetered on the edge of bankruptcy. The Gaa and Mugisha families, smaller coffee families that had made their reputation through heavy investment in chi infusion, and specialty cultivars respectively, both weathered the crisis better than most and were now circling the wounded families like sharks, hoping to ascend to the Seventeen.\n\nBoth families now stood on the brink of bankruptcy. Creditors circled their estates, their workers went unpaid, and whispers spread that they might soon lose their seats among the Seventeen."
 flavor_butuguzi.12.a:0 "They should have had a more competitive product"
 flavor_butuguzi.12.b:0 "We should bail out the Urunekozi Family"
 flavor_butuguzi.12.c:0 "We should bail out the Goeng Family"
 flavor_butuguzi.12.e:0 "Such upstarts can't be allowed on the hallowed seats of the Seventeen"

 flavor_butuguzi.13.t:0 "An Endless Meeting"
 flavor_butuguzi.13.d:0 "The cart rattles as it is pushed out of the room, piled high with a graveyard of coffee-stained porcelain. It is the fourth such cart of the meeting and certainly the cleanest, which was an improvement! Given the state of the economy, the cost of importing more fine porcelain from Haless to replace all numerous cups thrown in anger would be a nasty red mark on the budget.\n\nThe Council of Seventeen had gathered to discuss the topic they had been avoiding for decades at this point - political reform. The recent shocks to the coffee market had exposed vulnerabilities in the Seventeen’s somewhat informal system governance. Governance and responsibilities being defined through a series of ill-defined treaties and agreements that no one had a complete record of had worked well enough in the past, but it was now clear that change was needed - but in true Butuguzan fashion no one agreed one what change should look like, and they had done what the families did best: immediately fracture and start arguing for hours on end.\n\nMany hours and a truly monstrous amount of consumed coffee later, the families were no closer to a decision, but two major factions had emerged from the melee. The first faction took the stance that the Seventeen Families are the bedrock of the nation, and should entrench their position and power, building a codified political structure around them. The other, more radical faction rejects this on the premise that doing so will bridle the families and make them no better than the stagnant nobility of so many other states. Instead they should lean into their strengths and embrace the dynamism of their current system letting them compete and adapt without such shackles of a “real government” or “legal system.”"
 flavor_butuguzi.13.a:0 "Embrace the Chaos"
 flavor_butuguzi.13.b:0 "The Families above all"

 flavor_butuguzi.14.t:0 "Can I take your order?"
 flavor_butuguzi.14.d:0 "Druz Kaza stands at the back of his coffee house in Anbenncóst and watches his fellow kobolds move with the discipline and precision of an artillery crew. Each has their own tasks, from grinding beans (he had purchased a delightful little invention from a visiting gnome to help with that), to tending the boiling copper pots, to straining and preparing the final drink, and of course taking the orders of their valued customers. \n\nBeyond the counter the shop is packed. He had only opened a month ago, and already it had become a go-to location for the intellectuals of Anbenncóst. In the corner a tired looking group of adventurers nurse their drinks (Largest size, highest coffee content, black) while arguing over a map. A velvet-bedecked merchant enjoys his decadent morning brew (Coffee flavored with cinnamon, nutmeg, ginger, and cloves) while pouring over a contract. Two elven mages, one Magesitirial (Medium sized latte, extra cream) the other Kheionai (Brought his own tea, will be banned if it happens again) talk excitedly about magical theory.\n\nDruz Kaza allows himself a small smile at the sight. This right here was opportunity. Free from the rigid boundaries Dakinshi society had put around his people, he had become an entrepreneur, free to carve his own path. None of it would have been possible without the Sanddollar Star Coffee Company. They had approached him about the opportunity, offering to fund him in exchange for a cut of the ownership just as they had done for hundreds of ambitious kobolds just like him, bearing an envelope marked with an image of silver tooth, the signature of his anonymous benefactors."
 flavor_butuguzi.14.a:0 "One coffee house at a time, Cannor will buy our beans"

 flavor_butuguzi.15.t:0 "Cover of Night"
 flavor_butuguzi.15.d:0 "[Root.cover_of_night_event_loc]"
 flavor_butuguzi.15.a:0 "Costly but worth it, Bulwari exports can no longer threaten us."

 flavor_butuguzi.16.t:0 "Dakinshi COffee Attacks"
 flavor_butuguzi.16.d:0 "The dastardly Dakinshi have launched an unprovoked attack against our coffee industry, burning the fields and salting the earth. The people demand a response, and many argue we should attack immediately and force them to restore our coffee fields at swordpoint. On the other hand, do we really want to fight a power like Bwa Dakinshi?"
 flavor_butuguzi.16.a:0 "Of course, to war!"
 flavor_butuguzi.16.b:0 "This requires caution"

 flavor_butuguzi.17.t:0 "Family Ties"
 flavor_butuguzi.17.d:0 "Our friends and family in Bwa Dakinshi have reached out to us, hoping that we may draw even closer together in an effort to improve both of our prosperity. While this doubtless comes with many benefits, some argue that it would be better for us to keep our cousins at arms length."
 flavor_butuguzi.17.a:0 "Of course we should pursue closer ties!"
 flavor_butuguzi.17.b:0 "The current situation suits us just fine!"

 flavor_butuguzi.18.t:0 "The Calm"
 flavor_butuguzi.18.d:0 "“Look upon it,” croaked the hermit, thrusting a bony finger across the bay. “Look upon their shining arrogance, those fools who think to know a god!”\n\nAcross the moonlit water of the bay stands a great stone beacon, towering above the surrounding island, its crown aflame with an eerie glow that drenches the sky in sickly blue light, that seems to writhe with a mind of its own as it drifts away with the clouds and wind.\n\n“They think themselves so clever, with their schedules and timetables, they see the power of the monsoon and ask themselves how to measure it better. They hear Hujan’s divine thunder, taste the sweet nectar of his chi blessed rain, and demand it adhere to a schedule. They have the gall to build beacons to guide it! A god will not abide by the whims of mortals, oh no indeed...”\n\nHe shuffles forward into the surf, robes damp with salt and sea spray, eyes fixed on the tower's glow, and arms spread wide rapturously.\n\n“They will see that Hujan is not some obedient oxen to be yoked. They will feel his wrath, for he is wrathful, they will know his anger, for it is boundless.” The hermit turns at last to his audience, spitting out the final words with fervor. “The storm is coming, and let it not be said that you were not warned.”"
 flavor_butuguzi.18.a:0 "Surely he is a delusion madman, and can be safely ignored"

 flavor_butuguzi.19.t:0 "The Storm"
 flavor_butuguzi.19.d:0 "In hindsight, the silence should have been taken as a warning. Over the course of an hour, the background noises of Fuhoengwaan fell quiet - the gulls ceased their screeching, the waves died down until the sea was almost a mirror, even the people of the city seemed to fall quiet, as though they could sense what was coming. Then Hujan made landfall and everything turned to chaos.\n\nThe wind tore roofs from houses and uprooted trees, flinging them around the city as though they were little more than matchsticks. The streets filled with churning black water as the storm surge rushed up from the coast, spilling out of the canals and ponds. Ships turned into kindling the harbor as they crashed into their moorings. The world itself seemed to contort from the Great Spirits presence, the Chi flowing through the waterways and the land shifting violently as though something vast and unseen was buckling in strain.\n\nSixteen of the Seventeen Families found themselves trying to evacuate, loading carts and fleeing without any semblance of organization, many being swiftly lost to the devastation of the storm. Many of those who survived took to following their kobold servants, who set off with an actual plan for escaping the city, grouping up at rendezvous points from which they fled the city.\n\nThe Lee family was lost to the storm, their oceanside compound had been the site of a family meeting and was swallowed by the waves almost immediately, but at least some members of the other families managed to escape inland."
 flavor_butuguzi.19.a:0 "At least he is bringing plenty of chi?"

 flavor_butuguzi.20.t:0 "Godfall"
 flavor_butuguzi.20.d:0 "Kai Yu cried out in pain as he slammed into the mast, the pine arresting his fall before the rope tied around his waist could do the same. He crashed back to the deck as the ship righted itself, scrambling for purchase on the rain-slick planks. Through the torrential rain he could see Captain Lei shouting orders, futilely trying to be heard over the storm and the screams of her dying crew. Finally finding his feet, he stumbled back over to the line he had been untying.\n\nLighting crashes through the darkness of the storm, illuminating the carnage around Kai Yu’s ship for a brief moment. The sea is red with blood and filled with the shattered bones of ships and men. Above them is the storm, Hujan himself, is malevolent and unending, every boom of thunder echoing with his voice and drowning out both cannonfire of the surviving ships and the ever present screams of the dying.\n\nThe world goes dark again for a moment, and Kai Yu refocuses himself on freeing the line before their sails cause them to be dragged. The biting cold and pain in his back sapped at his strength, and he would have fallen by now if not for the chi that Hujan had brought with him. Not even in haless had he felt it so rich before, so he steels himself and focuses on his breathing, cycling the chi through his battered body to maintain his strength.\n\nThen a great song rings out and the sea surges as Cinulau, in the form of a Dreadnought whale, bursts from the sea and into the heart of Hujan’s storm. The surges reaches his ship and suddenly Kai Yu is underwater.\n\nThe world is naught but flashes from this point on, brief glimpses of a titanic struggle as he fights futilely to stay above water. In brief flashes, he sees waves the size of towers. Cinulau farther out of the water than any whale should be. A clawed hand made of stormclouds and lightning grasping an immense tail. And last of all a jagged rock, looming out of depths."
 flavor_butuguzi.20.a:0 "Soon after the sky clears and Hujan retreats, never to return"

 flavor_butuguzi.21.t:0 "The Second Return"
 flavor_butuguzi.21.d:0 "For a second time the Seventeen Families were pushed out of Fuhoengwaan. This time not due to bandits and warlords but instead by a great spirit, near enough to a god that many worship him, even within our own lands. When he first began his rampage across Bamaliwuni many deemed it to be the end of the Seventeen and the end of Bwa Dakinshi as whole, even predicting the dawn of a new age of warlords. But it was not to be. Every resource, every soldier, every ship we have built played a role and the losses were immense, but we drove out Hujan, and now return triumphant to Fuhoengwaan for the second time. There are numerous problems to be solved. The city, and much of the country is devastated, and rebuilding the army and navy will be expensive. But all those are surmountable problems. If we can beat a god, there is nothing the Seventeen families cannot achieve."
 flavor_butuguzi.21.a:0 "We stand victorious, no matter the foe"

 flavor_butuguzi.23.t:0 "World's Biggest Cup of Coffee"
 flavor_butuguzi.23.d:0 "No one wished to invite a guest as distinguished as the Dragon Turtle Maruvarax, to a formal meeting and then serve them coffee out of something as crude as a barrel. That would be rude. So the Kot family has taken on the truly extravagant cost of commissioning two immense porcelain vessels, each painted intricately by the finest artists of the Ringlet Sea, and transporting them with extreme care through the treacherous waters of the stormwall.\n\nNow both vessels sat nestled in the sand, looking truly out of place on the small island. But it worked. It might have required two dedicated mages to maintain the heat in each cup, and the usage of a truly impractical copper vat to brew the coffee, but it had worked. Mrs. Kot was at a negotiation with the representatives of the people of the Sunlight Reef, and all of them were able to drink coffee, as was Antmvuran tradition. Even Maruvarax and Cinulau.\n\nAs the meeting began in earnest, Maruvarax and Cinulau broke off into their own conversation of times long past, while Mrs. Kot began the negotiations with the local dignitaries in earnest. They were less than pleased with the Dakinshi’s forceful entry into the region, but any resistance had crumbled against the combined prowess of the Monks of the Ancestral Wisdom and the Dakinshi Navy. No treaty to come out of this discussion would be anything approaching equal, but the Insyaans put up a lively argument, pulling out a string of local legal precedents and traditions, supported by the flawless memory of the attending dragon turtle.\n\nEventually an agreement is hammered out, defining the tolls and economic privileges Bwa Dakinshi would now hold over the western Sunlight Reef, with exemptions carved out for the local priesthood and any traveling dragon turtles. After a brief explanation of the custom to the locals, the beans are cast and the agreement is ratified."
 flavor_butuguzi.23.a:0 "Another market secured"

 flavor_butuguzi.24.t:0 "A Most Generous Offer"
 flavor_butuguzi.24.d:0 "Our allies in Bwa Dakinshi have approached us with an interesting offer. They are offering increased military support and several very large loans to help us rebuild and recover from the rending. In return they ask for repayment with interest, a representative of the Seventeen to act as an advisor to the King, and for us to sign a strange document stating that Butuguzi had no involvement with the start of the rending."
 flavor_butuguzi.24.a:0 "This is a good deal"
 flavor_butuguzi.24.b:0 "Are they crazy? No?"

 flavor_butuguzi.25.t:0 "The Perfect Brew"
 flavor_butuguzi.25.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] let the sound of the arguments wash over her as she went through the motions of preparing her coffee. The beans had been roasted earlier than morning by one of her stable of mechanim, each one heated to the precise level of perfection that she demanded and the automatons provided. Next she ground the beans and the eggshells, somewhat pedestrian but she had found that the cranking of the mill was meditative in its own way.\n\nAdding the beans to the already boiling water, she turned her attention back to the courtyard. The meeting had not yet started, but the families were never ones to let a moment go to waste and had begun the introductory squabbling already. At this point it was more ritual than anything. Though still rivals, at this point it had become clear that cooperation had ascended the Seventeen to their current heights, overcoming every challenge from the Cannorian trade wars to the quelling of Hujan.\n\nA tap on her shoulder broke her from her musings, and she turned to the blank faced mechanim gesturing towards her coffee pot to indicate it was ready. Removing it from the stove, the grounds were already settled thanks to the eggshell additive, leaving it ready to be poured through the imported gnomish strainer. A quick addition of milk, sugar, and her preferred blend of spices and it was ready. [Root.Monarch.GetName] made her way over to her sit, signalling that the time had come to start the meeting, and took a sip with a smile. The coffee was, of course, perfect."
 flavor_butuguzi.25.a:0 "Just as everything should be"

 flavor_butuguzi.26.t:0 "Pearl Coup"
 flavor_butuguzi.26.d:0 "A large harimari dressed in robes adorned with hundreds of pearls has arrived in Fuhoengwaan and presented himself before the seventeen, informing them that his family, the very wealthy Pearl Moon family has taken control of the island city of Van, casting down the local monarchs and entrenching themselves as the preeminent merchant family in the city.\n\nWith this rapid and bloodsoaked ascension, they now wish to join the ranks of the Seventeen, specifically seeking to replace the Mou family. For decades the Mou family has held a monopoly of domestic silk production, but with the reinvigoration of trade with Haless, their fortune is being eaten away by foreign imports. Now the council must deliberate on if they wish to see these formerly foreign merchants join their ranks."
 flavor_butuguzi.26.a:0 "They will fit right in."
 flavor_butuguzi.26.b:0 "The Mou family are a respected part of this council."

 flavor_butuguzi.27.t:0 "We Need a Plan"
 flavor_butuguzi.27.d:0 "For the second time in their history, the Seventeen Families met outside of Fuhoengwaan. Gathered inside one of the Umulisa’s plantations they sat on a chaotic assortment of hastily scavenged chairs, nursing cups of coffee in an attempt to ward off the howling winds and torrential rain outside.\n\nAll looked pensive and uncertain, with the exception of Kiu Dorma, matriarch of the newly elevated Silver Tooth family, who sat with an unbothered smile on her gold-scaled face. With the Lee family lost, she had leveraged the fact that Kobolds of her family had played a role in saving many members of the Seventeen (and her impressive wealth from owning the Sanddollar Star Coffee Company, in addition to half a hundred smaller coffee houses) to have the council elect them to replace the Lee family in a hasty but unanimous decision.\n\nOnce everyone had finished their drinks, the actual discussion began focusing, of course, on the current crisis. Hujan’s rampage had not relented, and all of Bamaliwuni had been enveloped in by the wrathful monsoon. The somber mood was a stark difference from the distinctly loud affair of most meetings of the families. As they discussed, three main proposals emerged. The first, was that the families must ready their might, marshalling troops and ships to face Hujan head on. The second sought to draw on the Haless’s greater knowledge about spirits, hiring experts and having them advise. The third, put forth by the Gataw sa Sinwauk family proposed a more radical solution - that to fight a great spirit, one must have another great spirit on your side. As such they proposed that Cinulau, a great spirit in the ringlet isles, might be recruited.\n\nAll three solutions came with a plethora of risks, so in the end the Seventeen decided to pursue all of them, in order to maximize any chance of success."
 flavor_butuguzi.27.a:0 "Let’s hope at least one of them works."

 flavor_butuguzi.28.t:0 "Fate of Zyujyut"
 flavor_butuguzi.28.d:0 "After several grueling campaigns, the lands of our Naamjyut ancestors have been reclaimed by our soldiers. We have longed considered ourselves the children of Cuihiok, so seeing Antmuvuran soldiers, sailors, and administrators walking the streets of the city has been a surreal experience, highlighting the many things we have retained from this culture. Both our customs trend towards the sophisticated and intricate, creating a shared understanding between the upper echelons of both societies, and our court cultures in particular have meshed almost seamlessly. On the other hand there has also been much friction, with our very individualistic and down to earth soldiery coming into frequent conflict with the local populace. This has led some members of the Seventeen to propose returning the lands to Zyujyut and allowing them to rule these far from home Yan territories in our stead."
 flavor_butuguzi.28.a:0 "It would be better to maintain direct administration."
 flavor_butuguzi.28.b:0 "A splendid idea, let them administer themselves!"

 flavor_butuguzi.700.t:0 "Coffee Chat Election"
 flavor_butuguzi.700.d:0 "The Seventeen families have reconvened, and the time has come for an election. If [Root.Monarch.GetName] can gather enough supporters from the other 16 families, [Root.Monarch.GetSheHe] will be able to maintain leadership. However, no election is a foregone conclusion, and other families have brought forth their candidates."
 flavor_butuguzi.700.a:0 "Keep $MONARCH$"
 flavor_butuguzi.700.b:0 "A bureaucrat candidate from the [ROOT.generate_admin_candidate_custom_loc] family"
 flavor_butuguzi.700.c:0 "A diplomat candidate from the [ROOT.generate_dip_candidate_custom_loc] family"
