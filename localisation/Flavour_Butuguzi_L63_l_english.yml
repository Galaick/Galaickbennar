 desc_L63_way_of_ancestral_wisdom_novice:0 "The Way of Ancestral Wisdom is a fusion of Dakinshi and Yan heritage. A style designed for the shapeshifters who train diligently in the Bustebe Dajadera, it emphasizes self control and using the unique power and flexibility of shifting to ones advantage."
