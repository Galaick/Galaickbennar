 desc_L63_way_of_ancestral_wisdom_empowered:0 "The Way of Ancestral Wisdom is a fusion of Dakinshi and Yan heritage. A style designed for the shapeshifters who train diligently across Bamaliwuni, it emphasizes self control and incorporates styles from many Halessi martial schools, designed to maximize the potential of each monk’s soul animal."
 L63_way_of_ancestral_wisdom_enlightened:0 "Way of Ancestral Wisdom §T(Enlightened)§!"
 desc_L63_way_of_ancestral_wisdom_enlightened:0 "The Way of Ancestral Wisdom is a fusion of Dakinshi and Yan heritage. A style designed for the shapeshifters who train diligently across Bamaliwuni, and taught by those who survived the battle against Hujan,  it emphasizes extreme self discipline and incorporates styles from many Halessi martial schools, designed to maximize the potential of each monk’s soul animal."
