l_english:
 l63_secure_the_flanks_title:0 "Secure the Flanks"
 l63_secure_the_flanks_desc:0 "Now that we have secured our dominance over Bamaliwuni, it is time to restore the land to its long lost prosperity. But to do that, the land must be guarded. Its peace is a fragile thing in need of careful shepherding, and that cannot be done without securing our borders. While the mountain pass to the Mengi can be largely ignored, incursions from the north and south were a consistent feature of the warlord period, be it from the lizards of Katidariga or the brutal Mengi of Lipmekat. The last frontier that threatens our people is the sea, from which Baashidi slave traders emerge with their merfolk allies to take our people for chattel. Our own Baashidi families, the Kagona and Tembo have begun working to open lines of dialogue with the merfolk, hoping to find allies who can act as a counterweight against them."

 l63_spit_on_the_sunchasers_title:0 "Quash the Quwaasiyo"
 l63_spit_on_the_sunchasers_desc:0 "The Baashidi of Gawakhiza must be the most arrogant fools that sail the Ringlet Sea. They sit aloof in their fancy boats and act like they are better than the rest, deigning to take our people as slaves and acting as though we should thank them for the honor. No more.\n\nThe time has come to break their dominance on the Kedwali Gulf, and teach them that it is the Dakinshi, not the Baashidi, who rule the seas of Sarhal. Their peninsula will be seized and transformed into a frontier of our commerce. The Kagona family in particular are excited to enact their revenge on the haughty royals who exiled them."

 l63_biggest_little_market_title:0 "Biggest Little Market"
 l63_biggest_little_market_desc:0 "CLOVES!\n\nThese halfling inhabited islands have introduced us to cloves and their value is beyond compare. And other spices besides! Their introduction into our market has started a new craze for spiced coffee, cinnamon, nutmeg, cloves, together and separate in a thousand different combinations and ratios, it is a bonafide revolution of flavor. The Seventeen cannot get enough of the stuff, importing it by the shipload. Clove plantations are expanding at a rapid pace across the island to meet the demand, and those in the business are getting very wealthy, very quickly..."

 l63_strangle_the_gulf_title:0 "Strangle the Gulf"
 l63_strangle_the_gulf_desc:0 "[Root.strangle_the_gulf_custom_loc]"

 strangle_the_gulf_custom_loc_before:0 "With our booming new Cannorian market, our coffee production has expanded massively to compensate, new plantations are opening across the country to meet this new demand. However in their eagerness they have slightly overcompensated, and we are now producing more coffee than our current markets can absorb. In order to prevent this overproduction from creating a systemic risk, a new outlet for sales must be found.\n\nRahen is the obvious choice, as we already have an established presence in the region, especially thanks to former vandiphan merchant companies that were absorbed alongside the island. Our penetration has never been deep, making it ideal for expansion."
 strangle_the_gulf_custom_loc_after:0 "The preemptive expansion of coffee production to account for new Cannorian sales has proved a disaster. Instead of opening new markets for our merchants, Cannorian traders have turned the table on us and are now encroaching on our turf with cheap Aelentiri coffee. While far flung markets like Yanshen and Vimadtrong are safe, anything past Ardimya is now heavily contested, necessitating we find a new relief valve before more of the Seventeen go bankrupt.\n\nThe answer has been found by a coalition of families spearheaded by the Zong: Rahen. While we have always had a steady presence in the region, the time has come to seize new ports along the gulf and secure another market fully isolated from meddling Cannorians."

 l63_burnt_beans_title:0 "Burnt Beans"
 l63_burnt_beans_desc:0 "[Root.burnt_beans_custom_loc]"

 burnt_beans_custom_loc_before:0 "Our new Raheni markets have been extremely profitable, but have introduced a new factor into the equation: competition. The rapidly spiking demand for coffee in the region has caught the attention of Bulwari coffee growers, and their high quality beans are becoming increasingly popular amount the wealthy members of the upper castes. This is an unacceptable state of things, we must make it clear to the Bulwair that their interference will not be tolerated. A military demonstration in the Salahad bay and some more subtle pressure should convince them to focus on internal affairs instead of disturbing our hegemony."
 burnt_beans_custom_loc_after:0 "Our blood is in the water and the rats are emerging from the floorboards. Before the current crisis, the charlatan purveyors of Bulwari “coffee” would not dare infringe on our markets. But, being the cowards they are, they have pounced in our moment of weakness, threatening our growing market in Rahen with their “high quality” beans. The fact that the Raheni are falling for such blatant lies is truly embarrassing.\n\nIf we are to sufficiently cow them and dissuade any future perfidious meddling, a definitive statement must be made. A mixed expeditionary force of soldiers and mages has been assembled, with the objective of entering Bulwar and wreaking permanent havoc on their plantations."

 l63_godfall_veterans_title:0 "Godfall Veterans"
 l63_godfall_veterans_desc:0 "We were ants among titans, an uncaring clash that slaughtered us by the dozens. Neither Storm nor Whale cared as they clashed, our contributions minimal in the end as we struggled against Hujan’s ephemeral form.\n\nBut those who survived, learned, finding a glimpse of enlightenment in the chaos. An enlightenment wrought from discipline and practice, working hand in paw with one’s soul animal until both are forged into an unbreakable warrior.\n\nNow the time has come to pass this on to the next generation, that they may learn from our struggle. That they may avoid such senseless slaughter. That it all was worth something in the end."

 L63_call_in_our_markers_title:0 "Call in our Markers"
 L63_call_in_our_markers_desc:0 "The Seventeen Families of Butuguzi have long been players in the trade lanes of the Ringlet Sea, and it is impossible to be in such a business for any substantial length of time without accumulating a plethora of debts and IOUs. Such markers are typically hoarded in ledgers and saved for use in securing a major deal, the debtors reminded just frequently enough to ensure it is not forgotten.\n\nNow Butuguzi is in crisis, its capital taken and the families scattered, so the time has come to call in these markers. Across the Ringlet Sea traders, captains, and mercenaries will all receive messages requesting their services in exchange for the forgiving of their debts."

 l63_appeal_to_greed_title:0 "Appeal to Greed"
 l63_appeal_to_greed_desc:0 "Inshibonde, Kuvunika, and Kaziradoka. The three other cities of Bamaliwuni. Unlike resplendent Fuhoengwaan, they are not true hubs of commerce and life, instead being mere fortresses in which local warlords squat.\n\nAs pitiful as they are, these fortified cities will prove difficult obstacles for our army, which is largely inexperienced with the mechanics of siege warfare. Fortunately, we are very experienced with the mechanics of human nature, and there are two constants that can always be relied upon - greed and self interest. And city garrisons can be motivated by both."

 l63_settling_the_isles_title:0 "Settling the Isles"
 l63_settling_the_isles_desc:0 "The Ringlet Isles are the crux of trade between Haless and Sarhal. Rahen, Bulwar, Yanshen, Djinnakah, Bamaliwuni - trade from all of these regions flows through or around the isles, the constant threat of the stormwall preventing them from being bypassed in the east.\n\nUnfortunately control of these strategically vital islands had been left to the Gataw tribes and the pirates of Pinghoi. Now that the pirates are esteemed members of the Butuguzan merchant marine, we have incorporated their strongholds and made their longstanding assistance official. This leaves only the Gataw. Fortunately we have always had a positive relationship with them, or more specifically the sa Sinuwak family does, taking advantage of their local origins. Or at least, a positive relationship with their extended family there. Mostly. As long as they exclude some of the more belligerent branches."

 l63_djinnakah_bejeweled_title:0 "Djinnakah, Bejeweled"
 l63_djinnakah_bejeweled_desc:0 "To conquer the Baashidi is folly, their lands are populous and belligerent, rooting out resistance from the hills and mountains would be an endless nightmare, subduing Gawakhiza’s lands were difficult enough even with the Kagona family able to organize local collaborators. Pacifying the highlands of Beeraga would be a hundred times worse. It just simply is not worth the cost. So instead we will secure the port cities, and thus all trade to and from the region, all without the headaches of conquest! Securing natural harbors in Ardimya will also help support our fleets in rounding the cape, simplifying trade to the western harbors and even beyond."

 l63_cannorian_customers_title:0 "Cannorian Customers"
 l63_cannorian_customers_desc:0 "As our ships have pushed ever further past Fahvanosy, we have encountered traders from what might be our biggest market yet - Cannor. They speak of grand ports that outsize those of southern Sarhal, from the great port of Deranne to the bustling metropolis of Anbenncost. It is a place of wealth, opportunity, and hopefully customers. Once we introduce coffee, they will surely be hooked like those in all of our other markets. After all, who can resist the delicious dark elixir that we offer?\n\nAfter negotiating for some maps from a trader hailing from the land of “Busilar” we have prepared a trade fleet loaded with tons of the finest coffee we produce. All the better to make a positive first impression with."

 l63_ecu_kiyaga_title:0 "Ecu Kiyaga"
 l63_ecu_kiyaga_desc:0 "[Root.ecu_kiyaga_custom_loc]"

 ecu_kiyaga_custom_loc_before:0 "Bwa Dakinshi is ascendant, our grip on the Ringlet sea and its environs absolute. Within the coffee houses and in the halls of the Seventeen, some have even begun referring to it as Ecu Kiyaga, or Our Sea. For how could it be anything else? Its ports are ours to control, and any trade flow flowing through it is either ours, or kowtows to our rules, lest our navy turn them away. Truly, this is the start of the Dakinshi Century."
 ecu_kiyaga_custom_loc_after:0 "Bwa Dakinshi has emerged victorious and tempered from the tribulations of recent years. Any threat from meddling cannorian coffee wholesalers has been overturned, the Ringlet Sea and its environs having been secured within an unshakeable fist of bronze.\n\nNo cannorian ship may pass beyond the cape of Ardimya without the explicit permission of the Seventeen, lest our navy seize their cargo as recompense for the transgression. Many have even begun referring to it as Ecu Kiyaga, or Our Sea. For how could it be anything else? The tribulations have passed and we are ascendent. Never again will our bottom line be threatened again. Truly, this is the start of the Dakinshi Century."

 l63_finding_a_champion_title:0 "Finding a Champion"
 l63_finding_a_champion_desc:0 "We messed up.\n\nBy the Three Great Beasts did we ever mess up.\n\nA giant sentient monsoon is rampaging across Bamaliwuni and we have no way to stop him. How does one fight a great spirit? This is not a simple foe we can just send an army against.\n\nOur hope lies in the plan put forth by the sa Sinwauk family - to recruit another Great Spirit, Cinulau, the dreadnought whale of the ringlet isles, to help defeat Hujan. They have sent an ambassador to Cinulau, promising lavish concessions including complete dominion over the ringlet isles in exchange for his cooperation. Hopefully we are not trading one problem for another."

 l63_carving_channels_title:0 "Carving Channels"
 l63_carving_channels_desc:0 "“It’s really not the same I guess. Sure the work is easier, the tide comes in regularly and we don’t have to spend months on call waiting for the scout sloops to send the signal that the storm is coming, but some of the romance is gone, you know? There was something powerful about standing out in the storm, putting your life on the line to face down the storm. Feeling the rain, chi, and wind all buffeting you at once as you try to keep your feet steady in the mud was difficult of course, but it was thrilling and rewarding. Now the canals do all the work for us. Cinulau swims up to the coast and pushes the waves our way, all we have to do is be ready to help guide it down the necessary branches and channel it from the water to the earth.”\n\n“Sure we can extract twice the amount of chi from the tides as we could from the storm, but I did not volunteer for this job because I wanted an easy job. I guess that is just the way of things in these times” - Ka Garuka Lung, Senior Chi Channeler"

 l63_precursor_efficencey_title:0 "Precursor Efficiency"
 l63_precursor_efficencey_desc:0 "Exploration of the gene pillars of Insyaa has given our researchers much to salivate over. While we cannot claim the same familiarity with precursor constructions that the bright fellows of the Gommo might have, our understanding of chi channeling and chi related constructions has given us a leg up in unraveling the secrets of the Spirit pillar.\n\nWhile we have known of the ability for damestear to help awaken environmental chi and improve chi conduction and channeling for many years, actual implementation of this knowledge into our processes has been limited. However the reverse engineering of technology from the spirit pillar has bypassed this issue entirely, and plans for integration of damestear-based conductors into the bumbadada are already underway."

 l63_take_it_back_title:0 "Take it Back!"
 l63_take_it_back_desc:0 "Ah Fuheongwaan, the beating heart of our nation. The other cities of Bamaliwuni have been left to decay, their Bumbadada failing and un-maintained, now more fortifications instead of true centers of commerce and urban life. Without Fuhoengwaan there would be no Butuguzi as it exists today, just a series of coffee plantations subject to the whims of the newest warlord.\n\nSo WHY then, might I ask, is Fuhoengwaan under the control of those damn BANDITS from Gumti? And you all are just SITTING here, sipping coffee like dumbstruck TCHOKEN? Finish the cup, put on your armor, AND GO GET READY TO TAKE IT BACK ALREADY!\n\n-  Impromptu speech delivered by Chairmistress Ka Gunam Zong to Butuguzi’s officer corps"

 l63_nessecary_repairs_title:0 "Nessecary Repairs"
 l63_nessecary_repairs_desc:0 "Our precious city is scarred, harmed so tragically by the bandits of Gumti who dared to defile her serenity. It is a tragedy beyond reason, a horror beyond sense! So work, people of Butuguzi! Work to rebuild our home! Raise the stones of coral rag and lift the great timbers! The mages and druids of the families are at your side! Together we will build it back better and grander than before!"

 l63_back_in_buisness_title:0 "Back in Business"
 l63_back_in_buisness_desc:0 "A new day has dawned across Bamaliwuni! For the first time in centuries Bwa Dakinshi is reunified and there is peace in the countryside, small time wannabe warlords not withstanding, but our own forces can deal with those cleanly as they appear, the legacy of warlordism will take some time to fade after all.\n\nFor now work crews with attached druids roam the country, working to repair the ravaged infrastructure of the region. The coast of Bwa Dakinshi was once covered in a vast network of canals, dykes, ponds, and cultivated swamps known as the bumbadada which served to regulate rainfall from incoming monsoons, but it has long fallen into disrepair everywhere besides Butuguzi. Now, for the first time in living memory, the bumbadada are returning to life across the land, the first step in a new age of growth and prosperity."

 l63_coffee_bloom_title:0 "Coffee Bloom"
 l63_coffee_bloom_desc:0 "With the warlord era ended, the time has come for Bamaliwuni to rebuild its strength, and most important to the Seventeen families is of course the coffee industry. Across the nation work crews spend their days repairing ruined canals and clearing fallow fields. With hard work and a substantial investment of capital, soon coffee bushes will be blooming across every inch of our nation. And not long after that, they will be filling our roasteries and cargo holds on their way to generate a very healthy return on investment."

 l63_the_ringlet_council_title:0 "The Ringlet Council"
 l63_the_ringlet_council_desc:0 "Honored Business Partner,\n\nThe Seventeen Families humbly invite you to the island of Kahupala, for a discussion alongside the highest quality of coffee provided by Chairmistress [Root.monarch.getName]’s personal collection. In light of Bwa Dakinshi’s long awaited unification, the time has come for many of the longstanding treaties and agreements among our circle of aligned economic powers of the Ringlet Sea to be reassessed and renegotiated. After all, such pacts were made under very different political assumptions. Present will be representatives of all who ply these waves, both scrupulous and underhanded, and it is our sincerest hope that we may reach an agreement favorable to all.\n\nCharimistress [Root.monarch.getName]"

 l63_secured_exculsivity_title:0 "Secured Exclusivity"
 l63_secured_exculsivity_desc:0 "The last major competitor of ours in the Ringlet Sea are the haughty half elves of Arawkelin - they believe themselves so much better than us or even their Gataw cousins, all while their power in the region has waned with our ascension. We have done our best to cut them off from the flow of trade by isolating their merchants and harassing their shipping using deniable assets acquired from the pirates of Pinghoi, but such methods have their limit.\n\nThe time has come to secure the coast of Arawkelin and end their presence once and for all. Taking their ports will eliminate their tariffs and provide our merchants with a very profitable stop on their way up the coast to Yanshen."

 l63_survery_the_storm_title:0 "Survey the Storm"
 l63_survery_the_storm_desc:0 "Our chi collection is working, but more by blind prayer and hope than any logical system. We spend the monsoon season waiting in suspense on the shoreline awaiting signs of Hujan’s return. It is unacceptably inefficient for so much money and so many man-hours to be wasted in this way. So in a very rare show of unity the Families have begun a grand project to demystify the motions of Hujan. Charting his motions will prove a great boon for our navies and trade fleets as well, helping mitigate the ever present threat of monsoons."

 l63_end_the_squabbling_title:0 "End the Squabbling"
 l63_end_the_squabbling_desc:0 "[Root.end_the_squabbling_custom_loc]"

 end_the_squabbling_custom_loc_before:0 "With the massive influx of new customers, the pressure on our government has grown beyond the point of reason. Each new deal or proposal leads to political paralysis as the families all jockey for power and profit. It has become clear that something needs to change to help clear the way for future growth and scaling, lest our own disagreements hamper our future earnings."
 end_the_squabbling_custom_loc_after:0 "For centuries the fragmented state of our politics was acceptable due to our near monopoly on coffee production in relevant markets, but the newfound pressure from those damnable Cannorians has made this untenable. At every opportunity they attempt to cheat and outfox us, and the slow moving squabbling of the Seventeen Families has left us unable to swiftly respond. It has become clear to all of us that some level of political reform is necessary, though no two families agree on exactly how this change should look. The planned meeting on the topic is expected to be the longest in Dakinshi history."

 l63_sanddollar_star_title:0 "Sanddollar Star Coffee Co."
 l63_sanddollar_star_desc:0 "[Root.sanddollar_star_custom_loc]"

 sanddollar_star_custom_loc_before:0 "A wonderful new development has occurred to strengthen our relationship with our Cannorian customers. In addition to our normal coffee exports, boutique coffee houses are becoming quite popular in Cannorian cities. While these have long had a presence in cities and in our Yan allies, the Cannorians have taken to them with the fervor of a convert. Fortuitously, the most popular of them is Dakinshi owned, the Sanddollar Star Coffee Coffee Company. It has opened locations across Cannor, with its mostly goldscale employees being a novelty in the human and elf dominated continent. Now if only we knew exactly who owned such a profitable enterprise."
 sanddollar_star_custom_loc_after:0 "It is clear at this point that our usual tactic of bulk coffee sales is doomed to failure in any Cannorian market, their slave-grown Aelentiri swill is just too cheap to make it viable.\n\nFortunately the boundless ingenuity of the Dakinshi entrepreneur has found a solution: boutique coffee houses. A concept first pioneered in Yanshen and our home ports, it has found great success in Cannor. Most popular is the Sanddollar Star Coffee Coffee Company, which has become a popular meeting point for the cannorian middle class, who love the high quality coffee, innovative flavors, and impeccable service from well trained goldscale workers its locations offer."

 l63_the_beacon_line_title:0 "The Beacon Line"
 l63_the_beacon_line_desc:0 "Each year is a part of a grand cycle, culminating in the arrival of the monsoon season, which brings the chi of Hujan that has become a core part of our land. Even beyond the coffee plantations the coming of the storm and chi has become perhaps the most important part of the year for our people. Planting seasons, trade routes, weddings, all are influenced by Hujan.\n\nYet for all of our surveys and studies, we can still only predict when he will come, never know. The economic frustration caused by this uncertainty has been a thorn in the side of the Seventeen for decades, but now the Lee family has brought forth a proposal to codify Hujan’s arrival once and for all. After years of studying records of his movements, they believe they have found a pattern, and have designed a new type of mage tower that would work as a beacon to manipulate this pattern, allowing us to control his movements, and bring further prosperity to Bamaliwuni."

 l63_storms_end_title:0 "Storm's End"
 l63_storms_end_desc:0 "We are not ready. But in truth I doubt we ever could have been ready. It is not some common monster of the jungle that we fight today, but Hujan himself. The great monsoon who some even revere as a god. But not us. The fleet is ready and the army drilled. We have learned all we can from the greatest spirit hunters our vast fortune could poach, and most important of all Cinulau has agreed to aid us. The odds have been stacked as much as possible, now all that is left to do is succeed, lest everything the families have built crumble once and for all."

 l63_working_with_the_whale_title:0 "Working with the Whale"
 l63_working_with_the_whale_desc:0 "With the defeat of Hujan, the storm has abated at last, allowing us to rebuild and heal. Unfortunately it has become apparent that he has no intention to ever return. With his absence also comes a total absence of new chi, a situation that pundits have predicted as being “absolutely catastrophic for long term economic growth.”\n\nFortunately we also have a solution wrapped in with one of our other problems. In getting Cinulau to help us fight Hujan, we promised, well, a lot of things. Probably too many in fact, chief among them being his dominion over the Ringlet Isles. If we can get him to start bringing chi to Bamaliwuni as a part of granting that concession, that would solve both our problems, once we retooled the nexuses to gather chi from the incoming tide instead of an incoming storm."

 l63_a_deprived_land_title:0 "A Deprived Land"
 l63_a_deprived_land_desc:0 "Our first expeditions through the weakened stormwall are returning, and bring with them exciting news! Within lies an entire new continent untouched by foreign merchants, known to the locals as “Insyaa.” The land certainly has its quirks, the immense plants and animals were certainly a surprise, and some of the stories we have heard about the deep interior, the “hinuilands” have ensured we will stay far away from that green hell. But most importantly, the locals have never had coffee! It is a perfectly untouched market for us to exploit. Our explorers handed out gifts of coffee when they stopped among the mangrove cities, giving them a taste for what is to come."

 l63_salt_and_flame_title:0 "Salt and Flame"
 l63_salt_and_flame_desc:0 "North past the mangroves lies the vast archipelago of Kanolowele. Our merchants have already begun moving into the region, expanding the Insyaan coffee trade north along the coast to the island nations. However our merchants have begun complaining to their affiliated families about the exorbitant and unjust tolls being enacted upon them. Such overreach by the locals must not be left unanswered. The Kot family has put together an expedition to enter western Kanolowele and ensure naval security and guarantee freedom of navigation in the local water. The Insyaans might object to our presence, but they will see it is for the best in the long run, especially if we can get one of the dragon turtles on our side."

 l63_ever_awake_title:0 "Ever Awake"
 l63_ever_awake_desc:0 "Every minute of every day, someone in the world is drinking a cup of Butuguzan coffee. Be it in the coffee houses of Cannor, the gardens of Bamaliwuni, the great cities of Haless, or the isles and mangroves of Insyaa, our coffee, black or spiced, with milk or with tea, has become a unifying thread across Halann. No matter one's culture or creed, all who partake pay their dues to us.\n\nAround the Ringlet Sea the rule of the Seventeen is ironclad, the families vast and wealthy, owning every plantation and every port, their competition with each other driving profits up and up with each passing year. The cities bustle with life and commerce, and in Bamaliwuni chi rushes in with every tide Cinulau brings, channeled into the bumbadada where it flows to every corner of our homeland. Bamaliwuni never sleeps, and neither does the rest of our empire."

 l63_reliable_suppliers_title:0 "Reliable Suppliers"
 l63_reliable_suppliers_desc:0 "While Fuhoengwaan is best known across the ringlet sea as the city of coffee, it is also one of the main ports through which the mineral riches of Bamaliwuni’s interior flow. The gold bullion we keep as payment of course, but the bars of copper and bags of gem are common exports. The only point of friction has been the need to coordinate with the petty warlords of the interior. Each time the caravans arrived, they would puff themselves up and demand we pay a greater toll, a threat only dissuaded by the Mbabazi Families ever growing payroll of guards. But now that warlords are out of the way, profit can flow unimpeded from the mountains to the coast. All that is needed is to decide which families get ownership of what mines."

 l63_restoring_trade_routes_title:0 "Restoring Trade Routes"
 l63_restoring_trade_routes_desc:0 "While merchants affiliated with the Seventeen of course ply their wares in countless ports across Sarhal and Haless, one of our most important trade routes has always been to Cuihiok. For many of the families, it is still considered an important part of our heritage, and some such as the Lee and Kot still maintain close ties with the local clans they are descended from.\n\nIn recent years the loss of our harbour in Fuhoengwaan disrupted this vital artery of trade, but the time has come to restore it. The Kot family has announced a collaboration between them and the Goeng family to put together a grand trade fleet to herald their return to Halessi markets."

 l63_to_catch_the_storm_title:0 "To Catch the Storm"
 l63_to_catch_the_storm_desc:0 "For months we have been preparing for our first attempt at bringing Chi to Sarhal. It has long been a dream to allow for Chi to be used by more than just the Shifter-Monks who can attune to the Chi of their soul animals, but we have lacked the inspiration and stability to do so until now.\n\nThe only event that sees Chi brought to Bamaliwuni is the arrival of the great spirit Hujan and his monsoons, who rampages across Haless and the Ringlet Sea, bringing ferocious rain and bountiful chi at the same time. But outside of Haless, the chi is ephemeral and fades away in mere moments.\n\nTo capture it and prevent its fading everything must be perfect. The peninsula of Guwazi has been utterly reshaped and sculpted with the help of the druids for this purpose. Trees have been replanted, canals have been dug, farms torn up, and villages relocated, all to create a nexus where everything is perfectly aligned so that chi may be channeled from the storm by our monks and into the waiting earth below, where it can then flow into the Bumbadada."

 l63_druidic_gardening_title:0 "Druidic Gardening"
 l63_druidic_gardening_desc:0 "The cooperation of the Druids was crucial in our successful creation of the first bumbadada nexus, their magic allowing for much easier reshaping of earth than simple manual labor. So as we continue to expand the bumbadada, bringing even more druids into the work is the obvious path forward. When put up to a vote among the Seventeen, the proposal proved extremely contentious. Not because of any problems with the proposal itself, but because it would give the Tembo family, who has by far the largest number of druids and mages under contract of any of the families, more wealth and influence. Several days of debate in addition to some judicious bribery and promises saw the proposal passed by a slim majority."

 l63_storm_catch_system_title:0 "Storm Catch System"
 l63_storm_catch_system_desc:0 "Quarterly reports from all seventeen of the families have shown the collection of chi from Hujan to a resounding success, coffee production is up across the board, and the ancillary effects of this has caused a surge in other industries as well. With such convincing profits, the path forward is of course expansion.\n\nThree new nexuses have been planned along the coast, and local villages are already in the process of being relocated before the terrain reshaping can begin. Our recent project in studying Hujan’s movements have given us greater insights into where to build the nexuses, but also into how our gathering techniques can be enhanced, with the new sites designed to incorporate new infrastructure to assist with channeling, such as vast towers upon which practitioners shall be placed to capture higher altitude chi, and oceanic buoys to help gather from parts of the storm that do not make it to shore."

 l63_bottom_up_design_title:0 "Bottom Up Design"
 l63_bottom_up_design_desc:0 "Outside of the carefully cultivated bumbadada nexuses, the development of local terrain to support the ever growing amount of chi has been admittedly haphazard. It has largely been left up to local practitioners, leading to a lack of consistent quality and uniformity, a situation that is frankly untenable for the future. After all, any wasted chi is wasted profit.\n\nNow that our political situation has been reformed and stabilized, this waste can finally be addressed. The same level of meticulous planning that we apply to our bumbadada nexuses will be expanded across Bamaliwuni, helping extend how far each drop of chi can be stretched."

 l63_from_the_land_to_the_land_title:0 "Through You"
 l63_from_the_land_to_the_land_desc:0 "From the land, to the land, through you. That is the essence of the flow of chi, the core philosophy underpinning our practices. For we are active participants, nay, we are shepherds of its movements, be it guiding it from the storms of Hujan into the earth of Bamaliwuni or from the water of the bumbadada into fields of coffee, the practitioner is key to the process. So as the land becomes more and more saturated with chi each year, it becomes more and more imperative that this understanding becomes widespread, lest our effort and the bounty of storm both go to waste."

 l63_hiring_consultants_title:0 "Hiring Consultants"
 l63_hiring_consultants_desc:0 "One thing that separates us from our transmutative path brothers in haless in that while we to have mastered our understanding of the nature of chi and the environment, we are fair inferior in our understanding of spirits. After all, they have no true presence in our homelands. Now that there is one very big and very angry exception, we are beginning to regret this gap in our knowledge.\n\nTo plug this gap it is imperative we hire the best help we can, specifically the most experienced spirit hunters of Haless who can inform our policy and response. The Halessi are undergoing their own spirit related problem, some kind of “Rending” but our need is clearly more pressing, so we have already started writing checks."

 l63_the_yemaki_connection_title:0 "The Yemakai Connection"
 l63_the_yemaki_connection_desc:0 "The rending-related chaos in haless has made the necessity of our stabilizing presence more apparent than ever, and has also highlighted the deficiencies in the current situation - our interests are isolated in southern Vimdatrong and the yanshen coast, with no connection between this. This has been hampering our ability to respond to threats in both regions.\n\nThe solution is obvious - a new road connecting our naval base in Arawkelin to the Kohlinlom will give us much greater strategic and logistical flexibility."

 l63_bulwark_against_instability_title:0 "Stand Against Instability"
 l63_bulwark_against_instability_desc:0 "The Rending is such a tragedy for the poor halessi. To have their homes torn asunder by the great spirits is a pain we of course sympathize with given our experience with Hujan’s rampage. It is thus our imperative, nay our duty, to offer our allies in Zyugyut help in funding the reconstruction of their ravaged lands, in the form of some life saving loans with some very competitive repayment plans. Some might decry them as “predatory” or “a violation of national sovereignty” but requiring a representative of the Seventeen to act as a permanent advisor to the King is simply fiscal prudence. We are also happy to accept our brethren as refugees, inviting them to the safety of Bamaliwuni, especially if they come with valuable skills and expertise."

 l63_reminder_of_our_patronage_title:0 "Reminder of our Patronage"
 l63_reminder_of_our_patronage_desc:0 "Let none say that the Seventeen families have anything but the greatest respect for the honored monks of the Bustebe Dajadera. They, and the monastery they inhabit are the spiritual center of our nation and we would like nothing more than to leave them to their meditations on the nature of chi and training with their soul animals.\n\nHowever. The situation is somewhat dire. And the practitioners of the Way of Ancestral Wisdom are the finest warriors on the continent, weaving martial arts from Haless together with their shapeshifting. So we will be requiring their service. As soon as possible. After all, we do pay the bills for the monastery."

 l63_lodges_to_monasteries_title:0 "Lodges to Monasteries"
 l63_lodges_to_monasteries_desc:0 "The strength of the monks of ancestral wisdom was a crucial factor in securing our victory and reuniting Bwa Dakinshi. Their discipline tempered the inherent wildness of their soul animal allowing them to triumph over the shapeshifters of the other warlords. To build on this victory we have commissioned the renovation of Bamaliwuni’s shifter lodges into new monasteries in the image of the Bustebe Dajadera, so that all who wish to deepen their understanding of shapeshifting may do so by gaining an understanding of the chi underlying it all."

 l63_spreading_wisdom_title:0 "Spreading Wisdom"
 l63_spreading_wisdom_desc:0 "What good is chi if the people do not know how to use it? The creation of the Bumbadada nexus has been a resounding success, allowing us to spread and infuse chi across the region. But its full potential is untapped, with knowledge of its use being largely isolated to our monasteries. Those with training understand how to use chi to mend the land and regulate disorder as a part of the grand cycle that may be natural in haless and that we have begun to graft to Bamaliwuni. Each chi user is another who can tend this graft, be it by strengthening their crops, or tending to the land and people, and each in turn increases our coffee growing efficiency, making it imperative that we educate the populace in these arts."

 l63_schools_of_haless_title:0 "Schools of Haless"
 l63_schools_of_haless_desc:0 "As our Naamjyut allies expand across Yanshen, the breadth of martial knowledge contained within their domain has expanded, for the various schools of the xia are near endlessly diverse. Just as the path of ancestral wisdom encompasses the full breadth and diversity of shifter forms, so too should it incorporate the breadth of martial techniques, as what works for a mongoose shifter could be useless to the needs of an elephant shifter. As such we have dispatched monks from the Bustebe Dajadera to travel to Yanshen and learn the ways of these other sects."



