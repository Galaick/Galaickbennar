 squabbling_state_reform:0 "The Squabbling State"
 squabbling_state_reform_desc:0 "The Seventeen Families are united chiefly by their disunity. Under their rule, Bwa Dakinshi is less a coherent nation and more an ever-shifting web of treaties and alliances, each family jealously guarding its interests while cooperating only when profit or necessity demands it. Somehow, amid the squabbling, it manages to function and endure."

 flux_state_reform:0 "The Flux State"
 flux_state_reform_desc:0 "The Seventeen Families remain as divided as ever, but that division has been turned into a source of strength. Rivalry drives innovation and competition causes the best to rise to the top, and no family can grow fat and complacent while the sixteen others scheme to surpass them. While it may lack many of the criteria of a modern state, it has somehow proved competitive, at least in the world of trade."

 familial_state_reform:0 "The Familial State"
 familial_state_reform_desc:0 "The Seventeen Families are bound together by more than treaties and profit. Generations of marriage, blood, obligation, and patronage have woven them into a tangled ruling caste whose fortunes are inseparable from the state itself. Rivalries remain, but beneath them lies a shared familial order that has cemented their dynasties at the heart of Butuguzi, slowly transforming it into something more akin to the to the Raghamideshi merchant kingdoms of Rahen, or the colonial monarchies of Cannor."

