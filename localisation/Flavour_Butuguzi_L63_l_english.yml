 cover_of_night_custom_loc_evocation: "Report from Commandant Tang Sin Mbabazi to the Council of the Seventeen\n\nOur force made landfall at dusk on the northern coast, two days west of the marked anchorage. The landing was difficult but undetected. Local gnollish guides, secured through prior arrangement and paid half in silver, met us at the landing site and proved crucial to the crossing of the Salahad, taking us on a route that ensured we avoided any patrols and had sufficient water.\n\nAt dawn on the eighth day, we reached the far side of the desert, and after a day of rest fell upon the unsuspecting garrison, which was swiftly defeated.\n\nAt this point I transferred operational command to Evoker Urunekozi, now that the focus was on the primary target of the coffee plantations. We spread out across the region at this point. Estates were taken with minimal resistance from the owner’s security, and the mage detachments went to work, calling meteors to salt the already aflame fields and warehouses. The majority of the skilled laborers were caught in the blaze, and any survivors were rounded up and dealt with by my soldiers. By my count it took approximately 80 hours to entirely eliminate the cultivation of coffee and local knowledge base for the region.\n\nAt this point enemy forces had gathered for a counterattack and we were forced to withdraw, setting off on a night march back into the Salahad. This proved costly as we faced constant harassment from bulwari cavalry as we retreated, exacerbated by being unable to stop for sufficient water collection compared to the first crossing, (See attached report on casualties and lost material) but we ultimately made it back to the coast and the protection provided by the Navy."
 cover_of_night_custom_loc_necromancy: "Report from Commandant Tang Sin Mbabazi to the Council of the Seventeen\n\nOur force made landfall at dusk on the northern coast, two days west of the marked anchorage. The landing was difficult but undetected. Local gnollish guides, secured through prior arrangement and paid half in silver, met us at the landing site and proved crucial to the crossing of the Salahad, taking us on a route that ensured we avoided any patrols and had sufficient water.\n\nAt dawn on the eighth day, we reached the far side of the desert, and after a day of rest fell upon the unsuspecting garrison, which was swiftly defeated.\n\nAt this point I transferred operational command to Necromancer Urunekozi, as our attention shifted to the primary target: the coffee plantations. Our force dispersed across the region, seizing the estates with little resistance from their guards. The plantation owners, overseers, merchants, and senior laborers were separated from the rest and delivered to the necromantic detachments.\n\nThe freshly dead were swiftly raised and put to work under Urunekozi's direction. Workers who had spent their lives tending the coffee now ripped it out root and stem. Corpses tore plants from the earth, smashed irrigation channels, emptied warehouses, and carried seed stock into great pyres. Once an estate had been stripped bare, the dead were marched onward to the next. By my count, within approximately eighty hours we had destroyed not merely the present harvest, but nearly every accessible reserve of seed and much of the knowledge required to restore cultivation quickly.\n\nAt this point enemy forces had gathered for a counterattack and we were forced to withdraw, setting off on a night march back into the Salahad. This proved costly as we faced constant harassment from bulwari cavalry as we retreated, exacerbated by being unable to stop for sufficient water collection compared to the first crossing, (See attached report on casualties and lost material) but we ultimately made it back to the coast and the protection provided by the Navy."
 cover_of_night_custom_loc_conjuration: "Report from Commandant Tang Sin Mbabazi to the Council of the Seventeen\n\nOur force made landfall at dusk on the northern coast, two days west of the marked anchorage. The landing was difficult but undetected. Local gnollish guides, secured through prior arrangement and paid half in silver, met us at the landing site and proved crucial to the crossing of the Salahad, taking us on a route that ensured we avoided any patrols and had sufficient water.\n\nAt dawn on the eighth day, we reached the far side of the desert, and after a day of rest fell upon the unsuspecting garrison, which was swiftly defeated.\n\nAt this point I transferred operational command to Abjurer Urunekozi, as our attention shifted to the primary target: the coffee plantations. Our forces spread across the region and secured the estates. Three waves of summons were used to scour the plantations clean. First feral animal were sent in to clear out the plantation staff. This was followed by fire elemental to turn the fields and facilities into ash, and then finally earth elementals who turned the fields into jagged expanses of broken rock. This pattern continued for the next 80 hours, the elemental working without sleep until no coffee fields were left unmarred.\n\nAt this point enemy forces had gathered for a counterattack and we were forced to withdraw, setting off on a night march back into the Salahad. This proved costly as we faced constant harassment from bulwari cavalry as we retreated, exacerbated by being unable to stop for sufficient water collection compared to the first crossing, (See attached report on casualties and lost material) but we ultimately made it back to the coast and the protection provided by the Navy."
 cover_of_night_custom_loc_enchantment: "Report from Commandant Tang Sin Mbabazi to the Council of the Seventeen\n\nOur force made landfall at dusk on the northern coast, two days west of the marked anchorage. The landing was difficult but undetected. Local gnollish guides, secured through prior arrangement and paid half in silver, met us at the landing site and proved crucial to the crossing of the Salahad, taking us on a route that ensured we avoided any patrols and had sufficient water.\n\nAt dawn on the eighth day, we reached the far side of the desert, and after a day of rest fell upon the unsuspecting garrison, which was swiftly defeated.\n\nAt this point I transferred operational command to Enchanter Urunekozi, as our attention shifted to the primary target: the coffee plantations. Our forces spread across the region and secured the estates, although in most cases little further violence proved necessary. Urunekozi's detachments surrounded the estates and cast enchantments across the hemmed in laborers.\n\nThe detachments then moved onto the next estate while the workers then began systematically destroying their own estates, burning down storehouses and salting fields. When the work was complete, the most skilled and knowledgeable workers made their way out of the ruins and presented themselves to the soldiers, who questioned them extensively about everything from irrigation to bean roasting techniques. After 80 hours, the plantations had been destroyed without us needing to light so much as a fire.\n\nAt this point enemy forces had gathered for a counterattack and we were forced to withdraw, setting off on a night march back into the Salahad. This proved costly as we faced constant harassment from bulwari cavalry as we retreated, exacerbated by being unable to stop for sufficient water collection compared to the first crossing, (See attached report on casualties and lost material) but we ultimately made it back to the coast and the protection provided by the Navy."
 cover_of_night_custom_loc_illusion: "Report from Commandant Tang Sin Mbabazi to the Council of the Seventeen\n\nOur force made landfall at dusk on the northern coast, two days west of the marked anchorage. The landing was difficult but undetected. Local gnollish guides, secured through prior arrangement and paid half in silver, met us at the landing site and proved crucial to the crossing of the Salahad, taking us on a route that ensured we avoided any patrols and had sufficient water.\n\nAt dawn on the eighth day, we reached the far side of the desert, and after a day of rest fell upon the unsuspecting garrison, which was swiftly defeated.\n\nAt this point I transferred operational command to Illusionist Urunekozi, and we settled down to lie in wait and prepare. An initial bulwari force arrived quickly to assess the situation and intercept us, and were instead ensorcelled by an illusion. Believing our forces were in the process of looting the coffee plantations, they quickly spread out and began fierce building to building fighting against the plantation workers, leaving a trail of destruction in their wake. Our soldiers followed behind, putting the finishing touches on the destruction. The mages were able to maintain this illusion for around 80 hours, at which point the destruction was essentially complete.\n\nThis timing corresponded with a larger bulwari force having arrived, and we were forced to withdraw, setting off on a night march back into the Salahad. This proved costly as we faced constant harassment from bulwari cavalry as we retreated, exacerbated by being unable to stop for sufficient water collection compared to the first crossing, (See attached report on casualties and lost material) but we ultimately made it back to the coast and the protection provided by the Navy"
 cover_of_night_custom_loc_abjuration: "Report from Commandant Tang Sin Mbabazi to the Council of the Seventeen\n\nOur force made landfall at dusk on the northern coast, two days west of the marked anchorage. The landing was difficult but undetected. Local gnollish guides, secured through prior arrangement and paid half in silver, met us at the landing site and proved crucial to the crossing of the Salahad, taking us on a route that ensured we avoided any patrols and had sufficient water.\n\nAt dawn on the eighth day, we reached the far side of the desert, and after a day of rest fell upon the unsuspecting garrison, which was swiftly defeated.\n\nAt this point I transferred operational command to Abjurer Urunekozi, as our attention shifted to the primary target: the coffee plantations. Our forces spread across the region and secured the estates. In cases where the field water came from rivers, the mage detachment created barriers of force in the local waterways, causing them to spill out and flood the estates. Other groups of mages would create barriers around the estates, transforming them into low lying swamps. In cases where the plantations were fed by wells and springs, layers of barriers were formed deep within the earth, sealing them and leaving the farms without future succor. In these cases my soldiers had to raze the farms manually, abjuration does not favor direct destruction. After 80 hours, we had finished. Every plantation in the region was either a rotting swamp or a dry ruin, both unsuitable for future cultivation.\n\nAt this point enemy forces had gathered for a counterattack and we were forced to withdraw, setting off on a night march back into the Salahad. This proved costly as we faced constant harassment from bulwari cavalry as we retreated, exacerbated by being unable to stop for sufficient water collection compared to the first crossing, (See attached report on casualties and lost material) but we ultimately made it back to the coast and the protection provided by the Navy."
 cover_of_night_custom_loc_transmutation: "Report from Commandant Tang Sin Mbabazi to the Council of the Seventeen\n\nOur force made landfall at dusk on the northern coast, two days west of the marked anchorage. The landing was difficult but undetected. Local gnollish guides, secured through prior arrangement and paid half in silver, met us at the landing site and proved crucial to the crossing of the Salahad, taking us on a route that ensured we avoided any patrols and had sufficient water.\n\nAt dawn on the eighth day, we reached the far side of the desert, and after a day of rest fell upon the unsuspecting garrison, which was swiftly defeated.\n\nAt this point I transferred operational command to Transmuter Urunekozi, now that the focus was on the primary target of the coffee plantations. We spread out across the region at this point. Estates were taken with minimal resistance from the owner’s security, and the mage detachments went to work, forcing the coffee plants into violent, uncontrolled growth, drawing years of nourishment from the soil in the space of minutes. The entire plantation flowered, fruited, and then withered before our eyes, before the soldiers set the dry fields ablaze. Once the current crop was destroyed, the mages turned their attention to the soil, hardening it into dense crusts or breaking it down into dusty sand. They then drew clay upward to choke drainage, while elsewhere the ground was made so porous that it would no longer retain sufficient water. After 80 hours of work, there was no sign that the region could have ever supported coffee plantations of any kind.\n\nAt this point enemy forces had gathered for a counterattack and we were forced to withdraw, setting off on a night march back into the Salahad. This proved costly as we faced constant harassment from bulwari cavalry as we retreated, exacerbated by being unable to stop for sufficient water collection compared to the first crossing, (See attached report on casualties and lost material) but we ultimately made it back to the coast and the protection provided by the Navy."
 cover_of_night_custom_loc_divination: "“So let me get this straight. Diviner Urunekozi took your expedition on a merry chase across all of Bulwar, ignoring the coffee fields that were the objective, all to find a magic ring in some ancient ruin?”\n\n“That is broadly correct ma’am.”\n\n“Ok, so what did he do with the ring?”\n\n“Sarišdin”\n\n“Pardon?”\n\n“The locals called it Sarišdin ma’am, And he, well he spoke to it, said something along the lines of ‘The Bulwari shall stop growing coffee, or they shall become coffee.’”\n\n“And it worked?”\n\n“It appears so ma’am. The Bulwari certainly blame us and don’t seem keen on testing it.”\n\n“Yes I saw the war declarations - and Diviner Urunekozi?”\n\n“He uh, did not make it back ma’am. Speaking to Sarišdin caused him to start screaming and his body to start, well to start splitting for lack of a better word.” \n\n“Splittling?”\n\n“You don’t want to know ma’am. He ran off into the desert after that, and there wasn’t much left by the time we found him. The ring was missing as well.”\n\n“Whole thing’s a damn mess. What did we learn from this Commandant?”\n\n“I don't know, ma’am.”"