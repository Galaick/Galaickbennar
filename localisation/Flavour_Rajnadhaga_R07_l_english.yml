l_english:

 #Missions
 rajnadhaga_avenge_the_peace_of_1351_title: "Avenge the Peace of 1351"
 rajnadhaga_avenge_the_peace_of_1351_desc: "The reborn Harimraj was stopped in Rajnadhaga nearly a century ago thanks to the union of the Northern kingdoms fearing a renewed Southern hegemony. We were forced to cede the lands of Ghattub but we have not forgotten that they are rightly ours. Now with the Raj weak and divided we have a perfect chance to regain these lands."

 rajnadhaga_weaken_the_raj_title: "Weaken the Raj"
 rajnadhaga_weaken_the_raj_desc: "Our victory in Ghattub has shattered the hold of the Raj in the region. The rulers of Tiltaghar and Babaghama could be persuaded to break their oaths of allegiance to Dejinhasar to avoid our invasion. Many of the Yodhiyari roaming their lands are also eager to fight the menace from the North rather than their countrymen."

 rajnadhaga_antideluvian_nobility_title: "Antediluvian Nobility"
 rajnadhaga_antideluvian_nobility_desc: "Nobility in the Ruin kingdoms is not bought like in more younger kingdoms. Here the Classics of literature recall the exploits of direct ancestors to all nobles of the realm. By granting them new privileges we can ensure their support in the war and reassure the princes that fight under our dominion that we respect the blood of yore."

 rajnadhaga_harimari_warriors_title: "Harimari Warriors"
 rajnadhaga_harimari_warriors_desc: "While few Harimari are present in the North compared to Southern Rahen there is still a sizable population of them that is well learned in the art of war. By accepting them as integral parts of our nobility, their most eminent leaders could join our service and help us fight against the hobgoblins."

 rajnadhaga_train_new_khamayodi_title: "Train New Khamayodi"
 rajnadhaga_train_new_khamayodi_desc: "For a long time we have used slaves to fight in our wars, mostly in our infantry. The wars against the Command require more and more cannonfodder and the Kingdom must buy new boys to train as Khamayodi to ensure our victories."

 rajnadhaga_orc_khamayodi_title: "Orcish Khamayodi"
 rajnadhaga_orc_khamayodi_desc: "Orcs are terrible creatures that have ravaged the North as the vanguard of the Hobgoblins. But now that we control them, we see their use and a proposal has been made by our generals to train new Khamayodi from the Orcish slaves we have made. They would surely help in our fight but also need to be disciplined because of their ferocious nature."

 rajnadhaga_the_brown_band_title: "The Brown Band"
 rajnadhaga_the_brown_band_desc: "Orcs have been used in our armies for years now and they have distinguished themselves in combat acting as a vanguard striking into the enemy formations. We could create an elite corps dedicated to the guard of the King and generals to award the best Orcish fighters and ensure us a great advantage in the wars to come."

 rajnadhaga_along_the_dhenbasana_title: "Along the Dhenbasana"
 rajnadhaga_along_the_dhenbasana_desc: "With the Ghankedheni secured, the anarchy of Rekhandesh must be ended."

 rajnadhaga_prepare_for_war_title: "Prepare for War"
 rajnadhaga_prepare_for_war_desc: "Our country has been left largely untouched by war in the past few decades and our armies were caught by surprise during the Command invasion. To ensure the survival of our kingdom we must arm more soldiers."

 rajnadhaga_subjugate_the_weak_title: "Subjugate the Weak"
 rajnadhaga_subjugate_the_weak_desc: "The princedom of Parraj has existed as a buffer state between our ambitions and those of Sarnavan for decades but with the threat of the Hobgoblins we must end their independence."

 rajnadhaga_end_sarnavan_title: "End Sarnavan"
 rajnadhaga_end_sarnavan_desc: "The kingdom of Sarnavan is the only state in the North dominated by Harimari warriors. They used the invasion to submit to the weakened kingdom of Tilathi and can not be trusted in these troubled times. Our rivalry must now end with their defeat if we want the Shamakhadi people to be free."

 rajnadhaga_heir_of_the_nadimraj_title: "Heir of the Nadimraj"
 rajnadhaga_heir_of_the_nadimraj_desc: "In the face of adversity the Ruin kingdoms of the North have rallied under our Rule, securing for now their population from slavery at the hand of the Command. No human king has wielded such power in northern Rahen since the day of Ashen Skies and we appear to be the true heirs of the dynasties that ruled from Sarnihanpur."

 rajnadhaga_vanquish_the_elephant_lords_title: "Vanquish the Elephant-Lords"
 rajnadhaga_vanquish_the_elephant_lords_desc: "The lands of the south are home to the Elephant-lords. They must be submitted if we wish to harness their mastery of these mighty beasts."

 rajnadhaga_end_the_raj_title: "End the Raj"
 rajnadhaga_end_the_raj_desc: "The Raj of Dhenijensar must be ended for us to be recognized as the heirs of the Rahenraj."

 rajnadhaga_the_league_of_shamakhad_title: "The League of Shamakhad"
 rajnadhaga_the_league_of_shamakhad_desc: "The Northern kingdoms have squabbled for centuries but have seldom united in the face of foreign adversity, be it Eastern demons, bands of centaurs or the Southern Raj. The kingdom of Khadisrapur was only saved from collapse with our intervention and we must keep this alliance strong."

 rajnadhaga_protect_our_bretheren_title: "Protect Our Brethren"
 rajnadhaga_protect_our_bretheren_desc: "It was the war between the Raghajandi and Ghatasak kingdoms that allowed the Command to advance so easily. By the time we had rallied to help the North it was already too late and Khadisrapur was forced to cede most of their territories to bands of orcs and goblins. They must understand that they must bow to the one true King of the North as to ensure our victory against darkness."

 rajnadhaga_avenge_our_brethern_title: "Avenge Our Brethren"
 rajnadhaga_avenge_our_brethern_desc: "Sarilavhan has fallen. The Command has been forced to flee the city and our troops sacked it, enslaving the former masters and freeing our Human masters. While the Command is far from vanquished, it will rally all the Shamakhadi people around us."

 rajnadhaga_continue_the_fight_title: "Continue the Fight"
 rajnadhaga_continue_the_fight_desc: "The war against the Command has proven hard, but we have taken back the last great city of the North, Sir. This another victory proves that the Command weakens and that their final defeat is coming close."

 rajnadhaga_finishing_the_reconquest_title: "Finishing the Reconquest"
 rajnadhaga_finishing_the_reconquest_desc: "The people of Northern Rahen are now free under our rule, and the tragedy of the Invasion has ended!"

 rajnadhaga_end_the_command_title: "End the Command"
 rajnadhaga_end_the_command_desc: "We can not let the Hobgoblins roam the land under the sun, let us banish them to the caverns of the Jade Mines!"

 rajnadhaga_end_the_caste_system_title: "End the Caste System"
 rajnadhaga_end_the_caste_system_desc: "For centuries the harimari have kept the human population of Rahen oppressed through their caste system. It is time that ends. While this will create chaos, it will also create a surge of upwards mobility and afterwards we will be better for it!"

 rajnadhaga_blessing_of_the_kharunyana_title: "Blessing of the Kharunyana"
 rajnadhaga_blessing_of_the_kharunyana_desc: "The Kharunyana river is the main source of riches of our country, with enough arable lands to feed an evergrowing population. We should closely monitor farms to ensure our soldiers are fed."

 rajnadhaga_a_haven_of_peace_title: "A Haven of Peace"
 rajnadhaga_a_haven_of_peace_desc: "Our kingdom appears like a haven of peace in Rahen, with refugees from both the Northern kingdoms and the Raj fleeing enslavement and war. They can be settled in our lands to ensure our prosperity."

 rajnadhaga_glass_artisans_of_rahen_title: "Glass Artisans of Rahen"
 rajnadhaga_glass_artisans_of_rahen_desc: "Rajnaghadi artisans are valued in Rahen for producing the best glass, the only other source of fine works being the cities of Bulwar. The kingdom must use this great source of income to enhance its prestige and help fund our armies by granting charters to the guilds producing it."

 rajnadhaga_delve_into_the_classics_title: "Delve Into the Classics"
 rajnadhaga_delve_into_the_classics_desc: "The royal libraries of the North hold the literary treasures of Rahen, with the Treaties on Good Life by Ishtar or the Art of Rule by Khanwal Nud. While the days of the old Nadimraj are gone, these treaties could still help our rulers and we must commission new traditions by the priests in charge of the libraries."

 rajnadhaga_new_library_of_sharaja_title: "New Library of Sharaja"
 rajnadhaga_new_library_of_sharaja_desc: "The library of Sharaja was destroyed by the Sun elves of Jaher although the records do not agree if it was intentional or an accident during the siege. Anyway the efforts of the kings to reassemble the texts destroyed during the war have been limited. Our ministers think that the library should be rebuilt anew and serve as a symbol of the power of our monarch."

 rajnadhaga_the_military_college_title: "The Military College"
 rajnadhaga_the_military_college_desc: "The royal library of Sarilavhan was used by the Hobgoblins that rearranged it to help them in their conquest. We could focus on the war manuals collected by them to educate our officers in a new military college attached to the library."

 rajnadhaga_a_golden_age_of_philosophy_title: "A Golden Age of Philosophy"
 rajnadhaga_a_golden_age_of_philosophy_desc: "The Royal libraries renovated by our state form the backbone of the education of the administrators and scholars. A new philosophy emerges from this scholar community that could be adopted by the monarchy."

 rajnadhaga_never_again_title: "Never Again"
 rajnadhaga_never_again_desc: "We still scare our children at night with stories of the hobgoblins invading our towns and indiscriminately burning and pillaging the countryside. We must never again let such an invasion happen. Let us secure their hills and guard the entrances to the Serpentspine with our greatest forts. No more invasions."

 rajnadhaga_the_library_of_sarnavan_title: "The Library of Sarnavan"
 rajnadhaga_the_library_of_sarnavan_desc: "Sarnavan has always attracted numerous foreign students wishing to enhance their knowledge thanks to its southern situation. We could act on this situation by renovating the library and welcoming foreigners so they may later integrate our administration."

 rajnadhaga_the_royal_library_of_sir_title: "The Royal Library of Sir"
 rajnadhaga_the_royal_library_of_sir_desc: "Sir, the fourth library of the North, always saw greater innovation thanks to the compilation of both Shamakhadi tradition but also from the rest of Haless. The occupation of the Command only added more diversity to the collection of Sir and we could renovate it."

 rajnadhaga_resettling_the_north_valley_title: "Resettling the North Valley"
 rajnadhaga_resettling_the_north_valley_desc: "The reconquest of the North has seen the reinstallation of many former refugees and adventurers that profit from the instability of the area while clashing with bands of goblins, orcs and also local Shamakhadi. While profitable in the long run, we will have difficulties to really rule these lands for years."

 rajnadhaga_empower_the_merchant_class_title: "Empower the Merchant Class"
 rajnadhaga_empower_the_merchant_class_desc: "The Merchants have always seen a smaller role in the Caste system instituted by the Harimraj. Even though we are more flexible than the Harimari, there is still much prejudice against them, which hampers the economy of the realm. Let us lift these restrictions so that we may enjoy the full benefits of our lands!"

 rajnadhaga_an_age_of_steel_title: "An Age of Steel"
 rajnadhaga_an_age_of_steel_desc: "Where once the future of the Shamakhadi kingdoms looked dim and the shadow of the hobgoblin oppression weighed heavy, the northern Rahen plain is now free and bright once more! However some of the Command's presence still remains. Such as the great ironworks they established in Sarilavhan. Let us build those up and expand them to heights that no hobgoblin has ever seen!"

 #Events
 flavor_rajnadhaga.1.t: "The Sack of Sarilavhan"
 flavor_rajnadhaga.1.d: "Sarilavhan was the capital of the Raghajandi kingdom, one of the main powers of Shamakhad for centuries, and a beacon of civilization. The hobgoblin Command settled there, reducing its population to slavery while their leaders roamed the palaces and manors defacing them with their lack of taste. After our victory in the latest war the city was freed and our soldiers entered it as liberators, freeing the masses of Khedarid people from their shackles. But our soldiers were not enough to canalize the fury of the crowds that pillaged their own cities, tracking the goblins that had stayed there, burning much of the city in the meantime. Now Sarilavhan is pacified and returned to Humans, but at a dire cost."
 flavor_rajnadhaga.1.a: "Who can blame them?"
 flavor_rajnadhaga.2.t: "Protection of the Weak"
 flavor_rajnadhaga.2.d: "The time has come for Khadisrapur to accept us as our overlord for the good of Shamakhad"
 flavor_rajnadhaga.2.a: "We hope they make the right choice"
 flavor_rajnadhaga.3.t: "A Proposal from Sharaja"
 flavor_rajnadhaga.3.d: "The Kingdom of Rajdanagha has asked for our subjugation, claiming to be the only hope for the safety of the North. \nIt is true, that with the Command around we have little choice..."
 flavor_rajnadhaga.3.a: "Accept"
 flavor_rajnadhaga.3.b: "Refuse"
 flavor_rajnadhaga.4.t: "Khadisrapur's Response"
 flavor_rajnadhaga.4.d: "Our delegation requesting Khadisrapur's vassalization is back, with their response..."
 flavor_rajnadhaga.4.a: "They accept, hurrah!"
 flavor_rajnadhaga.4.b: "They refused, those fools!"
 flavor_rajnadhaga.5.t: "Seducing the Northern Senaptia"
 flavor_rajnadhaga.5.d: "We will send invitations to accept our overlordship to the northern Senaptia hoping they abandon the Raj and join us in our fights"
 flavor_rajnadhaga.5.a: "Let us hope for the best"
 flavor_rajnadhaga.6.t: "A Proposal from Sharaja"
 flavor_rajnadhaga.6.d: "$FROM_ADJ$ diplomats propose that we end our oath of loyalty to the Raj and join them in their fight for the North."
 flavor_rajnadhaga.6.a: "We accept"
 flavor_rajnadhaga.6.b: "We refuse"
 flavor_rajnadhaga.7.t: "A Proposal from Sharaja"
 flavor_rajnadhaga.7.d: "$FROM_ADJ$ diplomats propose that we end our oath of loyalty to the Raj and join them in their fight for the North."
 flavor_rajnadhaga.7.a: "We accept"
 flavor_rajnadhaga.7.b: "We refuse"
 flavor_rajnadhaga.8.t: "Response from our invitations"
 flavor_rajnadhaga.8.d: "Babaghama and Tiltaghar have sent back our representatives"
 flavor_rajnadhaga.8.a: "Both Senaptia have joined us, we will be victorious!"
 flavor_rajnadhaga.8.b: "Tiltaghar has joined us!"
 flavor_rajnadhaga.8.c: "Babaghama has joined us!"
 flavor_rajnadhaga.8.da: "Both Senaptia have refused to join us"
 flavor_rajnadhaga.9.t: "Worries in the North"
 flavor_rajnadhaga.9.d: "The Kingdom of $FROM$ has managed to convince both Senaptia of the North, Babaghama and Tiltaghar to accept them as their overlord rather than stay in the Raj. It is a terrible blow to us and the Raj, and the only way to end this humiliation would be to subjugate them to remind them we are the Raj!"
 flavor_rajnadhaga.9.a: "Damned Northerners!"
 flavor_rajnadhaga.10.t: "Change in the North"
 flavor_rajnadhaga.10.d: "One of our Northern Senaptia has broken their oath of loyalty and chosen to side with the kingdom of $FROM$, we must rally our armies and regain their loyalty!"
 flavor_rajnadhaga.10.a: "Damned Northerners!"
 flavor_rajnadhaga.11.t: "Diffusion of New Philosophy"
 flavor_rajnadhaga.11.d: "The diffusion of classical and new books thanks to the various royal libraries and the colleges attached to it have changed the conceptual and philosophical landscape of our nation with new schools flowering and debating throughout the land.\nThe main problem discussed by these communities is the question of how to lead a good life while dealing with wars for the safety of mankind. The Statist school mainly found among our administrators emphasis the role of the state, the only guarantee of peace and security. The River school, called this because of the book 'The Worldly Rivers', emphasizes the role of openness and exchange. Lastly we could sponsor the School of Courage that has glorified and justified the virtuous wars waged against the monstrous races."
 flavor_rajnadhaga.11.a: "Let us endorse the Statists"
 flavor_rajnadhaga.11.b: "Let us endorse philosophers from the River School"
 flavor_rajnadhaga.11.c: "Let us endorse the Way of Courage"

