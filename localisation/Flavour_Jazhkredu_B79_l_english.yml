#Events
 flavour_jazhkredu.1.t:0 "A New Kind of Goblin"
 flavour_jazhkredu.1.d:0 "From our time living here it is clear that our people are not the same kind of goblin that they were when we first left the mountains, a new culture is born."
 flavour_jazhkredu.1.a:0 "Embrace it!"
 flavour_jazhkredu.1.tt:0 "Every owned province of §YGoblin§! culture will convert to §YParadise Goblin§!. Our primary culture and the culture of our court will also become §YParadise Goblin§!."