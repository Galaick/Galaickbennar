 #MISSIONS
 G71_under_the_giants_gaze_title:0 "Under the Giant's Gaze"
 G71_under_the_giants_gaze_desc:0 "“My most noble Emperor,\n\nI have told you much of the lands of Orenkoraim, but the market stalls of Port Orenkoraim are grand enough to dwarf all I have shared in previous missives. On my way to the palace of the [Root.Monarch.GetTitle], the winding roads of the markets defied reason, and seeing as I did not speak their language, I had no choice but to wander like a child, guided by nothing but sensation and the musky smells of the market stalls. On every corner, I found a wonder of Aelantir, tended by a keeper blind to its exotic beauties.\n\nThe merchants in the stalls behave as though commerce is but another form of whiling away the hours - they make deals at the languid pace that marks so much of Taychend. But as they do, they cannot help but look up in awe at the gates of Port Orenkoraim. It is through these gates that the ships of Cannor and Taychend sail, whether they are docking here to load their holds with the treasures of Taychend or are headed for home. Each ruinborn sailor, hardened by sea and storm, takes a moment to bow before the gate as they pass. Their superstition is beguiling, and I find myself awestruck.\n\nBut I shall not linger even in this city of spectacle - the continent awaits. I will chart it in your service.\n\nYour faithful servant,\nArmand sil Galvin”"
 G71_under_the_giants_gaze_fct:0 "If §Y[6559.GetName]§! does NOT have a §YFort Building§!:"
 G71_under_the_giants_gaze_sct:0 "\nIf §Y[6559.GetName]§! has at least §Y15§! Development:"

 G71_taming_thekvussam_title:0 "Taming Thekvussam"
 G71_taming_thekvussam_desc:0 "“My beloved Queen,\n\nDeath has once again come to Taychend, and the warlords here have greeted it as an old companion. Orenkoraim marched forth to conquer the coast of Thekvussam, and within Thekvussam the ports of western Taychend. Its tribes resisted fiercely, but Orenkoraim answered with fire and slaughter - their kings did not wish to risk defeat.\n\nOrenkoraim has displayed a concern for the trade of the lands of Thekvussam, and the markets and workshops of those lands remained untouched. The rewards of a continent now flow to Port Orenkoraim.\n\nAnd yet, Your Majesty, these rewards have attracted competitors. Verne, Busilar, Damescrown - all of Cannor flocks to Taychend, attracted by its sensuous mysteries and its gleaming relics alike. The Cannorian quarter of Port Orenkoraim grows by the day, and soon it will spill out into the city and the kingdom beyond. The question is no longer whether Taychend offers riches, but how vast those riches might be, and which hand will command them.\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_taming_thekvussam_effect_ct:0 "While '§YNew Trading Connections§!' is active, upgrading a §YCenter of Trade§! will spread any Cannorian minorities present in §Y[6559.GetName]§! to the upgraded province."

 G71_the_port_of_all_taychend_title:0 "The Port of All Taychend"
 G71_the_port_of_all_taychend_desc:0 "“My beloved Queen,\n\nWhen the explorers of Lorent first set foot on the soil of Taychend, Port Orenkoraim was a port of the decadent and exotic past. Certainly, the spices and dyes of Taychend were bought and sold here, but it was a place of spectacle just as much as a place of commerce.\n\nThis has changed beyond all imagination. The streets of the port are flooded with foreigners, and its docks throng with the ships of Cannor and Taychend alike. If there were once many harbors that could claim the title of the gate of Taychend, Port Orenkoraim has risen above them all, whether because it has developed so far or because it has eliminated each of its competitors. The offices of the joint-stock companies of Cannor line streets that once contained quant market stalls, and the business done here could rival Damescrown or Anbenncost. It is as though a small piece of Cannor has been transported to Taychend.\n\nYet the port cannot contain all ambition, and Cannor's merchants chafe at its limits. Many are beginning to whisper: if such fortunes can be drawn from a single port, what riches await in Taychend beyond?\n\nWhat riches might await Lorent?\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_the_port_of_all_taychend_effect_ct:0 "Upgrade the '§YGate of Kalavend§!' province modifier in [6559.GetName] to '§YGate of Taychend§!', giving the following effects:\nLocal Construction Cost: §G-30.0%§!\nLocal Trade Power Modifier: §G+75.0%§!\nLocal Goods Produced: §G+1.50§!\n\n§Y[6559.GetName]§! gets their §YTrade Building§! upgraded to §YStock Exchange§!."

 G71_scions_of_the_wallmaker_title:0 "Scions of the Wallmaker"
 G71_scions_of_the_wallmaker_desc:0 "“My most noble Emperor,\n\nThe journey from Pearlsedge was far and treacherous, but the intrepid ship the Crown has chartered for me to explore the lands of Aelantir was more than equal to the task of conveying me here - its sailors are steadfast and brave. I will achieve everlasting glory in Taychend for not just Pearlsedge but all of Cannor - they will acclaim me in the history books alongside Endral the Explorer. \n\nI had heard the Taychendi had cities, but when we arrived at port I was expecting a few shacks. I was not expecting walls to rival those of Balgar the Builder. Even as my ship sailed beneath the towers of the Kalavend, I saw the Taychendi working shirtless in the heat to place new bricks on the walls of theirs. Every one of the buildings of Port Orenkoraim held a faded glory about it, as though I walked through a city plucked from the past and frozen in amber.\n\nThere were a thousand archers atop those walls, and as I made my way through the sights and smells of the Port Orenkoraim I saw their eyes following me as the lone foreigner in that bazaar. Their aim was steadied by training, and I would have worried their passion would overwhelm them if I did not have special dispensation from the palace of the port to see the [Root.Monarch.GetTitle].\n\nI kiss your Highness' hands.\n\nYour faithful servant,\nArmand sil Galvin”"
 G71_scions_of_the_wallmaker_effect_ct:0 "Up to §Yfour§! owned provinces with a §YFort Building§! get '§YImitating Elrandar§!' for §Y50 years§!, giving the following effects:\nLocal Fort Maintenance: §G-66.0%§!"

 G71_feign_death_title:0 "Feign Death"
 G71_feign_death_desc:0 "“My most noble Emperor,\n\nThe roads of Taychend are alive with savage beauty. I have continued down these winding roads with my manservant, who I have named Harold. It is a good Pearlsedger name, for a loyal fellow. He knows the roads here in a place beyond memory, and he has guided us farther into the continent.\n\nAt a crossroads, we came across a battlefield, littered with broken blades and with a sensation of lingering death. And yet, even violence here is soaked in an exotic mystery. I asked Harold what happened at this place. He told me that there once were two armies, one of Ameion and one of Larankar. Their hosts clashed across all of Taychend, with this crossroads as but one of many graves. They fought against each other with a single-minded fury, and in their hatred they were blinded to Orenkoraim, inheritor of both their ambitions. Orenkoraim sought to make itself as small and unthreatening as possible, and then at the first possible opportunity it rose up and stabbed both titans in the back.\n\nThus are kingdoms here undone: not by steady design, but by passion and cunning opportunism. Even the stratagems of kings in Far Taychend resemble intricate games, played with lives as pieces.\n\nTruly, these are a people of boundless craft, if not restraint.\n\nYour faithful servant,\nArmand sil Galvin”"
 G71_feign_death_effect_1_ct:0 "§Y[G52.GetName]§!'s opinion of §Y[Root.GetName]§! will change by §G+50§!. This modifier will disappear if §Y[Root.GetName]§! declares war on §Y[G52.GetName]§!."
 G71_feign_death_effect_2_ct:0 "§Y[G64.GetName]§!'s opinion of §Y[Root.GetName]§! will change by §G+50§!. This modifier will disappear if §Y[Root.GetName]§! declares war on §Y[G64.GetName]§!."

 G71_flow_of_river_flow_of_riches_title:0 "Flow of River, Flow of Riches"
 G71_flow_of_river_flow_of_riches_desc:0 "“My beloved Queen,\n\nTaychend is a land beyond imagination. Everything in Aelantir takes on a quality larger than life, from its cities to its wilds. But I write to you today of Taychend's rivers.\n\nEach of the rivers of Taychend surges with a might that meets the fiercest rivers of Lencenor, and along them are ferried riches from all across the continent, from mysterious carvings of exotic wood to sumptuous dyes to fascinating precursor relics. And at the end of the eastern-flowing rivers of Taychend is Port Orenkoraim, whose bazaars burst with the merchants of a continent.\n\nI have followed the Cannorian signposts to many fascinating sellers of goods, and all of them were selling for prices far, far below what their goods might sell for in Anbenncóst. I almost felt sorry for them, that they did not know of anything beyond their land. And yet it occurred to me, my Queen, that their loss might be Lorent's gain.\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_flow_of_river_flow_of_riches_1_ctt:0 "All owned provinces in the §YNanru Nakar§! Area have unrest lower than §Y1§!."
 G71_flow_of_river_flow_of_riches_2_ctt:0 "All §YCenters of Trade§! in the §YKalavend§! Trade Node are at least of level §Y2§!."

 G71_where_courage_fails_title:0 "Where Courage Fails"
 G71_where_courage_fails_desc:0 "“My beloved Queen,\n\nI write to appraise Your Majesty of developments in Taychend. We are not the only foreign powers interested in the continent, and until recently, one of our competitors was the state of Ameion, one of the Three Empires. Ameion is a curious state - they almost resemble primitive Cannorians in the form of their government.\n\nFor decades they fought against the other two empires of Larankar and Orenkoraim for control over Taychend: they sought to extract its wealth and convert the Taychendi to their religion, which appears to worship deceased philosophers.\n\nThey fought with valiant savagery for years on years, but their valor was not the equal of the walls of Orenkoraim. The kings of Orenkoraim sent forth troops when it was safe and withdrew behind their walls when it was not, and by this most elementary prudence have broken the proud Empire of Ameion. And so, of the Three Empires of Taychend, only Orenkoraim remains. \n\nThey seek to unify Taychend under their banner, and if they do, all the exotic goods and relics of Taychend will accrue to the kings of Orenkoraim as controllers of their kingdom. Indeed, they would belong to any possessed with the foresight to command that mighty kingdom.\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_where_courage_fails_trigger_ct:0 "One of the following must be true:\n   Won a war against §YAmeion§! or its successor state in the last §Y20§! year(s).\n   §YAmeion§! or its successor state do NOT exist."
 G71_where_courage_fails_effect_ct:0 "Replace the '§YNayak Resilience§!' modifier in [6559.GetName] with '§YLegacy of Wallmaker§!' country modifier until the end of the game, giving the following effects:\nFort Defense: §G+30.0%§!\nGarrison Size: §G+30.0%§!\nGarrison Army Damage: §G+30.0%§!\n\n§Y[Root.GetName]§! gains a permanent claim on every province with §Y[G52.GetAdjective]§! cores in the §YTaychend§! Subcontinent."

 G71_slay_the_beasts_title:0 "Slay the Beasts"
 G71_slay_the_beasts_desc:0 "“My most noble Emperor,\n\nAfter gaining entry to the port of Orenkoraim through its walls, I was granted an audience with its [Root.Monarch.GetTitle]. His court glittered in splendor! There were servants to fan him, the spices of exotic lands, and he sat on a throne made of the relics of ancient days. He asked me questions through the manservant I hired by the docks to interpret, and I told him of the power of the Empire of Anbennar - of the prestige of Anbenncóst, the power of our own Pearlsedge, and the riches of Damescrown. His eyes lit up at the mention of riches. He is a clever one, as he would have to be to carve himself a place in a land such as this.\n\nIn return, he told me a story of the lands of Taychend. Apparently, centuries ago along the Veyii Mountains, there were wolf-kings that ruled the lands they call Uesrennu. Their bands of warriors stalked the hills with a terrible ferocity, until a band of men from the port of Orenkoraim went to meet them. Their clash was bloody, and fierce, like in days of old. But in the end it was Orenkoraim that emerged victorious, and their warriors howled at the moon just as the wolf-kings once did.\n\nThere is a wild poetry in such tales, as old as the continent itself. But civilization speeds me on my path, and I must press deeper into the lands of Orenkoraim. I will report once again once I hear more of what Far Taychend has to offer.\n\nYour faithful servant,\nArmand sil Galvin”"
 G71_slay_the_beasts_fct:0 "If §Y[J78.GetName]§! is a subject of §Y[Root.GetName]§!:"
 G71_slay_the_beasts_sct:0 "If §YUesrennu§! area is owned by §Y[Root.GetName]§!:"
 G71_slay_the_beasts_se:0 "Remove '§YAutonomy Decreased§!' and lose §G-10.00%§! Local Autonomy in §YUesrennu§! area."

 G71_tale_of_three_fools_title:0 "Tale of Three Fools"
 G71_tale_of_three_fools_desc:0 "“My most noble Emperor,\n\nAt long last, I have arrived at the fabled city of Nanru Nakar. Its spires climb toward a destiny I cannot see, and I was struck with awe at its decadent beauty when I passed through its gates. Then Harold beckoned, and he led me below to the reverse of the city. Beneath soaring marble lay caverns of the poor and desperate, their lives etched in soot and shadow. There we went to the home of an old woman. She told us the story of Nanru Nakar through the shapes she weaved in the fire.\n\nOnce, there were three fools. They were the brothers Mudaliar, and each of them sought what the other had. And so they squabbled in the ruins of their ancestors, year in and year out. But each of them was too stupid to claim his birthright, and so the city decayed. This is when the kings of Orenkoraim came to the city. The oldest brother sought respect, so they lied to him. The middle brother sought riches, so they bribed him with baubles. The youngest brother sought power, so they overpowered him. And this is the story of Nanru Nakar, and how the kings of Orenkoraim came to add it to their empire. \n\nSo it is in Taychend: kingdoms rise not by right but by will, and even statecraft is another story told by the fireside.\n\nYour faithful servant,\nArmand sil Galvin”"
 G71_tale_of_three_fools_ctt_1:0 "Have at least §Y100.00§!¤ for every province owned by Subject of §Y[Root.GetName]§! in the §YNanru Nakar§! Area."
 G71_tale_of_three_fools_ctt_2:0 "§Y[Root.Monarch.GetName]§!'s Glory Level is at least §YGrowing Legend (Level 3)§!."
 G71_tale_of_three_fools_effect_ct:0 "Lose §R-100.00§! Crowns for every province owned by Subject of §Y[Root.GetName]§! in the §YNanru Nakar§! Area.\nCede provinces owned by Subjects of §Y[Root.GetName]§! in the §YNanru Nakar§! Area to §Y[Root.GetName]§!."

 G71_defy_the_defier_title:0 "Defy the Defier"
 G71_defy_the_defier_desc:0 "“My beloved Queen,\n\nAs I have travelled across Taychend, I have collected the stories of the Taychendi, in the hopes there might be value in the tales they pass back and forth that might help us learn more of Aelantir. There is such art to Taychendi storytelling. They speak unfettered by rationality, so that their words might drift into the realm of the sublime.\n\nI have heard one such tale that may be of interest to the Crown of Lorent. In days gone by, there was a king named Erankar, who was convinced that he alone had the power to defy fate. And in this spirit he went to war against Orenkoraim, which was one of the Three Empires of Taychend at the time. They retreated behind their walls, as was their habit. Erankar the Defiant circled them with his vast army, crowing to the soldiers of Orenkoraim to come out and fight. He paused for a moment to deliver a boast. It was then that an unknown archer, who could defy nothing, strung his bow and shot brave Erankar right through the neck. He bled out in front of those city walls.\n\nThis is a tale of a foolish man, if it is true, but it is also a tale of what happens when superstition meets steel. Perhaps we could make use of it.\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_defy_the_defier_fct:0 "If §Y[G64.GetName]§! does NOT exist:"
 G71_defy_the_defier_fe_ct:0 "Remove all cores of §Y[G64.GetName]§!."
 G71_defy_the_defier_sct:0 "If is at war with §Y[G64.GetName]§!:"
 G71_defy_the_defier_se_ct:0 "White Peace with §Y[G64.GetName]§!.\nAll possible countries that can be released from §Y[G64.GetName]§! are released.\nAll §Y[G64.GetName]§! subjects become independent.\nCurrent Ruler of §Y[G64.GetName]§! will die.\nAll countries with their capital in the §YTaychend§! Subcontinent will lose §G-50.00§! Aggressive Expansion against §Y[Root.GetName]§!."

 G71_the_end_of_the_world_title:0 "The End of the World..."
 G71_the_end_of_the_world_desc:0 "“My most noble Emperor,\n\nFrom port, my manservant and I continued onwards to Katelperai, at the farthest edges of the lands of Orenkoraim. I arrived at the city, and all I saw around me was wretched poverty. Beggars lay around me on rotted boards. I gave bread to one of them, so that he might see the benevolence of the Crown of Pearlsedge. I was preparing to turn around and head back for port when my manservant tugged on my sleeve, and directed my attention upwards. I saw glory.\n\nThe city of Katelperai was constructed like a great ladder, as though its gleaming rungs would continue upwards until I could sit on a terrace built atop the sun. And so, the two of us began to climb. We climbed past the ruinborn at work, and at play, and each level of the city greeted me with a grandeur I dared not believe. The rotted wood of the beggars' floors gave way to stone, which gave way to iron, and at last atop the city I looked out on a pavilion where the wealthy and powerful of the city lived. It was made of gold, and my awestruck feet stumbled towards its balcony. I beheld acres and acres of unexploited land, far from the dangers of the Effelai. If I were to fall from those heights, I would find myself in a land beyond time.\n\nFar Taychend is a land of contrasts, my Emperor: it is sunk in misery yet crowned in splendor. I will explore it all for you.\n\nYour faithful servant,\nArmand sil Galvin”"

 G71_building_to_last_title:0 "Building to Last"
 G71_building_to_last_desc:0 "“My beloved Queen,\n\nThe kingdoms of Taychend are as numerous and varied as the free cities of Anbennar, and they do not last nearly as long. In war after war, the Taychendi water their soil with blood, even to the point of drowning it. The Taychendi fight with beauty, it is true, but that beauty is fleeting on this savage continent.\n\nAll these beauties are fleeting, except for one. The kingdom of Orenkoraim does not fight like the others: it conserves as much of the lands of its enemies as it can in every engagement it is forced to take, and then it builds them into places from which it can consolidate its power. For Taychendi, it really is quite impressive.\n\nIt is also intriguing. Orenkoraim has built power with which it might tame the kingdoms of Taychend. And power does not care by whom it is wielded, only that it is.\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_building_to_last_effect_ct:0 "Every province in the §YKalavend§! Region has its Local Autonomy set to §Y0.0%§!."

 G71_and_what_lies_beyond_title:0 "...and What Lies Beyond"
 G71_and_what_lies_beyond_desc:0 "“My most noble Emperor,\n\nI have walked along the coast of Taychend, and seen the ships that ply its waters, flitting from port to port. They are manned by the ruinborn, who sail these waters in the drowsy heat of Aelantir as though the tides were their inheritance. They are fortunate to have such a place to call home.\n\nBut I digress, my Emperor. Eventually the heat on the coast came to be too much for me, and I had to sip from my canteen for a while while Harold constructed a lean-to for me to rest in. And there on the waters of Taychend, I saw the most blessed sunset I have witnessed in all my years. We stood at the point where sand became sea, and upon the orange waters I saw ships larger than any I had seen before. It appeared as though the Taychendi were attempting to emulate us! Those ships could only have been constructed to push beyond their gentle, loving coasts into the vast and merciless deep. I wish I could have warned them. The open sea is no tutor for dreamers, and its mistakes are not easily learned from.\n\nI regret to inform Your Majesty that those ships are now surely claimed by the abyss.\n\nYour faithful servant,\nArmand sil Galvin”"

 G71_glory_beyond_our_shores_title:0 "Glory Beyond Our Shores"
 G71_glory_beyond_our_shores_desc:0 "“My beloved Queen,\n\nI received a report the other day that compelled me to laughter: the Taychendi have taken to the sea. Ships of Orenkoraim have docked at Turtleback Isle, though their purpose seemed less commerce than curiosity, for they spent more time marveling at the works of Cannorian industry than conducting trade. The mayor is jubilant; they paid for provisions in gold, and it is evident they do not value the metal as the civilized world does.\n\nYet this development presents an opportunity for the Crown of Lorent. Even our older vessels would seem marvels of ingenuity beside theirs, and familiarity breeds advantage. And if merchants of Taychend seek entry into Cannorian ports, it follows that merchants of Cannor ought to enjoy equal if not greater privileges within Taychend. Such reciprocity is only just.\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_glory_beyond_our_shores_ctt:0 "Have encountered strangers in the §YTurtleback Isle§! Region."

 G71_plotting_cannorians_title:0 "Plotting Cannorians"
 G71_plotting_cannorians_desc:0 "[Root.GetPlottingCannoriansText]"
 G71_plotting_cannorians_uncertain_text:0 "“My beloved Queen,\n\nA dangerous mood has taken hold in Port Orenkoraim. One of the Cannorian Taychend Companies and several allied merchant houses are no longer content merely to conduct trade. Their factors meet secretly with Taychendi courtiers, money passes through discreet hands, and officials have begun to speak of the need for a more orderly government.\n\nFrom what I can gather, they intend to preserve the [Root.Monarch.GetTitle] as a symbol while placing the affairs of state under Company supervision. The court has begun to take notice, and Orenkoraim now waits to see whether the merchants will seize the palace or decorate its streets with their corpses.\n\nLorent has no part in their design, but we cannot ignore its consequences.\n\nYour servant of Loriel always,\nVaril sil Rubenaire”"
 G71_plotting_cannorians_taychendi_text:0 "“To the boys in the lodge,\n\nIt's been difficult, dealing with the aftermath of the Merchants' Coup. I just arrived on shore, but even stepping off the docks every street corner is decorated by the corpse of an executed plotter. I won't shed any tears: I never liked those lot. The merchants back in Verne were always greedy, grubby sorts, more interested in finding gold than finding glory. But if there is one thing the people here understand, it is that Taychend is not a land of gold, it is a land of glory!\n\nI've stopped in Port Orenkoraim to stock up on supplies for my journey inland, but I couldn't buy everything I wanted: the [Root.Monarch.GetTitle] has imposed Cannorian purchase restrictions, you see. I'll have to get the really good stuff at a less regulated port, but I'm not worried. The first explorers of Taychend ventured forward into these lands with nothing but piss and vinegar, and if they could do it, I can too.\n\nClear off some space on the adventuring wall: I'm bringing home some trophies!\n\nOnward to glory,\nSandro of Redcliff”"
 G71_plotting_cannorians_cannorian_text:0 "“Our Most Valued Shareholders,\n\nWe are pleased to report that the situation in Taychend has been satisfactorily resolved. Orenkoraim is now administered by men of foresight and discipline. The [Root.Monarch.GetTitle] has recognized that Cannorian partnership offers the surest path to stability and prosperity, and has welcomed our advisors into court and council. Henceforth, guidance on matters of statecraft, finance, and commercial regulation will be provided under Company supervision.\n\nPreliminary projections from the Damescrown Taychend Company remain strong. The government shall now function with industrial precision. Taychend will be into an integrated system designed to convert land, labor, and relics into measurable return.\n\nNaturally, the [Root.Monarch.GetTitle] will retain sufficient pageantry to ensure local confidence. Visible sovereignty, properly managed, remains a useful instrument. It is only prudent that the Taychendi continue to esteem their ruler and, by extension, those whose counsel sustains the throne.\n\nWe thank you for your continued confidence. Taychend is no longer a liability of uncertainty, but an asset under direction.\n\nWith appreciation,\nOlor síl Aramar”"
 G71_plotting_cannorians_ctt:0 "Have dealt with the §YPlutocratic Coup§! of the §Y[Root.GetBurghersName]§!."
 G71_plotting_cannorians_fct:0 "If §pCannorians§! have been favoured in the §YPlutocratic Coup§!:"
 G71_plotting_cannorians_fe_ct:0 "Add or increase §YElven§!, §YDwarven§!, §YGnomish§! and §YHalfling Minority Size§! in §Y[6559.GetName]§!.\nGain §GLarge Tolerance Increase§! of §YElves§!, §YDwarves§!, §YGnomes§!, §YHalflings§! and §YHumans§!."
 G71_plotting_cannorians_sct:0 "If §TTaychendi§! have been favoured in the §YPlutocratic Coup§!:"
 G71_plotting_cannorians_se_ct:0 "Gain §Y10.0%§! Crownland."

 G71_branching_1_title:0 "Branching Mission"
 G71_branching_1_desc:0 "[Root.GetG71BranchingMissionsDesc]"
 G71_branching_2_title:0 "Branching Mission"
 G71_branching_2_desc:0 "[Root.GetG71BranchingMissionsDesc]"
 G71_branching_3_title:0 "Branching Mission"
 G71_branching_3_desc:0 "[Root.GetG71BranchingMissionsDesc]"
 G71_branching_missions_not_revealed_desc:0 "This is a §YBranching Mission§!. Its requirements and effects will depend on what the winds from beyond the eastern sea carry to our shores."
 G71_branching_missions_revealed_desc:0 "This is a §YBranching Mission§!. Its requirements and effects will depend on our choice in the §YPlotting Cannorians§! mission."

 #CANNORIAN BRANCH
 G71_a_model_partnership_title:0 "A Model Partnership"
 G71_a_model_partnership_desc:0 "“Our Most Valued Shareholders,\n\nIt is my pleasure to report that the Damescrown Taychend Company has exceeded even its most ambitious forecasts. Enclosed income statements for the last four cycles reflect sustained expansion in revenue and market cap. This performance rests upon two pillars: Cannorian partnership and the steady progress of our civilizing mandate.\n\nWith Taychend secured under reliable supervision, we have entered into equity arrangements with interested nations in Cannor, as our respective ambitions are complementary rather than competitive. Orenkoraim's forward operations are expected to extend influence further into Taychend and, where prudent, into the Effelai, whose untapped material reserves present further opportunity.\n\nThe Taychendi assimilation program continues to increase administrative efficiency. While the ruinborn may never be fully civilized, incremental cultural alignment has already reduced compliance costs. In collaboration with foreign preachers, we are facilitating religious instruction to reinforce social stability and productive discipline.\n\nCivilization, properly structured, is both a moral good and an operational advantage.\n\nWith appreciation,\nOlor sil Aramar”"
 G71_a_model_partnership_ctt:0 "No country in the §YSouth Aelantir§! continent have higher monthly income than §Y[Root.GetName]§!."
 G71_a_model_partnership_cti:0 " countries with capitals on the §YCannor§! continent, that follow a §YCannorian§! Religion have opinion modifier §YImproved Relations§! of at least §Y90§!."
 G71_a_model_partnership_effect_ct:0 "Allow the formation of the §YTaychendi Administration§!."

 G71_goods_of_taychend_title:0 "Goods of Taychend"
 G71_goods_of_taychend_desc:0 "“Our Most Valued Shareholders,\n\nThe Damescrown Taychend Company now exercises full oversight of Orenkoraim's principal asset streams. Post-acquisition review has identified substantial inefficiencies within crown-held plantations and manufactories. These estates, long managed by custom and sentiment, will now be reorganized under Cannorian best practice and modern principles of production science.\n\nTechnical specialists from Damescrown are en route to implement standardized processes, optimize throughput, and restructure labor allocation. Conservative projections indicate a 350% increase in output across crown properties within three fiscal cycles. Capital exposure remains negligible: all modernization costs will be borne by the Crown of Orenkoraim, alongside a competitive advisory retainer.\n\nOur objective is total integration of Taychend into the Cannorian commercial sphere. Spice, glass, and relics alike will be conveyed across the Lament to markets where their value may be properly realized. Taychend will no longer produce for subsistence or spectacle. It will produce for return.\n\nWe thank you for your continued confidence as we transform latent abundance into dividend-bearing enterprise.\n\nWith appreciation,\nOlor sil Aramar”"
 G71_goods_of_taychend_ctt:0 "Have used §YExploit Development§! at least §Y7 times§! in provinces producing one of the following Trade Goods (currently: §Y[Root.g71ExploitedDevelopment.GetValue]§!):\n   §YDyes§!\n   §YGems§!\n   §YPrecursor Relics§!\n   §YSpices§!\n   §YTea§!"
 G71_goods_of_taychend_effect_ct:0 "Distribute §Y7§! £icon_production_in_text£ among owned provinces with a §YProduction Building§!."

 G71_an_evolving_crown_title:0 "An Evolving Crown"
 G71_an_evolving_crown_desc:0 "“To the shareholders of the Damescrown Taychend Company,\n\nSince I was young, I have marvelled at the wonders brought to my home by Cannor, and the ingenuity displayed by its people. I have long wished to address your august continent myself, but alas I could not, for I do not speak its language. But now my dear friend Olor sil Aramar has aided me in drafting this letter, and my heart bursts with pride. \n\nI write to you today to inform you of the changing role of the [Root.Monarch.GetTitle] of Orenkoraim. Once, I had to administer much of this land alone, for I did not have advisors I could trust. But now, the Company's oversight permits me to shift my focus to my passions of military matters and local concerns. I marvel at the prosperity the Company has brought to Orenkoraim, which is why I am certain the realm shall only improve under their total control of the realm's commercial and administrative affairs.\n\nI am honored to formalize my association with the Company. The royal treasury will now be filled from Company coffers for my services, and this will ensure the traditions of my people live on. In closing, I can only thank the shareholders of the Company for their foresight and benevolence, and I hope for many years of collaboration between us.\n\nFrom my people to yours,\n[Root.Monarch.GetName]”"
 G71_an_evolving_crown_fct:0 "If §Y[Root.GetName]§! has NOT embraced §YColonialism§!:"
 G71_an_evolving_crown_effect_ct:0 "In the '§YElection!§!' event for the §YTaychendi Administration§!, the §YKings of Orenkoraim§! will replace the §YLocal Candidates§!."

 #TAYCHENDI BRANCH
 G71_cowards_victory_title:0 "Coward's Victory"
 G71_cowards_victory_desc:0 "“To the boys in the lodge,\n\nI've travelled along the coasts. I've climbed the mountains of Taychend, and hacked my way through its jungles. Everywhere I go, all I see is the forts of Orenkoraim, with their teal flapping from every banner. \n\nI've been reading the history books, and it's occurred to me how strangely the dice have come up in Taychend. And yet, there's a sort of logic to it. If the kings of Orenkoraim are said to be cowards, now the frontiers with the fighting are far away from Port Orenkoraim. If the kings of Orenkoraim fear conflict, this state of things is the goal of their efforts: they have the largest army, and it's hard to hurt people surrounded by troops.\n\nIt works out just fine for us, of course. The [Root.Monarch.GetTitle] needs people to conquer out to foreign lands and to explore the strange and wild mysteries of Taychend. We adventurers are not the type to sit comfortably in palaces, and Taychend may be many things, but comfortable is not one of them.\n\nI wouldn't have it any other way.\n\nOnward to glory,\nSandro of Redcliff”"
 G71_cowards_victory_1_ctt:0 "Have the biggest army in the §YTaychend§! Subcontinent."
 G71_cowards_victory_2_ctt:0 "No country in the §YTaychend§! Subcontinent is a valid rival for §Y[Root.GetName]§!."
 G71_cowards_victory_effect_ct:0 "\n[Root.Monarch.GetName] gains §G1§! £mil£ per §Y6 Fort Buildings§! owned by §Y[Root.GetName]§! or its Subjects, up to a maximum of §G6§! £mil£ at §Y36 Fort Buildings§!."

 G71_invade_the_highlands_title:0 "Invade the Highlands"
 G71_invade_the_highlands_desc:0 "“To the boys in the lodge,\n\nThe rumors from the Wyvern's Lodge didn't lie about Taychend. I've just gotten here, and already adventure peeks around every corner! \n\nI've joined a company of travelling mercenaries from Orenkoraim, who have tramped north to fight in Orenkoraim's war in the Larankhara Highlands. There aren't many of us Cannorians in the company, but that's all right: it just makes the conversation more interesting. \n\nOne topic that we while away the hours on is the [Root.Monarch.GetTitle] of Orenkoraim: their line has never been the fighting sort, but all the same they have amassed a legend as both brilliant strategists and master tacticians. My mates in the company have been telling me stories about the [Root.Monarch.GetTitle]. Not very many of them sound true, but I've made up a few of my own: you don't come up in Verne without learning how to brag with the best of them.\n\nWe've almost reached the Larankhara, and if any of Larankar remains by the time I follow the winds of adventure off elsewhere, I'll eat my hat. Look for me in the papers!\n\nOnward to glory,\nSandro of Redcliff”"
 G71_invade_the_highlands_ctt:0 "§Y[Root.Monarch.GetName]§!'s Glory Level is at least §YDivine Monarch (Level 4)§!."
 G71_invade_the_highlands_effect_ct:0 "\nThe '§YClaim our Glorious Destiny§!' decision can be enacted even if the required provinces are owned by our subjects. Upon unification, any such subjects will have their map color changed to §Y[Root.GetName]§!'s."

 G71_bind_them_in_gold_title:0 "Bind Them in Gold"
 G71_bind_them_in_gold_desc:0 "“To the boys in the lodge,\n\nI've arrived in the city of Nanru Nakar, and it's just as amazing as I thought it would be. The riches of the city pour into the land beyond, and I could watch the artisans of the city work for hours. From what I've heard, all the wealth of this city goes to one purpose: imperial glory.\n\nThe kings of Orenkoraim are like any of the others in Taychend, and have subjects who they task with going out to achieve their conquests for them. But the kings of Orenkoraim are frightful sorts, and they fear their subjects. Orenkoraim has great wealth, and their subjects have great greed: the solution is obvious. Orenkoraim lavish their subjects in gold, and in return they don't make trouble and they do all the fighting to boot. It's a strange perspective that these kings have, given that the fighting is the best part.\n\nThere's such great wealth here that I've been able to refill my coffers by doing odd jobs for the city: questing into its underground, killing bandits, and so on. But I've almost got what I need to buy a fresh round of supplies, and soon I will sally forth from the city to the rest of Taychend.\n\nAdventure waits for no one!\n\nOnward to glory,\nSandro of Redcliff”"
 G71_bind_them_in_gold_ctt:0 "Have at least §Y100.00§!¤ for every Subject, up to a maximum of §Y1000.00§!¤ at §Y10§! Subjects."
 G71_bind_them_in_gold_cti:0 " Subjects of §Y[Root.GetName]§!:\nAll of the following must be true:\n  Is a §YMarch§!.\n  Total development at least §Y70§!.\n  Liberty Desire less than §Y50.00%§!."
 G71_bind_them_in_gold_effect_ct:0 "Gain §G40§! Military Power and lose §R-100.00§! Crowns for every Subject, up to a maximum of §G400§! Military Power and §R-1000.00§! Crowns at §Y10§! Subjects.\n\nEvery current and future subject of the §YTaychendi Ruinborn Elf§! Primary Culture gets '§YCult of Golden Shackles§!' until the end of the game, giving the following effects:\nLiberty Desire: §G-25.00%§!\nDiscipline: §G+5.0%§!"

 #EVENTS
 flavour_G71.1.t:0 "The Coward-King"
 flavour_G71.1.d:0 "The saber of Aldatam was truly marvelous, with a silver hilt and a blade polished every morning, and he enjoyed its weight whenever there was nobody nearby whom he might be expected to strike. From his balcony, he watched the setting sun turn the sky red. It looked rather like Taychend after a battle, though it was much more pleasant when rendered in paint.\n\nAltdam had spent the afternoon surrounded by artists. A musician played softly beside the throne, while a painter worked upon a portrait in which the king appeared taller, broader, and considerably less frightened than he truly was. This was what Altdam liked about art. A painted king could stand amid charging soldiers without being trampled, and could gaze upon an assassin without worrying where the assassin had hidden his knife.\n\nYet not even music could silence the reports from beyond his walls. Larankar marched against its enemies. Ameion sent warriors north. Warlords burned villages, kings were dragged from palaces, and every messenger seemed to bring news of another ingenious way in which a man might die. Altdam had no wish to join them. This was not cowardice, he told himself. A king belonged to his realm, and preserving his life was therefore an act of duty. Better to bow for an hour than to lie still forever.\n\nHis eyes turned eastward, toward Kottar Orenkoraim and the sea beyond it. Somewhere past that horizon lay other shores, other ports, and perhaps other palaces. If the lands of Katalperai belonged to him, there would always be another harbor to shelter in and another throne from which to rule. Other men could win those lands for him; there was no shortage of men who mistook an early death for glory.\n\nThe sun disappeared behind the hills. Altdam tightened his grip on the saber and wondered whether a king who always kept another shore ahead of him ever truly had to face his end."
 flavour_G71.1.a:0 "... perhaps there is a way to outrun death?"
 flavour_G71_1_a_ct:0 "If §Y[G52.GetName]§! or §Y[G64.GetName]§! declares war on §Y[Root.GetName]§! while this modifier is active, the war will immediately end in a §YWhite Peace§! and §Y[Root.GetName]§! will become the attacker's §YSubject§!.\nThrough the §YMission Tree§!, this modifier can be gradually weakened and eventually transformed into a boon."

 flavour_G71.2.t:0 "Beyond the Safe Horizon"
 flavour_G71.2.d:0 "King Altdam sat in his grand throne, and reflected on how wonderful it was that he faced the door to the throne room, so that he could see everyone who came into and out of the room. Why couldn't the entire world be like this? And as King Altdam sat some more, his thoughts turned to the place that the orders from his throne room ruled. \n\nThere was the mountain pass to the Effelai. Beyond were things he had no wish to see clearly, but his side of the mountains was very safe: at least he knew for certainty that there would be no raiders coming from beyond the mountains. To his west were other warlords, but they did not trouble him: they knew that King Altdam was more lordlike than warlike, and could be relied on to give them his silver for his safety. Altdam was poorer for it, but he was better off poor than dead. \n\nBut to the east was opportunity. Here was Taychend’s door: Kottar Orenkoraim, and beyond was the sea, through which anybody might enter the throne room of Orenkoraim. People came to his audience every day, and his guards made them pay for the privilege. And so it was in Taychend: anybody with the right guards who held the right swords in front of the port controlled its entry, and it certainly was a wide world.\n\nAnybody could walk through the door, Altdam thought. Perhaps they would be powerful, or rich. Perhaps they could do his fighting for him."
 flavour_G71.2.a:0 "All he had to do was find them."

 flavour_G71.3.t:0 "Foreigners on Foreign Shores"
 flavour_G71.3.d:0 "The captain braced himself as another wave battered the side of his ship’s hull, and thought on how soon it would be time to retire. The [Root.Monarch.GetTitle] of Orenkoraim needed men to explore outward for glory, certainly, but his humble craft had taken enough of a beating over the years that he’d be lucky to sell it for its scrap value. He saw a rock off the side of the deck, and as he was about to yell at the cartographer to make note of the rock, a shadow cast itself across the deck of the ship. \n\nThe captain looked up. The cartographer looked up. The sailors stopped their work, and when they saw what they beheld they dropped their tools in shock. It was a ship five times larger than theirs, and it was crewed by a strange race of man, with deathly pale skin.\n\nOne of the things looked back: they had been noticed. So the captain put on his finest hat, and he yelled up to the ship. “Hello! Hello! Do you know where you are?” The captain adjusted his hat again: a silence had fallen over the ship. \n\nAnd one of the pale men yelled back, but the sounds he made weren’t language at all. The captain swore. “Taychend! This is Taychend! If you go-” The captain flailed his arms back in the direction they came. “-THAT way, there will be land! Land! Orenkoraim!” He pointed to himself. “Orenkoraim! We are Orenkoraimi!” He kept moving his arms, and shouted. “Orenkoraim! Orenkoraim! Orenkoraim!”\n\nThe pale men looked at one another. A long moment passed. Then one of them slowly raised his arm and pointed in the same direction the captain had. "OR - nar - kor - maim," he said with no small amount of pride. Progress. The captain redoubled his gestures, and soon two of them were mimicking him. The great ship turned like a sleeping giant, and pointed itself in the approximate direction of where the captain had come from.\n\nThe crew watched them go in silence. The captain watched too, and found that his thoughts had moved on from retirement. If a ship that size was out here, it must be carrying quite a cargo. He wondered what a new ship might cost."
 flavour_G71.3.a:0 "Let us see what this encounter will bring..."

 flavour_G71.4.t:0 "Cannorians in Taychend"
 flavour_G71.4.d:0 "Three men dressed in the latest fashions of Cannor entered the hall of the [Root.Monarch.GetTitle], and the court stopped its conversation to gawk at them. They were led by a ruinborn dressed in blue, who performed all the necessary gestures to begin an audience with the [Root.Monarch.GetTitle]. Cautiously, hesitantly, the three men imitated him. The [Root.Monarch.GetTitle] addressed them. “Your ship is grander than even those of the far-off Kheionai. You do not bear the look of ones from here, and you certainly have not come from the Effelai. From where, exactly, do you hail?”\n\nThe men stared back at him blankly. They talked among themselves for a while, and then reached a consensus. The tallest stepped forward, and produced an image by magic which, while crudely rendered and somewhat fuzzy, was undeniable: it was the lands of Orenkoraim. They shone a brilliant blue. But then the image grew smaller, and smaller, and was subsumed by an ocean. The ocean wore on and on, until eventually the picture displayed a continent which was almost split in two, with an island in the middle. It glowed white, and a dove perched on the island. These were the lands of the foreigners? The court murmured to itself.\n\nFrom the continent, small ships in gold sailed across the waves, and came to Orenkoraim. Men in gold disembarked from them to Kottar Orenkoraim, bearing crates they brought to market. The crates held such strange objects — armor that caught the light like a mirror, and long tubes of metal. One courtier leaned to another: what are those? A foreigner with a hard look in his eyes lifted one, aimed it at nothing, and it cracked like thunder and sent a ball of metal through the far wall. The silence that followed was complete. Then, in the image, small soldiers raised the tubes, and the blue of Orenkoraim began to grow - past the rivers, past the mountains, past Larankar itself, until it covered everything the court knew.\n\nThe [Root.Monarch.GetTitle] watched with rapt interest, and the court rejoiced that it was their nation that the men with ships came to first. And in their rejoicing, they did not notice that the blue of the country had brightened, until it was almost white."
 flavour_G71.4.a:0 "You can entertain us, Kentorians."
 flavour_G71_4_a_ct:0 "Discover the capital of the Cannorian country we encountered on §YTurtleback Isle§!."

 flavour_G71.5.t:0 "Cannorian Companies Established in Kottar Orenkoraim"
 flavour_G71.5.d:0 "The ship had come from Damescrown. It had only stopped once along the way to Port Orenkoraim in the harbors of Endralliande. The journey to Taychend was once hazardous, but by now it had been made many times before, and its captain directed the crew to dock with an assurance that was almost blithe. The ship docked at the largest dock, for it was only these docks that could accommodate the ships that came from across the sea to trade. \n\nThe gangplank came down, and an inspector with round ears strode onto the ship from Damescrown. It was only Cannorians who knew the trade from Taychend, the [Root.Monarch.GetTitle] reasoned, so it was only Cannorians who knew how to inspect it. But these were Cannorians of the most loyal disposition, or so the crown of Orenkoraim was lavishly paying them to be. The inspector walked in a circle around the ship, made some marks on a form, and then departed. He did not open any of the crates.\n\nSo the ship from Damescrown was free to load its goods into Port Orenkoraim, which its crew did without a wasted movement. It was the same cargo as always: more guns, more materials and men for the headquarters of the growing Cannorian companies, and instruments of Cannorian craft to be traded on. The men from the ship from Damescrown hauled their crates through the bazaar, where they were surrounded by others of their kind: this part of the port was rarely trafficked by the Taychendi anymore. Past the Cannorian signs and the Cannorian shops they walked, until they had delivered their goods to the office of some kind of a guild. They then collected a cargo of raw resources, and departed on their ship. The inspector did not bother to come this time.\n\nSo the ship departed back to Damescrown. Even as it left its mooring, a ship painted with the starburst rose of the Lorentaine Metals Company had taken its place."
 flavour_G71.5.a:0 "We value our Cannorian allies."
 flavour_G71_5_a_ct:0 "Rename the §Y[Root.GetBurghersName]§! Estate to §YCannorian Companies§!.\n\nUnlock the '§YCannorian Investments§!' estate privilege for the §YCannorian Companies§!, which does the following:\n§YEffects:\n§!Gain the following effects for each qualifying country, up to §Y4§!:\n  Yearly Innovativeness: §G+0.05§! to §G+0.20§!\n  Mercenary Discipline: §G+1.3%§! to §G+5.0%§!\n\nA country qualifies if its capital is on the §YCannor§! continent and at least one of the following is true:\n  Has opinon modifier §YImproved Relations§! of at least §Y50§!.\n  Is allied with §Y[Root.GetName]§!.\n§YModifiers:§!\nDiplomats: §G+1§!\nEnvoy Travel Time: §G-25.0%§!"

 flavour_G71.6.t:0 "Creed Worth Investing In"
 flavour_G71.6.d:0 "The representative of the ATTC arrived before the throne accompanied by clerks carrying carefully prepared folders. He ordered the contents of the folders to be shown to the [Root.Monarch.GetTitle] and started his speech: “Your Majesty, religion is too often presented as a matter of faith. This unnecessarily sentimental outlook on the matter of spiritual fails to acknowledge that faith is an investment, and like any investment, it should be judged by its security, expected return, and compatibility with one's existing assets. Orenkoraim has already entrusted its commerce, administration, and future prosperity to Cannorian capital. To leave its soul invested elsewhere creates needless friction. More importantly, the soul is the only asset Your Majesty cannot replace. It would be irresponsible to commit it without first comparing the available opportunities. Naturally, the Company cannot guarantee salvation; no reputable institution would promise returns it cannot audit. We can, however, present six proven alternatives favoured by our investors.”\n[Root.GetG71RegentCourt][Root.GetG71Corinite][Root.GetG71CultOfUelos][Root.GetG71InfernalCourt][Root.GetG71Dalcabba][Root.GetG71Ravelian]\nThe representative closed the final folder. “Truth, Your Majesty, is difficult to price, and eternity provides notoriously delayed reports. Your investors, however, are here now. The only truly imprudent choice would be to leave your soul idle.”"
 G71_regent_court_desc:0 "\nThe Regent Court as proposed by [g71_regent_court_ally.GetName] represents the safest and most diversified option. Its broad pantheon allows worshippers to distribute their devotion among several established gods, each responsible for a different sector of mortal affairs.”\n"
 G71_corinite_desc:0 "\n“Corinite faith of [g71_corinite_ally.GetName] is better suited to aggressive growth. Corin teaches her followers to confront evil rather than hide from it, an unfamiliar principle perhaps, but one that may be delegated to soldiers.”\n"
 G71_uelos_cult_desc:0 "\n“The Cult of Uelos, as proposed by [g71_uelos_cult_ally.GetName] offers a strong maritime position. Uelos is an ancient lord of the sea and placing a port empire focused on overseas trade beneath the protection of a sea god could be a prudent insurance.”\n"
 G71_infernal_court_desc:0 "\n“The Infernal Court provides the most transparent contractual arrangement. [g71_infernal_court_ally.GetAdjective] shareholders say that its patrons offer power, name their price, and expect punctual payment. The risks are considerable, but the Company has always preferred explicit liabilities to concealed ones.”\n"
 G71_dalcabba_desc:0 "\n“Dalcabba from [g71_dalcabba_ally.GetName] constitutes a successful merger of venerable traditions, joining the Khet with reverence for Castellos and Elikhet, the Dead Fathers of humanity. An interesting option and one which would certainly highlight uniqueness of Orenkoraim.”\n"
 G71_ravelian_desc:0 "\n“Ravelianism represents the most modern opportunity, recently embraced in [g71_ravelian_ally.GetName]. One God, one Church, and one God Fragment provide a remarkably centralized structure, while rational inquiry, artificery, and organized charity promise considerable technological and social dividends.”\n"
 flavour_G71.6.a:0 "Orenkoraim's soul belongs to the proven and diversified portfolio of the Regent Court."
 flavour_G71.6.b:0 "Corin shall provide the courage Orenkoraim has so long lacked."
 flavour_G71.6.c:0 "Our fortunes came by sea, and so our faith shall belong to Uelos."
 flavour_G71.6.e:0 "The promised returns are worth the risk of aligning with the Infernal Court."
 flavour_G71.6.f:0 "Let the Dead Fathers watch over the future of our living dynasty."
 flavour_G71.6.g:0 "We shall invest in the One God and the truths yet to be unravelled."

 flavour_G71.7.t:0 "Placeholder"
 flavour_G71.7.d:0 "Placeholder"
 flavour_G71.7.a:0 "Placeholder"
 flavour_G71_7_a_ct:0 "Gain §G+0.0125§! monthly §YVainglory§! per §Y20§! Fort Buildings owned by §Y[Root.GetName]§! or its Subjects up to a maximum of §G+0.0625§! monthly §YVainglory§! at §Y100§! Fort Buildings.\n"

 flavour_G71.10.t:0 "Cannorian Merchants Make Their Move"
 flavour_G71.10.d:0 "When the Cannorians first came to Orenkoraim, we thought their presence was a blessing: they shared their technology with us, and the trade they have brought to us is what has allowed our rise. But the trade has only grown, and the Cannorian population in Kottar Orenkoraim has grown with it, and now they dominate the port’s trade to a degree that has given them great, unchecked power.\n\nThere are rumors that they are soon going to use this power in a bid for dominance not just over the port, but over Orenkoraim itself. We must prepare: it appears our choices have come back to haunt us."
 flavour_G71.10.a:0 "Most troubling..."
 flavour_G71_10_a_ct:0 "A §YPlutocratic Coup§! will happen in approximately §Y6 months§!.\n"

 flavour_G71.11.t:0 "What They Truly Want"
 flavour_G71.11.d:0 "The crown’s advisors have been meeting in secret in an attempt to chart a path out of the current crisis, and they agree that the Cannorians’ greatest strength and their greatest weakness are the same: they cannot see past their greed.\n\nIt is currently the case that much of the goods of Orenkoraim are sold to the Cannorians, simply because they offer the highest price. But the Cannorians will buy from anyone they can make a profit off, and herein lies an opportunity for the crown. If we were to buy the goods of Orenkoraim out from under them, but sell at an even lower price, the Cannorians would surely accept. This would of course mean a financial loss for the crown, but we would make it up in the power we would gain to regulate their trade."
 flavour_G71.11.a:0 "It's way too lucrative!"
 flavour_G71.11.b:0 "Yes, I will gladly buy your 'Precursor Steel', peasant..."

 flavour_G71.12.t:0 "Glory, Not Gold!"
 flavour_G71.12.d:0 "The fighting men of Orenkoraim have seen the plight of the crown, but in an uncommon spur of patriotism have come to pledge their support instead of attempting to extract concessions. Their leaders tell us that the troops are outraged at the slimy dealings of the Cannorians, and itch to take revenge for the economic pain of their households and their nation in the only way they know how: violence. It would be very, very easy to turn a blind eye towards such actions, and if we agree to do so the men would be overjoyed and quite supportive of our cause."
 flavour_G71.12.a:0 "Easy there! No need for violence!"
 flavour_G71.12.b:0 "Loyalty to your [Root.Monarch.GetTitle] will be rewarded!"

 flavour_G71.13.t:0 "Warlords Doubt Ruler"
 flavour_G71.13.d:0 "The balance of power in Taychend is maintained by raw strength, and our subjects are beginning to think that we have no strength left. They see the way that we have rolled over to the Cannorians, and they are beginning to wonder if they might be better off without the protection of such cowards. \n\nDrastic measures might be required in order to keep them in line."
 flavour_G71.13.a:0 "Let them doubt all they want."
 flavour_G71_13_a_ct:0 "§YEvery subject country:§! Gain §R25.0%§! Liberty Desire."
 flavour_G71.13.b:0 "Perhaps they need to be reminded of the hierarchy."

 flavour_G71.14.t:0 "Cutthroats Ravage Ships"
 flavour_G71.14.d:0 "Like any port, Kottar Orenkoraim has its fair share of wharf rats and lowlifes, who have been starved out of their positions by Cannorian competition. In retaliation, they stormed the docks by night and burned down many of the ships in the harbor. Unfortunately, many of those ships were part of the navy of Orenkoraim, which places us in an awkward position. The only way to prevent further raids is to place guards in port to protect the ships, but this would undoubtedly be a capitulation to Cannorian interests."
 flavour_G71.14.a:0 "We still need those ships!"
 flavour_G71.14.b:0 "Of what use are they anyway?!"
 flavour_G71_14_b_ct:0 "Lose §R-20.00§! Crowns for every ship, up to a maximum of §R-400.00§! Crowns at §Y20§! ships."

 flavour_G71.15.t:0 "A Loyal Cannorian?"
 flavour_G71.15.d:0 "There are many types of Cannorians in Orenkoraim, but one we have not seen before is a trader who professes loyalty to the crown. Yet this is exactly what we appear to have happened across: a Moon Elvish trader came to us and has said that his loyalty is to us as descendants of the Precursors rather than the largely human traders who dominate the Cannorian trade. \n\nHe has promised to serve as an intermediary to negotiate the expulsion of the Cannorians from Orenkoraim, but our advisors do not trust him. There is one advisor in particular who claims that the trader is a snake, and undoubtedly a Cannorian plant to bias any potential negotiations in their favor."
 flavour_G71.15.a:0 "I suppose he can help?"
 flavour_G71.15.b:0 "We see right through you, vulture."

 flavour_G71.16.t:0 "Unrest in Kottar Orenkoraim"
 flavour_G71.16.dt:0 "In a grand game of strategy stretching over years, we have whittled down the power of the Cannorians from its apex. They were too greedy to see that their power was waning, but now we are at the end of the game, and the Cannorians have realized that they have been cheated of their prize of Taychend. \n\nThe Cannorians do not have the power they once did, but they are wealthy and numerous. They have hired a large number of mercenaries, and now they and their sellswords have marched from the Cannorian quarters and begun an open coup in one last desperate attempt to cement Cannorian rule.\n\nThey do not realize that although they know much of trade, warfare is our domain: we will crush them like insects, and afterwards we will decorate the city with their corpses."
 flavour_G71.16.dc:0 "We have tried our best to balance between Cannor and Taychend, but it would appear that the balance has finally tipped. The Cannorians are stronger than they have ever been, and our people can clearly see who is winning the struggle for power that by now even the commoners are aware of.\n\nAn anti-Cannorian riot has arisen in [Root.Capital.GetName] led by the craftsmen and traders of Orenkoraim, and they are marching to the Cannorian quarter in a desperate attempt to burn it down. The Cannorians have advised that we do everything in our power to prevent this, and we must accede. If the Cannorian trade goes, all of Orenkoraim will go with it."
 flavour_G71_16_ct:0 "The '§YCurtail the Burghers§!' decision can now be enacted."
 flavour_G71.16.a:0 "You are merely guests. Pray we don't call you interlopers."
 flavour_G71_16_a_ctt:0 "§TTaychendi§! gathered more power than §pCannorians§!."
 flavour_G71.16.b:0 "Cannorians STAY."
 flavour_G71_16_b_ctt:0 "§pCannorians§! gathered more power than §TTaychendi§!."

 estate_disasters.6.orenkoraim:0 "A new day dawns upon [Root.GetAdjective] shores."

 flavour_G71.17.t:0 "A New Day in Taychend"
 flavour_G71.17.dc:0 "At last the unrest is over, and we have emerged victorious. When we first came to Taychend, all we could see was a land of wonder and glory, even if it was a somewhat primitive place. As our explorers crossed the land, they began to discover its vast wealth: it was obvious that Taychend was a continent that brimmed with opportunity.\n\nThe only disagreement was on what type of opportunity that was: should wealth or glory take precedence? But as our companies established themselves, it became more and more obvious that Taychend was too rich to remain in the hands of the Taychendis, and so our most cunning merchants hatched the plan that would become the Merchants’ Coup.\n\nThat plan has succeeded beyond what we could have hoped for. The [Root.Monarch.GetTitle] has been ensnared by links of trade, and [Root.Monarch.GetSheHe] is now our marionette to manipulate how we please. What we please, of course, is profit. The riches of Taychend will flow into our coffers, and the [Root.Monarch.GetTitle] and we will rule together, so long as [Root.Monarch.GetSheHe] remembers who is really in charge. Our administration promises to be profitable."
 flavour_G71.17.dt:0 "At last the unrest is over, and we have emerged victorious. When Cannor first came to our shores, we were blinded by our greed, and could not see the threat they represented to our way of life. In the struggle between wealth and glory, we have mustered the strength to defend the ways of our ancestors: glory has won the day.\n\nWe now are faced with the question of what to do with our defeated foes. There were some in court who argued for the expulsion of all Cannorians, but it was ultimately decided that their trade is too useful to shut down entirely, provided it flows into the right coffers. The Cannorians will stay in Taychend in a diminished capacity, provided that they remember Taychend is for Taychendis and nobody else. \n\nWith the Cannorians put in their place, we are free to look towards the future. Orenkoraim grows stronger, and soon we might control all of Taychend. Atop our conquests and enriched by trade, we will be free to establish an empire: an empire vainglorious."
 flavour_G71.17.a:0 "My Crown shall rule Taychend!"
 flavour_G71.17.b:0 "Our Crowns shall rule Taychend!"
 flavour_G71_17_ct:0 "Gain §G2§! Stability. For each point of Stability that would raise it above §Y3§!, gain §G100§! Administrative Power instead."

 flavour_G71.20.t:0 "Burghers-Enrager Deluxe"
 flavour_G71.20.d:0 "be king of Orenkoraim\n>want to develop kingdom\n>invite Cannorian trading companies\n>give them ports, privileges, and tax exemptions\n>trade booms\n>companies buy the merchants\n>companies buy the ministers\n>companies buy the palace guard\n>ask what they are going to do, overthrow me?"
 flavour_G71.20.a:0 ">mfw they take it as a suggestion"

 #CUSTOM TOOLTIPS
 G71_favour_cannorians_tt:0 "§pCannorians§! will grow in power."
 G71_favour_taychendi_tt:0 "§TTaychendi§! will grow in power."
 G71_nayak_cowardice_4_to_3_ct:0 "Replace the '§YNayak Cowardice§!' modifier in [6559.GetName] with '§YNayak Faintheartedness§!', giving the following effects:\nYearly Legitimacy: §R-0.50§!\nTolerance of the True Faith: §R-1.00§!\n\nAdditionally, if §Y[G52.GetName]§! or §Y[G64.GetName]§! declares war on §Y[Root.GetName]§!, the war will no longer immediately end in a §YWhite Peace§!, nor will §Y[Root.GetName]§! become the attacker's §YSubject§!."
 G71_nayak_cowardice_3_to_2_ct:0 "Replace the '§YNayak Faintheartedness§!' modifier in [6559.GetName] with '§YNayak Prudence§!', giving the following effects, while at war with §Y[G52.GetName]§! or §Y[G64.GetName]§!:\nFort Defense: §G+15.0%§!\nAttrition for Enemies: §G+1.00§!"
 G71_nayak_cowardice_2_to_1_ct:0 "Replace the '§YNayak Prudence§!' modifier in [6559.GetName] with '§YNayak Resilience§!', giving the following effects, while at war with §Y[G52.GetName]§! or §Y[G64.GetName]§!:\nFort Defense: §G+30.0%§!\nAttrition for Enemies: §G+2.00§!"

 #MODIFIERS
 G71_cannorian_discontent:0 "Cannorian Discontent"
 G71_cannorian_discontent_desc:0 "The merchants of Cannor came to Orenkoraim expecting open markets, generous privileges, and grateful hosts. Having received somewhat less than all three, they have begun to discuss whether commerce might prosper under more accommodating management."
 G71_cowards_glory:0 "Coward's Glory"
 G71_cowards_glory_desc:0 "Glory does not always have to come from great battles won or magnificent acts of valor. Sometimes glory simply comes from surviving every battle, one after the other."
 G71_cult_of_golden_shackles:0 "Cult of Golden Shackles"
 G71_cult_of_golden_shackles_desc:0 "The subjects of Orenkoraim are the happiest in Taychend, for what Orenkoraim lacks in steel they more than make up for in gold."
 G71_gate_of_kalavend:0 "Gate of Kalavend"
 G71_gate_of_kalavend_desc:0 "The great port of Kottar Orenkoraim offers access to all of Kalavend, from Katelperai to Nanru Nakar and beyond."
 G71_gate_of_taychend:0 "Gate of Taychend"
 G71_gate_of_taychend_desc:0 "Looking around Kottar Orenkoraim, it is easy to get the impression that all the power, money, and influence in Taychend have gathered in one place."
 G71_glass_in_demand:0 "Glass in Demand"
 G71_glass_in_demand_desc:0 "With the links between Cannor and Orenkoraim stronger than ever, the glass workshops of Cankamam have orders to fill around the clock, to both the political and economic benefit of Orenkoraim's foreign merchants."
 G71_imitating_elrandar:0 "Imitating Elrandar"
 G71_imitating_elrandar_desc:0 "Elrandar has taught us that a fort should be tall, sturdy, and, most importantly of all, impregnable."
 G71_legacy_of_wallmakers:0 "Legacy of Wallmakers"
 G71_legacy_of_wallmakers_desc:0 "The fort-builders of Orenkoraim know that if the walls of their forts ever collapse, there's a decent chance they'll be inside them when they do. As such, all of Orenkoraim's forts tend to be built with the greatest of care."
 G71_nayak_cowardice_4:0 "Nayak Cowardice"
 G71_nayak_cowardice_4_desc:0 "To say that death is better than dishonor in the first place, you have to be alive. Better a coward than a corpse, we say!\n\n§gIf §Y[G52.GetName]§! or §Y[G64.GetName]§! declares war on §Y[This.Owner.GetName]§! while this modifier is active, the war will immediately end in a §YWhite Peace§! and §Y[This.Owner.GetName]§! will become the attacker's §YSubject§!.§!"
 G71_nayak_cowardice_3:0 "Nayak Faintheartedness"
 G71_nayak_cowardice_3_desc:0 "Why wait for danger to arrive before fearing it? A proper Nayak trembles well in advance, and thus is never caught unprepared!"
 G71_nayak_cowardice_2:0 "Nayak Prudence"
 G71_nayak_cowardice_2_desc:0 "Others call it cowardice when we avoid a battle, and prudence when they later discover we were right. The Nayaks simply prefer to be right a little earlier!"
 G71_nayak_cowardice_1:0 "Nayak Resilience"
 G71_nayak_cowardice_1_desc:0 "The oak stands proudly until the storm tears it from the earth. We Nayaks would rather bend, bow, and crawl if need be. Only the living get to straighten their backs again!"
 G71_new_power_of_the_north:0 "New Power of the North"
 G71_new_power_of_the_north_desc:0 "As ever in Taychend, armies beget armies and success begets success, until even the most cowardly of nations can stride across the continent as would-be conquerors."
 G71_new_trading_connections:0 "New Trading Connections"
 G71_new_trading_connections_desc:0 "Access to the coast of Thekvussam has given Orenkoraim the opportunity to sell its goods throughout Taychend and even in the markets of Cannor."
 G71_searching_for_glory:0 "Searching for Glory"
 G71_searching_for_glory_desc:0 "Glory is said to await those bold enough to seek it. Orenkoraim has therefore resolved to search for it very carefully, preferably with a large navy scouting ahead."
 G71_the_hidden_crown:0 "The Hidden Crown"
 G71_the_hidden_crown_desc:0 "Crowns rule in the Taychendi Administration. Surprisingly, that includes the crown of the Nayak kings, who closely cooperate with the ATTC."

 G71_not_a_threat:0 "Not A Threat"

 #ESTATES
 estate_cannorian_merchants:0 "Cannorian Companies"
 estate_cannorian_merchants_desc:0 "This estate represents the Cannorian chartered companies and their agents operating within our country. Their stated purpose is to bring foreign capital, organize trade, and connect the markets of Taychend with those of Cannor. In return, they expect exclusive concessions, privileged access to our ports and resources, and an ever-greater voice in the government of the realm."
 estate_burghers_cannorian_investments:0 "Cannorian Investments"
 estate_burghers_cannorian_investments_desc:0 "The Cannorian Companies will finance a permanent network of envoys tasked with cultivating relations between our court and the powers of Cannor, allowing messages and representatives to cross the ocean with greater speed. Each relationship they foster opens a new channel through which Cannorian inventions, military expertise, and seasoned mercenary officers can be brought to Taychend."
 estate_burghers_cannorian_investments_cti:0 "countries with capitals on the §YCannor§! continent:\nOne of the following must be true:\n  Has opinion modifier §YImproved Relations§! of at least §Y50§!.\n  Allied with §Y[Root.GetName]§!."
 estate_burghers_cannorian_investments_ct:0 "Gain the following effects for each qualifying country, up to §Y4§!:\n  Yearly Innovativeness: §G+0.05§! to §G+0.20§!\n  Mercenary Discipline: §G+1.3%§! to §G+5.0%§!\n\nA country qualifies if its capital is on the §YCannor§! continent and at least one of the following is true:\n  Has opinon modifier §YImproved Relations§! of at least §Y50§!.\n  Is allied with §Y[Root.GetName]§!."

 G71_unrest_in_kottar_orenkoraim_happened_ctt:0 "Have dealt with §YCannorian Merchants§!"
