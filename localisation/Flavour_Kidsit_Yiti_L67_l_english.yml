l_english:
 # Missions
 L67_the_warlords_wealth_title:0 "The Warlords' Wealth"
 L67_the_warlords_wealth_desc:0 "A savage conflict rages to our east. Dakinshi warlords shed rivers of their people’s blood, hoping to become the undisputed master of the mountains and jungles of Bamaliwuni. Yet if one of them ever does trounce their kin, they would pose a great threat to the Holy Land. So we must strike now, while they are still divided. We will shatter their undisciplined forces and seize the rich mines of copper, gold, and gems in the Dezpa Sedara and Pakreda Sedara. With no metal and no riches, their campaigns will grind to a halt, and we will be in the ideal position to steadily gain control over the entire east!"

 L67_enforce_peace_and_piety_title:0 "Enforce Peace and Piety"
 L67_enforce_peace_and_piety_desc:0 "Converting the heathen chieftains and warlords in the savage lands east and south of the Holy Land was just the first step. Now, every man, woman, and child in the borderlands needs to be taught the ways of the Mengi and the truth of Amilak. Their heathen shrines will give way to proper temples and the lodges of wild beast-shifters will be reformed into recruitment camps for the valiant regiments of our army."

 L67_unassailable_title:0 "Unassailable"
 L67_unassailable_desc:0 "To safeguard Madriamilak, we went south and east, conquering the land and civilising its savages. But now that these lands are pacified, and their population devout followers of Amilak, our duty has expanded. Each time we push the frontier, we find new threats waiting for us. We have pushed out the monstrous lizards from Ishyamtumu, but as we push farther and farther, we simply find more of them, and much more fearsome ones at that. And while Bamaliwuni borders no more strange lands, we must see to the protection of its verdant shores.\n\nThe bulwark that is Kidsit Yiti must expand, now and forever."

 L67_mezhi_of_the_eastern_citadel_title:0 "Mezhi of the Eastern Citadel"
 L67_mezhi_of_the_eastern_citadel_desc:0 "Our realm is defined and united by one duty: to defend the Holy Land from encroaching beasts and monsters. We have set aside our pride and suppressed dynastic squabbles among the Mezhi to devote ourselves to this task. In theory, at least. In practice, there are greater and lesser kings, and this may yet be our undoing someday.\n\nWe must not let it come to that! One dynastic line of Mezhis that feels wronged is that of the governors of old Kirksan; a small fiefdom that sought our protection from the lizards and shifters a long time ago. The lord of our easternmost fortress should not be relegated to a lesser seat at the Table of Kings. We shall subjugate the lizards in Katidariga and seize their ancient citadel. It shall be the new seat of power for the Kirksan Mezhi and the first step in our campaign to pacify the borderlands."

 L67_defang_the_borders_title:0 "Defang the Borders"
 L67_defang_the_borders_desc:0 "For as long as we have lived here, the tribes in the jungles of Ishyamtumu have been a threat to our people, and all of Madriamilak. We cannot permit this threat to persist. We will create a safe buffer between us and the wildlings deep in the jungles. In order to achieve this, we shall tear down their shrines, expel the scaled beasts amongst them, and establish loyal marcher lords to guard our new territories from incursion. Another step taken to ensure lasting safety for Madriamilak."

 L67_make_them_forget_title:0 "Make Them Forget the Past"
 L67_make_them_forget_desc:0 "Our country is strong because its many kings are aligned and united behind our shared duty as the southern shield of Madriamilak. The wild jungles and mountains will never be truly ours if champions of the old heathen order are allowed to remain lurking in the deep green. They will continue to bite at our heels, and the common folk may even be led astray and consider them their legitimate rulers.\n\nWe must therefore expand the Table of Kings. Any Tanizu chief or Dakinshi warlord who abandons their beastly ways and embraces Amilak will be welcomed into the fold. We will thus establish bonds of friendship and marriage, and in time they will become proper Sitewosi.\n\nThe wretches who refuse this generous offer will be denounced and hunted without mercy, and no subject of ours will ever mistake them for a legitimate lord."

 L67_contain_the_evil_title:0 "Contain the Evil"
 L67_contain_the_evil_desc:0 "While the east and south were merely home to unrepentant savagery, the west is infested by pure evil. The never-ending incursions by the trollish horde commanded by the Hags of Yezel Mora remain a lethal blight on our world. This is not a land we can tame and integrate; instead, we shall raise towers and castles that reach the sky. Our well-trained and disciplined garrisons shall watch over and patrol these malign swamps with unwavering devotion, all to safeguard the Holy Land from the forces of Yrilak."

 L67_the_way_to_dakmender_title:0 "The Way to Dakmender"
 L67_the_way_to_dakmender_desc:0 "Our pilgrims already have well-established routes they may travel along the Yet, all the way to the coast. But no route yet exists that takes a holy man from Yikikakeli to Dakmender, at least not without leaving the divine waters. We must extend the channels by digging through the lands of the Pechekutema Pact until we reach the Keygas.\n\nAt the same time, we must consider that the Keygas forms a natural boundary, its waters made inimical to life by the excretions of the Shadow Swamp and its far shore filled with lurking danger. To make sure our pilgrims are safe from Raheni slavers, Trolls, and Gnolls, we need to not only fortify the major crossings, so our wanderers can safely follow the flow of the river, but also have every temple along the way perform regular purification rituals on their stretch of the river. Only in this way can our pilgrims be kept safe from the malign influences of the Shadow Swamp."

 L67_at_rivers_end_title:0 "At River’s End"
 L67_at_rivers_end_desc:0 "While any place in Madriamilak, any temple, any hamlet, is a worthy site of pilgrimage, the estuaries of the great rivers exert a mystical pull on the devout. In Dakmender and Yetmesira, we shall therefore erect grand temples at the mouths of each river.\n\nKnow, pilgrim, that when the water turns brackish, your destination is close at hand, and Amilak has witnessed your journey."

 L67_the_final_kingdom_title:0 "The Final Kingdom"
 L67_the_final_kingdom_desc:0 "Even with the death of Zenidir and the collapse of the Melakmengi of old, our people did not despair. For it was and still is clear to us that discord is merely a temporary state of affairs. One day, a righteous Mezhi is bound to arise and bring us back together. A promise repeated often, to instil hopes and dreams.\n\nOur recent successes have seen us unite many of our Sitewosi kin under our banner. Hopes and dreams have slowly morphed into ambitions and talk of prophecies fulfilled. The people clamour for the Final Kingdom. A realm of harmony that will first unite the Sitewosi, and then all our Mengi kin."

 L67_the_ties_that_bind_title:0 "The Ties That Bind"
 L67_the_ties_that_bind_desc:0 "In the crucible of war, great realms are forged. But if all we do is fight and conquer, our legacy will wither and die far too soon. The realm will not last if we seek only to subjugate and eradicate the vanquished.\n\nThe noble blood of conquered lands must mingle with our own. Bonds of marriage will tie our newly won lands to us. Among the noble families of our nation, there is no shortage of eligible brides and grooms to make one big family out of all Madriamilak."

 L67_shoulder_to_shoulder_title:0 "Shoulder to Shoulder"
 L67_shoulder_to_shoulder_desc:0 "Long years ago, the first Sitewosi Mezhi banded together to resist raiding shifters. They birthed our realm and decreed our sacred duty to protect the Holy Land. Now, centuries later, we are no longer merely the guardians of the south. Our castles and soldiers now protect all corners of Madriamilak. The shifters of old are gone, assimilated into our people, while our new foes range from vile trolls to rampaging lizards and foreign empires coveting our wealth.\n\nThe Final Kingdom of the Sitewosi is about to become the Final Empire of all Mengi. A realm where every noble soul plays a crucial role. Every one of us carries the burdens of the Mezhi. Each of us shares in the glory, in Amilak’s favour, and the bounty of our continued prosperity."

 L67_the_northern_lakeshores_title:0 "The Northern Lakeshores"
 L67_the_northern_lakeshores_desc:0 "The wetlands around lakes Muka and Solgidda are only rivalled by the Yet valley in their fertility. The rice we grow here in abundance has already granted us a large population, meaning many warriors and many labourers. If we seize the northern shores of our lakes as well, we could feed so many more of our people, cementing us as the dominant power of the south."

 L67_the_submerged_title:0 "The Submerged"
 L67_the_submerged_desc:0 "In our wet lands, the clergy have developed a unique tradition, that of the submerged pilgrim. Holy men pledge to be in contact with the divine waters brought to us by Amilak every moment of their life. They wade through streams and ponds and swim the rivers and lakes, visiting as many waterside settlements as they can. These pilgrims bring wisdom, aid, and miracles wherever they go and are a great boon to our realm. The Table of Kings must support this proud tradition and grant the pilgrims our patronage."

 L67_pilgrims_rest_title:0 "Pilgrims' Rest"
 L67_pilgrims_rest_desc:0 "Along the lakes and lesser streams, travel is easy. But our pious pilgrims have expressed a desire to travel to the great river Yet. To help them, we shall erect a network of amphibious temples, where weary travellers can rest without leaving the water. By improving these hallowed routes, more holy men will undertake their pious travels, and the people and lands along their path will benefit tremendously from their spiritual guidance and magical gifts."

 L67_born_to_the_vanguard_title:0 "Born to the Vanguard"
 L67_born_to_the_vanguard_desc:0 "By encouraging the repeated matches between our noble houses, we have managed to secure ourselves an inexhaustible supply of noble sons, eager to prove their merits to the realm. And now, each of them must get their chance to shine.\n\nWe shall make it a priority to create enough pastures to nourish the great feral horse herds of the Telekenid so that our mighty princes might bond with these magnificent steeds. Our sons will find their glory when they rush into the fray atop the finest steeds Sarhal has to offer."

 L67_what_kings_crave_title:0 "What Kings Crave"
 L67_what_kings_crave_desc:0 "With the marshes secured, it is time to invest in the growth of our people and their prosperity. Every speck of arable land will be devoted to growing more rice. The Semayebaka will use Amilak’s gifts to their fullest, and our farms will be the most productive in the known world. Every peasant will eat like a king in Kidsit Yiti, and every Mezhi will eat for two."

 L67_our_bowl_runneth_over_title:0 "Our Bowl Runneth Over"
 L67_our_bowl_runneth_over_desc:0 "In Kidsit Yiti, no child knows the gnawing pain of hunger, for our bowls are overflowing with food, and we are just getting started. Through careful magical stewardship and the hard work of our subjects, the storehouses are filled to the brim. When the tide of rice becomes so large we can neither eat nor store it all, we will sell the surplus abroad. And by selling exclusively to our allies, we will not just make gold hand over fist, but also bolster the might of our friends, benefiting us twice."

 L67_surplus_land_title:0 "Surplus Land"
 L67_surplus_land_desc:0 "The rice farms in our heartlands have produced incredible yields. With every harvest, the larders are filled to bursting, and great caravans depart to sell our rice to hungry mouths abroad. With a little more concerted effort, we can become the sole supplier of grains in all of Madriamilak. Other landowners will be forced to repurpose their fields if they want to make a living."

 L67_harvest_power_from_the_fields_title:0 "Reap What We Have Sown"
 L67_harvest_power_from_the_fields_desc:0 "The dominance of Denibari rice has made farmers in other regions highly resourceful. Countless new coffee plantations have sprung up in Bamaliwuni, each trying to carve a niche with unique blends and cultivars.\n\nAlong the Yet, beekeeping has become popular, as the honey produced there is the main ingredient in a burgeoning tej trade. Using a great variety of grasses, flowers, and fruit trees, the brewers create unique flavours, catering to every possible taste.\nWith abundant supplies of both staples and luxuries, our dominance in the markets is a foregone conclusion. Nobles across Sarhal will recognise our wines and other delicacies as the finest, and entire realms will come to rely on our exports, feeding their hungry masses for as long as we allow it, and they will pay us generously for the privilege."


 # Events
 kidsit.3.t:0 "Omens Above"
 kidsit.3.desc:0 "Our continued support of the realm’s wandering priests has made our capital a popular stop on many a pilgrimage. The wading priests visit the many lakeside palaces, where they mingle with Mezhi in shallow pools.\n\nThe Semayebaka seek patronage, and the nobles require a variety of services. They soak up the moral wisdom of learned men, arrange for the rains to visit their farmland, and - most coveted of all - seek to learn the future from Amilak’s signs in the sky. When a skilled diviner visits, the lords assemble in droves, crane their necks toward the firmament, and piously heed what the augur tells them."
 kidsit.3.a:0 "What does the morrow hold?"

 kidsit.4.t:0 "The Table of Kings Convenes"
 kidsit.4.desc:0 "The throne stands empty, and the many kings of Kidsit Yiti have gathered to elect a new leader from amongst their ranks. Each speaks of duty to Amilak and to the confederation, but each also champions a different vision for the realm. Before the gathering ends, one Mezhi will emerge as the first among equals. The question on everyone’s mind is now: who will it be?"
 kidsit.4.a:0 "A Strong Mezhi."
 kidsit.4.b:0 "A Zealous Mezhi."
 kidsit.4.c:0 "A Resourceful Mezhi."
 kidsit.4.d:0 "A King of Castles."
 kidsit.4.e:0 "A King of the Wild."
 kidsit.4.f:0 "A King of the Farms."
 kidsit.4.g:0 "Elect the old Mezhi's heir, [Root.Monarch.GetName]."
 kidsit.4.h:0 "Elect the old Mezhi's heir, [Root.Heir.GetName]."
 kidsit.4.h.tt:0 "§Y[Root.Heir.GetName]§! remains our heir under the current regency. [Root.Heir.GetHerHisCap] unique talents will show themselves once [Root.Heir.GetSheHe] takes the throne."

 kidsit.5.t:0 "No Zealot Like a Convert"
 kidsit.5.desc:0 "“Welcome, honoured guests. How glad I am to see so many friends here on the happiest day of my life. New friends, who’ve supported me on my path to find God. Old friends, who’ve accompanied me on this marvellous journey. The future of our land, the holy land of Amilak, has never looked brighter.”\n\nA few Tanizu chieftains break out in early shouts of agreement, but the speaker gestures for them to quieten down and await the rest of his words.\n\n“Still, I am saddened that not all of the men I once called friends could join me on my journey into the light. That chiefs I once thought of as brothers have remained stubbornly set in their heathen ways and even now remain benighted and lost is a loss both for them and their subjects. But I swear I will not let my kinsmen suffer due to the stubbornness of a few fools. I know I can count on the Table’s support in enlightening my fellow Tanizu kinsmen and rooting out old superstitions. Our people will go happily into the future, and those who cling to the old ways will be relieved of the duties they have forsaken. May their lands be stewarded by those more deserving!”\n\nHe raises both hands into the air. In his right, drops of wine spill from an overflowing golden goblet. His ring-adorned left clasps the fingers of the Sitewosi woman beside him.\n\n“May Amilak bless our realm, and may we all find such beautiful brides as mine!”"
 kidsit.5.a:0 "Hear, hear!"
 L67_conversion_reduces_separatism_tt:0 "Henceforth, converting a province will reduce §YSeparatism§! by §Y5§! times the §YPrestige Per Development From Missionary§! modifier."
 L67_unlock_king_of_the_wild_tt:0 "We can now elect a §YKing of the Wild§!, who excels at civilizing untamed peoples."

 kidsit.6.t:0 "The First Banquet of the Second Age"
 kidsit.6.desc:0 "It had taken hours for the endless procession of noble families to find their way into the royal hall. Three heralds from Fuulmana had announced the full titles and lineage of every single guest, taking turns when their throats became strained and dry. All that time, Kazahu zor Zufa-Melas had served the table of his foster father, the Mezhi of Kuvunika, fetching, tasting, and pouring several carafes of tej while they waited for the feast to start.\n\nWhen the master of ceremonies banged his golden staff on the stones with great force, it finally did. While the portly man from Kadamuu launched into a long-winded speech about duty and faith, Kazahu’s attention went elsewhere. His gaze trailed the banners hanging from the walls, matching names to emblems: the shepherd’s crooks of Pegosi, the chalice of Dugiti, the wolf of Inshibonde.\n\nWhen his eyes moved on to the spider of Tnismot, they passed over something delightful in his line of sight. A Tanizu girl, perhaps a few years his senior, waving a fan for the lady of Huugeta. She looked as uninterested in the ceremony as he was, her eyes wandering here and there. Until their gazes met, and Amilak himself set their hearts ablaze.\n\nLost in the study of her eyes, Kazahu did not notice when the speech ended, nor when the host himself called for all to raise their cups. It took a not-so-gentle nudge from one of his brothers to pull him back to his duties. He quickly poured the tej, and the table joined the toast. Then, as the dishes of steaming rice were carried into the hall, his foster father turned to him.\n\n“Never forget your duties, son. Right now, your lot is to pour our drinks, just as it is hers to attend to her lady.”\n\nThe Mezhi then stood up, straightened his robes, and turned towards the table of Huugeta.\n\n“Arranging your future falls to me.”"
 kidsit.6.a:0 "Duty calls to us all."

 kidsit.100.t:0 "Kidsit Yiti Pulse Event Handler"
 kidsit.100.desc:0 ""
 kidsit.100.a:0 ""

 kidsit.101.t:0 "Famine!"
 kidsit.101.desc:0 "With the food supply of our realm concentrated in the swamps, it is of the utmost importance that we maintain the safety of those fecund areas. Whether due to war or natural disasters, we have failed in this duty, as many of the rice farms now lie in ruins. In the coming time of want and hunger, our subjects will surely curse our names."
 kidsit.101.a:0 "Our carelessness has doomed our people."
 kidsit.101.b:0 "Import food NOW!"
 kidsit.101.c:0 "No more feasts; open the larders to the peasants!"

 kidsit.102.t:0 "A Grand Pilgrimage"
 kidsit.102.desc:0 "The way of the submerged pilgrim is a long and winding road that may take him from opulent palaces to squalid hamlets or near-forgotten shrines. While the lifelong devotion of the holy men to this way of life remains unmatched, the path of water has become accessible to pious laypeople as well, in no small part due to our continued investment in waystations and shoreside temples.\n\nThe great Brackish Temples in Dakmender and Yetmesira in particular exert a strong pull on the pious among us. So from time to time, a great host of pilgrims, drawing from the ranks of commoners, nobles, and churchmen alike, will undertake this spiritual journey together. It has become customary for our king to address such a gathering before their departure."
 kidsit.102.a:0 "May Amilak watch over you."
 kidsit.102.b:0 "We will hold a feast before you leave!"
 kidsit.102.c:0 "My court and I will travel with you!"

 kidsit.103.t:0 "What the Heart Wants"
 kidsit.103.desc:0 "The Table is abuzz with scandalous rumours! A royal daughter has eloped with a commoner in [L67_royal_scandal_province.GetName]! He is apparently some boorish peasant or lowly officer; the rumours do not agree on the details. This is both a stain on our reputation and a tragic political setback, for she will not strengthen the bonds with our fellow Mezhi through matrimony."
 kidsit.103.a:0 "Is there anything so undoing as a daughter?"
 kidsit.103.b:0 "You're my daughter. You'll do as I command!"
 kidsit.103.c:0 "We have plenty of other daughters at home."

 kidsit.104.t:0 "Heathen Holdouts"
 kidsit.104.desc:0 "In spite of our well-intentioned missionary work, the recalcitrant heathens in [heathen_holdout_province.GetName] cling to their old ways. They greedily accept both our aid in matters of arcane agriculture and our protection, but they refuse to acknowledge Amilak as their lord.\n\nThe patience of the more zealous Mezhi is running thin, with some advocating for unspecified drastic measures. Others argue we could withdraw our missionaries and redirect them to more receptive locales."
 kidsit.104.a:0 "The carrot has failed; bring out the stick."
 kidsit.104.b:0 "Bah, leave them to their superstitions."
 kidsit.104.c:0 "These wayward souls need a gentle hand."

 kidsit.105.t:0 "Indolent Nobles"
 kidsit.105.desc:0 "To be a Mezhi means fulfilling obligations: to Amilak, to the people, and to other Mezhi. We are meant to be the pillars that hold the realm upright, and it takes a life of dedicated effort to embody that ideal.\n\nBut some among our ranks neglect those obligations and would rather live an indolent existence on the backs of their hardworking subjects. They sit in their fancy palaces all day, playing games and growing fat. How should we deal with them?"
 kidsit.105.a:0 "We are strong, and can afford some slackers."
 kidsit.105.b:0 "Denounce them, often and loudly!"
 kidsit.105.c:0 "The Table of Kings shall codify their obligations into law."

 kidsit.106.t:0 "Resounding Victory"
 kidsit.106.desc:0 "A strike of lightning, cast by Amilak himself, called us to war. Feeling His wrath and knowing Him at our side, we threw ourselves upon the slaves of savage gods who threaten the Holy Land.\n\nJust as thunder follows lightning, so does victory follow our bloodshed. We stand in triumph over the enemies of our God and people."
 kidsit.106.a:0 "Let the conquered now cower!"

 kidsit.107.t:0 "Stewards of Madriamilak"
 kidsit.107.desc:0 "When the rain reminded us to be good stewards, we laboured to bring about prosperity. We herded clouds and animals alike, ploughed the soil, and mined the mountains. Now, we revel in abundance, and thank Amilak for carving out this blessed land for us."
 kidsit.107.a:0 "Prosperous times are ahead."

 kidsit.108.t:0 "Basking in the Light"
 kidsit.108.desc:0 "Why should we remain divided, isolated, or distrustful when we all enjoy the warmth and light of the same sun? It shows us clearly the beauty of the land and illuminates the faces of our fellow man. No wonder then, that it has inspired us to draw closer to each other, to pursue the harmony that Amilak so clearly intends for us."
 kidsit.108.a:0 "We stand together in His light."

 kidsit.110.t:0 "Rice Exports Available"
 kidsit.110.desc:0 "Our existing export agreements have run their course, and the produce of our rice marshes is available to be sold pending new agreements once again."
 kidsit.110.a:0 "Time to seek out new markets."

 # Modifiers
 L67_great_pilgrimage:0 "Great Pilgrimage"
 L67_great_pilgrimage_desc:0 "Pilgrims from across the swamps have gathered at this Holy Estuary. Inns and taverns built along the riverbanks are filled to bursting, and the unrelenting stream of arriving Semayebaka leaves no speck of land unblessed."
 L67_submerged_pilgrim:0 "Submerged Pilgrim"
 L67_submerged_pilgrim_desc:0 "This ruler has joined the faithful on a pilgrimage through the swamps and rivers of Madriamilak to the Holy Estuaries."
 L67_gentle_approach:0 "A Gentle Approach"
 L67_gentle_approach_desc:0 "The faithful here are being brought into the fold through patience and understanding."
 L67_a_citadel_reborn:0 "A Citadel Reborn"
 L67_a_citadel_reborn_desc:0 "The ancient Citadel at Kuvunika is now a child of two fathers. At its heart are the pieces of an ancient lizard tower, now supplemented by stones from the former fortress at Kirksanlashan. It has become a truly imposing bulwark, fit for a most noble Mezhi, that watches over the savage lands to the east and west."
 L67_amphibious_temple:0 "Amphibious Temple"
 L67_amphibious_temple_desc:0 "This temple has been adapted to serve pilgrims travelling immersed within Madriamilak's waterways. From sleeping quarters to dining halls, everything accommodates the divine practice of indefinite submergence."
 L67_brackish_temple:0 "Brackish Temple"
 L67_brackish_temple_desc:0 "A magnificent temple complex marks this great terminus of the submerged pilgrim routes."
 L67_luxurious_blends_and_vintages:0 "Luxurious Blends and Vintages"
 L67_luxurious_blends_and_vintages_desc:0 "Extensive experimentation with various ingredients has led local farmers to create uniquely flavoured beverages that fetch high prices."
 L67_newfound_purpose:0 "Newfound Purpose"
 L67_newfound_purpose_desc:0 "While the beastly superstitions of the locals have been eradicated, not every custom they practised must be discarded. Stripped of their forbidden rites, the old warrior lodges have been repurposed to teach the Mengi way of war. They still foster brotherhood and skill at arms and attract many glory-seeking youths, who need assume no beastly shape to march proudly in service of the realm."
 L67_transmuted_soil:0 "Transmuted Soil"
 L67_transmuted_soil_desc:0 "Careful transmutation has made the waterlogged soil exceptionally fertile and easy to cultivate."
 L67_massive_garrison:0 "Massive Garrison"
 L67_massive_garrison_desc:0 "A castle is just a neatly ordered pile of rocks, until a skilled regiment makes it their home. The local Mezhi has taken this wisdom to heart, and grown his force to an impressive size. A vast garrison spends all day patrolling, drilling, and sharpening their weapons, ready to defend the walls to the last or sally forth to meet their foes."
 L67_dug_in:0 "Dug In"
 L67_dug_in_desc:0 "Our staunch defenders trounced the last enemy army that tried to besiege these walls. In this moment of reprieve, the garrison is hard at work fortifying every inch of the fort, laying the groundwork for another victory."
 L67_land_dowry:0 "Land Dowry"
 L67_land_dowry_desc:0 "For now, this province is still ruled by an autonomous lord. But the seed of Kidsit Yiti has already been sown in the land. Soon, the distinction between vassal and suzerain will fade, as both sit side by side at the Table as brothers."
 L67_food_shortages:0 "Food Shortages"
 L67_food_shortages_desc:0 "Our war with Kidsit Yiti is seriously harming our food supply, as the rice lords of Madriamilak are making sure that not a single grain of their harvest reaches our markets."
 L67_the_fusing_of_the_realms:0 "The Fusing of the Realms"
 L67_the_fusing_of_the_realms_desc:0 "With every marriage, every shared meal, we draw closer to total unification. Old ancestries fade as the blood mingles into a shared identity. A Sitewosi Melakmengi is forming before our very eyes."
 L67_king_of_castles:0 "Edugiti Mezhi"
 L67_king_of_castles_desc:0 "A ‘King of Castles’, this ruler is recognised as an expert in fortification and defensive warfare. In their eyes, our first and foremost duty is the defence of the Holy Land."
 L67_king_of_the_farms:0 "Eraferi Mezhi"
 L67_king_of_the_farms_desc:0 "This ruler champions the farms and infrastructure that sustain the realm, earning them the moniker ‘King of the Farms’. None shall go hungry under their rule."
 L67_king_of_the_wild:0 "Eyedar Mezhi"
 L67_king_of_the_wild_desc:0 "This ruler has a relentless drive to civilise the folk on the fringes of civilisation. They push for conversion and assimilation, to save their subjects from superstition and savagery. The jungles do not belong to wild beasts, but to this ‘King of the Wild’."
 L67_export_agreements:0 "Export Agreements"
 L67_export_agreements_desc:0 "The produce of this rice marsh has been committed to satisfy foreign export agreements."
 L67_food_abundance:0 "Population Boom"
 L67_food_abundance_desc:0 "Steady rice shipments from the swamps of Kidsit Yiti ensure plentiful food, encouraging rapid population growth throughout the realm."
 L67_suppressed_grain_trade:0 "Suppressed Grain Trade"
 L67_suppressed_grain_trade_desc:0 "Cheap imported rice has destroyed the profitability of locally grown grain."
 L67_lightning_heralds_war:0 "Lightning Heralds War"
 L67_lightning_heralds_war_desc:0 "§YProphecy:§! Win a war against a rival or great power of another religion."
 L67_rain_induces_growth:0 "Rain Induces Growth"
 L67_rain_induces_growth_desc:0 "§YProphecy:§! Cast §Y2§! spells that affect a province's trade good.\n\nProgress: §Y[Root.tradeGoodSpellsCast.GetValue]/2§!"
 L67_sunshine_predicts_unity:0 "Sunshine Predicts Unity"
