# events
 flavour_blue_reachmen.1.t: "Promotion"
 flavour_blue_reachmen.1.desc: "The city was ecstatic, that much Colc could tell immediately, streets filled with reveling citizens, temples holding nigh constant services to mourn those lost and buried as well as pleading to the gods for good tidings.\n\nThough from experience the goblin knew the real interesting stuff happened behind closed doors, like those he had gained access to through a coveted invitation. These backrooms were where the real deals were made, diplomats exchanging hushed whispers and rumours, spies doing what they do best and oh so so many opportunities for profit.\n\nWhich is precisely what he was here for, as a change in leadership is just the opportunity a rising merchant needs to soar above his peers, for Bayvic was likely soon to be a barren husk picked clean of potential profits. Why not plan ahead and try to ingratiate himself with the new rising star of the League.\n\nAnd just then he spotted who he was looking for - a [Root.GetAdjectiveCap] councilor idly watching the mingling masses. With confidence in his step he approached, executing his best bow towards the stranger and introducing himself."
 flavour_blue_reachmen.1.a: "And so a new day dawns"

 flavour_blue_reachmen.2.t: "Fate of the Adshaws"
 flavour_blue_reachmen.2.desc: "For centuries, the tales of the vile Adshaws and their tyrannical rule over our people have been shared amongst the Reachmen, a dark memory that endured to this very day. This dark chapter of our shared history ended only thanks to the elven host of Maldorian that aided our revolt against their rule, just as his kin freed all of Cannor from Nichmer’s influence.\n\nWhile Adshaw has been a shadow of its former self ever since the fateful battle of Coldmarket, particularly when compared to the Gawedian tyrants further to the south, they still fiercely resisted any efforts of integrating them into our beloved League.\nBut now, with the people and administrators under our control and accepting of our rule while the royal family and their sycophants are either scattered to the winds or emulating Crovis’s march east, we have to choose just how to deal with the former lands of Adshaw.\n\nOn one hand, we could rule the land ourselves, which, while a strain for our diplomatic service and administrative capacities, would allow us unfettered access to the riches the land holds.\nAlternatively, we could grant them some measure of independence as well as League membership in exchange for them serving as a bulwark against any aggressors from the south, a task for which the bellicose inhabitants of these lands are very well suited for."
 flavour_blue_reachmen.2.a: "Let them become the shield of the Reach."
 flavour_blue_reachmen.2.b: "Adshaw’s land and legacy are ours to keep."

 flavour_blue_reachmen.13.t: "The Reach United"
 flavour_blue_reachmen.13.desc: "To say that the great hall was bustling would be an understatement of epic proportions, dignitaries from every corner of Cannor and Gerudia had come in answer to the invitation to attend the ceremony to celebrate the de facto unification of the Reach. From minor nobles, merchants, clerics, foreign envoys and powerholders, all had come in the hopes of using this clear power shift in the region to their own advantage. The Gawedian Magnates and Lorentish Crown had sent the two largest gaggles of envoys and opulent gifts by far, and the festive atmosphere was dimmed somewhat by the murderous glances exchanged between both parties.\n\nYet what none of them seemed to realise was that from this day on, no amount of bribery shall sway us. They must learn that the Reach is to be treated as an equal now, not a disjointed group of easily exploited city states.\n\nFor we are united, now and forevermore."
 flavour_blue_reachmen.13.a: "The Reach stands strong."
# privileges
 estate_burghers_BR_mercantile_traditions: "Mercantile Traditions"
 estate_burghers_BR_mercantile_traditions_desc: "While we already have a strong mercantilist stranglehold over commerce in the reach, granting generous contracts to merchants who have yet to establish themselves in our markets would allow us to grow our trade network further and faster than other competing realms, bringing us further prosperity and wealth."
