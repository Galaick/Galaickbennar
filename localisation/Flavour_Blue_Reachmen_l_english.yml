# missions
 BR_reaching_out_title: "Reaching Out"
 BR_reaching_out_desc: "To be part of the Vic League is to be one voice in a sea of many, many others, a part of a greater whole composed of many individuals working together, yet at times with contradictory interests and opinions.\n\nOpinions that can be pushed to further our own goals if we sway, coerce, bribe or threaten the right targets.\n\nOpinions that, if we are ambitious enough, might see us supplant both Bayvic and Celmaldor as the new hegemon of the League while they are busy tending to their own matters..."
 BR_something_is_stirring_title: "Something is Stirring..."
 BR_something_is_stirring_desc: "In times past, the League of the Reach was a force to be reckoned with, its combined forces able to overpower the might of Adshaw and guarantee our continued independence ever since that day. In recent years however, circumstances have changed profoundly, as there are new and stronger threats around us, from the gluttonous Gawedian eagle in the south to the ambitious orcs of the Greytide to the east and the everpresent Gerudian reavers to our north. And as if that would not be enough, the league itself is also split between the elves of Celmaldor, who recently constructed a fleet that will surely bankrupt them and the merchant princes of Bayvic, who are themselves struggling to administrate the growing number of Escanni refugees, both human and goblin, that are seeking shelter there.\n\nPerhaps it is time for a new power to rise as new leader of the League to fill the power vacuum that is opening up..."
 BR_4_2_swap_title: "[GetBRMissionCol4Row2Title]"
 BR_4_2_swap_desc: "[GetBRMissionCol4Row2Desc]"
 BR_under_new_management_title: "Under New Management"
 BR_under_new_management_desc: "It is done.\n\nWhile the struggle over the leadership of the League has cost the life of many a good Reachman, what we did was for the good of the League as a whole. With us at the helm we shall ensure that no foe shall ever threaten our sovereignty and independence again.\n\nNow, that the dust has settled, there is much rebuilding to do and many relations to mend, but together we will prevail."
 BR_reaching_in_title: "Reaching In"
 BR_reaching_in_desc: "As we find ourselves at the top of the League’s hierarchy, we must take heed to not repeat the mistakes of our predecessor and let another upstart gain influence. Thus we shall start to slowly but inexorably integrate the merchants and tradeports of the other League members into our economy, until even the most recalcitrant would-be rival is forced to acknowledge that it is in their best interests to accept our primacy. And while this process is underway, our diplomatic apparatus will ensure that no one complains too loudly about the increasing number of merchants wearing our colours instead of theirs."
 BR_expand_the_city_borders_title: "Expand our Grasp"
 BR_expand_the_city_borders_desc: "As much as it hurts to admit, war is inevitable in these times, whether to defend our own rights or leading a pre-emptive charge against potential threats, all citizens must be ready to fight for the good of our beloved home.\nAnd as the protector of our cherished Vic League we have to ensure we are powerful enough to withstand any inside or outside threat. And to achieve this goal, we shall gather what lands we can under our control, whether it be weaker League cities we need to take under our wing to protect them from encroaching foes or taking a border province from said foes. For the Reach must grow if we wish to survive."
 BR_one_league_one_dream_title: "One League, One Dream"
 BR_one_league_one_dream_desc: "We finally achieved a vital milestone in our efforts to unify the Reach under a single banner, with the final large Reachmen settlement brought into our League, we have shown the world that an united Reach is not a wild fantasy, but instead an inevitability, no matter how many foes may stand against us.\n\nYet, while we may celebrate today, there is still much work to do if we truly want to unify our League. We shall not rest until the banner of the Reach truly flies in every province of our realm."
 BR_adshaws_title: "Adshaws"
 BR_adshaws_desc: "Around four centuries ago, the Reach was naught but a part of the Kingdom of Adshaw, yet even then we yearned to be free of perfidious conquerors and tyrants. And with the arrival of Maldorian and his elves we were indeed able to finally secure our freedom.\n\nWhile time has luckily not been kind to our former oppressor, now reduced to a rump state between Gawed and our proud League, their ambitions have not faltered in the slightest. Therefore, it is up to us to free the Reachmen yet under their yoke and unite them with their kin in the League. Only then will we have stomped out that threat once and for all, and made sure that they will never be able to subjugate us again."
 BR_blue_seaway_title: "Blue Seaway"
 BR_blue_seaway_desc: "For as long as we can remember, even before the arrival of the elves, unfettered access to the sea has been the lifeblood of the Reach. From rich fishing grounds to traders arriving from the furthest reaches of the known world to trade both goods and stories, the sea has brought us many gifts and is a constant reminder that we are not alone and forgotten in the wider world.\n\nHowever, while our current harbours have served us well enough so far, with all of Cannor abuzz with news about expeditions to the exotic land of Aelantir, several petitions have reached us to expand our naval infrastructure, both to prepare for a growing influx of traders and, perhaps, to one day host our own westward expeditions."
 BR_economic_unison_title: "Reaching for Profit"
 BR_economic_unison_desc: "Given our increased control over the Reach and the corresponding centralisation of the League, a new issue has arisen. To secure our economic stranglehold over the Giant’s Grave trade we need to ensure that all the different markets and traders both in and outside our realm have access to a standardised system of trade and exchange. Therefore, a series of unified measurements and weights have been distributed among the relevant merchant houses and local administrations. All that is left now is to ensure that the necessary mercantile infrastructure is established in the Reach,  and to use our sway over any trade happening within the League to enforce these new regulations."
 BR_dream_reached_title: "The Long Dream"
 BR_dream_reached_desc: "We have done what many considered impossible.\n\nFor the first time in our history, the Reach is truly united. Not subjugated under the banner of foreign lords or ladies, but joined together through our own efforts. Whether it happened through force of arms, diplomatic guile, backroom dealings or boatloads of cash does not matter, for our nationhood was worth every effort spent to reach this momentous day.\n\nToday we are not separated into humans, elves, goblins or others, today we are all Reachmen, no matter our heritage or race."
# modifiers
 BR_reached_out: "Blue Reachmen Conspiracy Member"
 BR_reached_out_desc: "Times are changing and the old powers in the reach are crumbling before an ambitious new player, we’d do well to not stand in the way of the rising star."
 BR_vic_diplomacy: "Vic Diplomacy"
 BR_vic_diplomacy_desc: "Our diplomats can be found in every court across the reach and beyond, diligently turning hearts and minds towards our cause."
 BR_we_are_prepared: "We are Prepared"
 BR_we_are_prepared_desc: "A tension suffuses our realm, mercenaries exchanging subdued chatter and soldiers triple-checking the sharpness of their spears. The time for conflict is nigh and red ice will spread across the Reach."
 BR_commerical_networks: "Commercial Networks"
 BR_commerical_networks_desc: "With nominal control over the trade and exchange happening within our borders we can both reap many riches as well as open new  diplomatic channels, both official and somewhat more informal."
 BR_building_our_prominence: "Building our Prominence"
 BR_building_our_prominence_desc: "With famed architects and skilled builders on our side it is time to cement the place of the Reach as an urban opulence in the same vein as Anbenncóst or Castonath."
 BR_closer_ties: "Closer Ties"
 BR_closer_ties_desc: "Each day, more and more common people and people of note do not see themselves merely as residents of a certain city or region, but as being citizens of a united Reach. An excellent trend that should reach Reachmen in every corner of our domain."
 BR_southern_frontier: "Southern Frontier"
 BR_southern_frontier_desc: "The wild woods in the southern reach are by far the most dangerous region of our realm, as danger threatens both from monsters and foreign invaders alike. But with strong forts even these lands can be tamed."
