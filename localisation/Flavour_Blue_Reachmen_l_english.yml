# serpentgard
# missions
 Z21_centralize_the_order_title: "Ordering the Order"
 Z21_centralize_the_order_desc: "For as long as our order, the Knights of the Serpent, existed, we never felt much need for a cumbersome and complex hierarchy with a centralised command structure.\n\nWhile this self-sufficiency has served us well thus far, the growing number of novices joining our ranks and the rising threats looking to tear apart the Reach have forced us to rethink our methods. For in uncertain times like these we need to ensure all our warriors can mobilise as fast as possible.\n\nAnd we shall show our enemies that just like Malliath, many heads working as one can be nigh insurmountable."
 Z21_equestrian_traditions_title: "Equestrian Traditions"
 Z21_equestrian_traditions_desc: "Without a horse, a Knight is nothing more than a slightly better armoured, and far more arrogant, foot soldier. Therefore, the rearing and handling of horses is one of the first disciplines aspirants of our order must learn.\n\nEspecially as we rely on our own breed of Serpentheader horses.\n\nBeing well acclimated to the cold and of stoic demeanour, these horses are highly sought after by both our Knights and nobles alike. Thus, we should invest in their rearing and support efforts to proliferate this breed throughout all our stable holdings, all to ensure that our labour sites never lack reliable workhorses in times of peace and that our warriors never lack a sturdy mount in times of war."
 BR_knightly_oversight_title: "Knightly Oversight"
 BR_knightly_oversight_desc: "In recent months, we have been observing curious changes in the diplomatic activities at the courts of our fellow Reachmen. With growing frequency, our voice is the one that breaks stalemates in debates and induces changes to policy, while petitioners seek the support of our order directly instead of first heading to our nominal liege in Celmaldor.\n\nWhile some within the ranks of our order see this shift in power as a break of tradition and protocol, others encourage us to exploit our growing prestige to cement our position of authority in the Reach. Once Celmaldor is embroiled in enough turmoil, whether through a war they cannot win without us, or a… convincing enough and convenient series of adverse circumstances, we might even replace them as the leader of the Reach."
 Z21_expand_the_city_borders_title: "Expand the City Borders"
 Z21_expand_the_city_borders_desc: "Leading the League requires us to be richer and stronger than other cities. As we find ourselves scrutinized by other league members, it is ripe time for us to expand the city borders."
 Z21_maldorians_harbour_title: "Maldorian's Harbour"
 Z21_maldorians_harbour_desc: "For the longest time, the Reach was nothing more than just another strip of rural land, barely noticeable on the map of any would-be conquerors. This, however, changed forever with the arrival of Maldorian and his ship Whitespear. Over time, his people became true citizens of the Reach and the landing site of their Migrant Ship would grow to become one of the largest cities in our region, its majestic harbour filled with ships from Gerudia, Cannor and even the distant lands of Sarhal.\n\nAnd now that we have inherited this jewel of the Reach, we shall treat both it and Maldorian’s heirs with the same respect that any other Reachman deserves."
 Z21_knights_assemble_title: "Knights, Assemble!"
 Z21_knights_assemble_desc: "While the Knights of the Serpent possess an independence and freedom seldom seen in similar orders around Cannor, they are still bound to heed the call to arms in times of war, when the league is endangered by foes from abroad.\n\nAnd now, as we are once more embroiled in a conflict whose outcome might dictate the future of our very way of life, we must once more call upon them.\n\nSo go forth, brave knights! Assemble your host before our foes and beneath Malliath’s banner drive them back to whence-they-came."
 Z21_maldorians_heirs_title: "Maldorian's Heirs"
 Z21_maldorians_heirs_desc: "In recent weeks an increasing number of petitions and requests to see the Lord Captain have reached our order’s higher offices. While such requests are usually nothing out of the ordinary, most often coming from peasants seeking aid or chartering escorts for richer merchants, this most recent batch have all been coming from one individual: Sergeant Aeril ‘Silmadorian’ Serpentgard.\n\nAnd this certainly is not his first attempt either, with our records finding similar petitions from him dating back all the way back to shortly after he obtained knighthood.\nIn each one he calls for the same thing: “A grand quest to find the remains of Maldorian himself. For how can we call ourselves heirs of his deeds in life, when we do not properly honour him in death?”\n\nWhile in the past these requests have been stonewalled or conveniently ‘forgotten’ due to constrained resources and lacking manpower, our recent period of growth has changed things. As it stands, his request shall be granted and five of our finest vessels assigned to his command. And who knows, Malliath willing the lad might just succeed..."
 Z21_self_education_title: "Malliathodidactic"
 Z21_self_education_desc: "Behold Malliath, the Progenitor! First among dragons.\nBehold Malliath, the greedy! Desiring to consume our very gods.\nBehold Malliath, the slain! Head torn off and bested by son and father divine.\nBehold Malliath, the mountain! Body merging with Halanna itself.\nBehold Malliath, the lifegiver! For his death blesses the land with life.\n — Except from a Serpentgarder religious text.\n\nAs much as every peasant knows not to look a gift horse in the maw, so, too, must our knights learn not to discard knowledge and artifacts created by or obtained through less reputable means.\n\nAs without the greed of the great dragon our very own order would not exist today, leaving the Reach to be overrun by beasts, reavers, trolls or, infinitely worse, Alenics.\n"
 Z21_northern_raiders_title: "Raid the Raiders"
 Z21_northern_raiders_desc: "Many times foreign invaders tried to steal our freedom, and just as many times they failed miserably. With the home of quite a few of these raiders sitting but a few dozen miles to the north across the Frozen Pass, we have been forced to defend ourselves time and time again against their greed. These frigid Gerudian lands to our north are home to trolls, reavers, beautiful battle-maidens, skalds and the petty lords of Bjarnrik. The latter have long been a particularly nasty thorn in the side of the Reach. Since the Era of Black Ice, many a knight over the centuries has been able to recount at least one skirmish with their forces.\n\nLuckily for us, it is not easy for them to reach our lands, as they either need to circle the entire Giant’s Grave Sea on land or sail across the Frozen Pass.\n\nWhile the islands of the Frozen Pass can easily be blockaded by a proper fleet, we should still prepare for all eventualities. Therefore it is imperative for the protection of Serpentgard that we seize the islands and build up a strong military presence on them to ensure the safety and freedom of all Reachmen."
 Z21_reaffirm_our_mission_title: "Reaffirm Our Mission"
 Z21_reaffirm_our_mission_desc: "For the longest time the most important duty of our order has been the protection of the good people of the Reach against whatever beasts and monsters lurk in the deep forests and frigid wastes of these northern lands.\n\nAnd now, since our domain has expanded further westward we have received more and more troubling reports of a conflict between revanchist gnomes and equally sized, scaled monstrous creatures brewing in the desolate lands formed by the head of the Great Serpent. As it is our sacred duty to protect the commonfolk, both our own reachmen and the gnomish short-folk, we are dutybound to intervene. That doing so will also allow us to reclaim the sacred remnant of Malliath is merely a happy coincidence."
 Z21_knights_proclamation_title: "The Knight's Proclamation"
 Z21_knights_proclamation_desc: "If one would have predicted only a couple decades ago that the Knights of the Serpent would one day be the de jure rulers of the entire Reach, they would have been considered mad. But now, we have indeed ended up in this very situation.\n\nWhile it is a great achievement indeed, it has laid bare a fundamental flaw of our system of governance as well. While the rigorous training regime of our knights serves to make them capable on the battlefield and self-sufficient while away from our forts, their education is rather lacking in matters of statecraft. Luckily, due to the long independence of the great cities in our realm, we have plenty of scribes and clerks to draft into the ranks of our bureaucracy. With their help, we may train up future generations of knights to rule our vast holdings, as well as retrain knights for administrative tasks once they become too old or injured to continue battling monstrous foes, whether it be beast or Alenic. From this day on, we therefore proclaim that a new type of knight has been born, not armed with steel, faith and gunpowder, but instead with ink, quill and paper to fight waste and corruption wherever they may find it.\n\nAfter filling out the appropriate forms of course."
 Z21_smart_kobold_pious_kobold_title: "Koboldependence"
 Z21_smart_kobold_pious_kobold_desc: "When we first marched against the kobold threat, we expected the same savagery we already encountered when the host of Maldorian battled against the Sea Trolls of old that once endangered the Reach.\n\nInstead, what we found was a far more sophisticated foe, and many a good knight lost their life to devious traps instead of open confrontation on the battlefield.\nMore curious still, when we did rout them, the survivors and prisoners we took did not act as rabidly as the gnomes described them to us, instead looking at our knights and banners with an almost reverent expression.\nIn recent days, some of the Kobolds even made the journey to our main citadel and prostrated themselves before the [Root.Monarch.GetTitle] and offered crude, dragon shaped trinkets to [Root.Monarch.GetHerHim].\n\nPerhaps they are not savage monsters at all, but a misunderstood gift from Malliath."
 Z21_guardians_of_the_two_heads_title: "Guardians of the Two Heads"
 Z21_guardians_of_the_two_heads_desc: "When the decision was made to properly integrate the kobolds into our order, it was a choice questioned by many. But now look at them, gallantly riding along their human comrades on their scaled mounts. While they learned the values of chivalry and civil conduct from us, in turn they taught us the secrets behind their many inventive traps - an invaluable aid to our efforts in keeping the good people of the Reach safe.\nWhile theological debates about the proper role of Malliath in the Regent Court still drag on, we have, for the most part, settled any unrest, excluding the occasional drunken brawl. \n\nStill, with the first groups of bold kobold recruits standing ready to ascend above their station as mere hatchlings, it is up to [Root.Monarch.GetTitle] [Root.Monarch.GetName] to decide whether they shall be fully integrated into the order itself or form a subservient host of their own."
# modifiers
 Z21_expanding_the_branch: "Expanding the Branch"
 Z21_expanding_the_branch_desc: "The province is abuzz with both knights and labourers, settling into their new homes and manning the growing array of outposts and fortifications."

 Z21_head_branch_1: "Rudimentary Headquarters of the Knights of the Serpent"
 Z21_head_branch_1_desc: "Converted Storerooms and hastily assembled meeting halls serve as the main base of operation for our order. ‘Tis not much, but enough for them to perform their important work."
 Z21_head_branch_1_zoc: "Zone of Control: Rudimentary Headquarters"
 Z21_head_branch_2: "Established Headquarters of the Knights of the Serpent"
 Z21_head_branch_2_desc: "A wing of the Eyegard fortress has been dedicated for the operations of the Knights of the Serpents. Within, commanders and knights are busy peering over maps to devise stratagems and evaluate defensive positions alike."
 Z21_head_branch_2_zoc: "Zone of Control: Established Headquarters"
 Z21_head_branch_3: "Grand Headquarters of the Knights of the Serpent"
 Z21_head_branch_3_desc: "The majority of the Eyegard fortress is occupied by the administration of the Knights of the Serpent, its walls patrolled by only the worthiest of knights, while within the fortress plans for the future of our realm are devised."
 Z21_head_branch_3_zoc: "Zone of Control: Grand Headquarters"

 Z21_branch_order_1: "Minor Branch of the Knights of the Serpent"
 Z21_branch_order_1_desc: "Wooden outposts and palisades are occasionally found in the region, with small knightly patrols to assist the main regional garrison and alert them to any threats."
 Z21_branch_order_1_zoc: "Zone of Control: Minor Branch"
 Z21_branch_order_2: "Established Branch of the Knights of the Serpent"
 Z21_branch_order_2_desc: "The order’s outposts have grown in number and are fortified with moats and drawbridges alike. Elven scouts assist our patrols with their knowledge and farsight."
 Z21_branch_order_2_zoc: "Zone of Control: Established Branch"
 Z21_branch_order_3: "Major Branch of the Knights of the Serpent"
 Z21_branch_order_3_desc: "Properly fortified outposts of stone are frequently found across the province. Many are manned by copious kobold cohorts , all eager to try out their newest traps on unsuspecting outlaws and villains."
 Z21_branch_order_3_zoc: "Zone of Control: Major Branch"

 Z21_warhorse_production: "Warhorse Breeding Farms"
 Z21_warhorse_production_desc: "Vast pastures and large stables dot the rural areas of the province, with massive herds of our warhorse breed grazing and prancing about. Their neighs are as unavoidable as their manure."
 Z21_maldorians_sword: "Maldorian's Sword"
 Z21_maldorians_sword_desc: "After a long and arduous quest, Maldorian’s remains and blade are back where they belong. His remains are buried beside his fellow knights and his blade sits at the side of our commander, a reminder of the promise made towards the freedom of the Reach as a whole."
 Z21_lessons_of_malliath_1: "Lessons of Malliath"
 Z21_lessons_of_malliath_1_desc: "Given the widespread sharing of Malliath's deeds, especially through a manuscript titled “The Dragon’s Dogma”, it is no wonder that our knights and citizens are all too eager to exchange ideas, easing the adoption of new advances and spreading our faith."
 Z21_lessons_of_malliath_2: "Revelations of Malliath"
 Z21_lessons_of_malliath_2_desc: "When introducing our kobold friends to our faith and texts like the Dragon’s Dogma, they took to it all too eagerly, even more so with their own passages added to it. Soon, a second edition was spread, syncretising our knowledge with theirs to further ease the transfer of his wisdom, no matter from what dark it may have originally arisen."
 Z21_call_for_support_cd: "Call for Support Cooldown"
 Z21_undermanned_order: "Undermanned Order"
 Z21_undermanned_order_desc: "Outposts are left abandoned and garrisons stretched thin, as our knights march off to war. But such is the price of victory."
 Z21_order_of_malliath_boost: "Malliath Zealotry"
 Z21_drake_knights: "Drake Knights"
 Z21_drake_knights_desc: "Eager and ready, our diminutive kobold kompatriots stand proudly beside their fellow knights. While their taller compatriots charge into battle with Malliath's roar, these savvy trappers shall ever tip the scales in our favour."
# events
 flavour_blue_reachmen.3.t: "Lessons of Malliath"
 flavour_blue_reachmen.3.desc: "Therefore, when looking at Malliath through the lens of your common Cannorian citizen you can see that he is naught but a despoiler and entity seen in a similar light to the Infernal court, whereas in the Sagas of the Skalds…” Yarric yawned as the instructor at the podium kept pontificating about how a sacrifice of evil can be used for good or somesuch.\n\nIncreasingly desperate, he was just waiting for that large gnomish timepiece in the room to sound, marking the end of the current lecture. He could barely wait for the actually interesting lessons to begin, especially the ones where he might be allowed to try out those new firearms he saw being shipped in recently.\nStill, as he looked at the timepiece, he couldn’t help but think about the story of how the Order came into possession of this delicate piece of gnomish craftsmanship. Decades ago, a knight saved a gnomish merchant who out of gratitude commissioned the timepiece for his ‘gods-sent’ saviour. Ironic, he thought, for surely the bandits that attacked said merchant surely also thought some god sent the merchant their way, no?  Or what about his own life, surely some wicked deity was responsible for him growing up as an urchin and the unsavory things he had to do and endure to survive. Yet still…that same destitute upbringing taught him the skills which, in a roundabout way, got him into the class. For he once tried to steal a knight's horse and instead of being punished after the hours-long pursuit that followed, he was offered the opportunity to become a squire by the reluctantly impressed knight. \n\nBut…but what if all those things would have happened anyway? What if no deity had any actual direct influence on a person's life? What if instead they only manipulated circumstances so that the right person could be in the right place to turn a source of evil and corruption into something that instead aids the common good?\n\nYet, just as he was raising his hand to ask about that epiphany of his, the grand timepiece rang out. It seems such philosophical quandaries would have to wait for another time."
 flavour_blue_reachmen.3.a: "Even from the vilest deeds, good can still spring forth."

 flavour_blue_reachmen.4.t: "The Serpent’s Offer"
 flavour_blue_reachmen.4.desc: "[Z22.Monarch.GetTitle] [Z22.Monarch.GetName] stood contemplatively before the window of [Z22.Monarch.GetHerHis] study, looking out over the bustling market below, the only audible sounds to him being the crackling of the fireplace and the light rain pattering against the window pane. In the crowd below, one man in Serpentgarder colours was of particular interest to [Z22.Monarch.GetHerHim]. Said man had gathered quite the crowd around him, no doubt by telling rousing tales of the noble deeds of the knights, both domestic and on the grand battlefields.\n\nSaid interest, though, was not just borne from the claims of reactionary courtiers that the knights were trying to undermine Celmaldor's authority within the Vic League, but rather due to the undeniable proof of their intentions in the form of an ultimatum delivered to [Z22.Monarch.GetHerHis] office only moments ago by the very same man below.\n\nWith a sigh, [Z22.Monarch.GetSheHe] turned back to the contents of said missive which in contrast to the theatrics below was plain, neat and unquestionably simple: Serpentgard would take charge of the League and all its members, in order to ensure the safety of all citizens of the Reach. Should Celmaldor acquiesce, it was assured a suitable level of independence within the League.\n\nA part of [Z22.Monarch.GetHerHim] wanted to simply toss this brazen sign of Serpentgarder ambition into the fireplace and throw the fool and his demands out of the city, yet another part of [Z22.Monarch.GetHerHim] held onto that dream of peaceful retirement. Simply living in a fine log cabin, sitting on the porch with a finer bottle of wine while watching the sun sink into the sea without having to worry about the admittedly tiring matter of politics.\n\nStill, no matter the choice [Z22.Monarch.GetSheHe] would make, today [Z22.Monarch.GetSheHe] would become a very controversial [Z22.Monarch.GetWomanMan]."
 flavour_blue_reachmen.4.a: "An early retirement does have its appeal..."
 flavour_blue_reachmen.4.b: "Burn the letter and throw its ashes and the courier out of the city!"

 flavour_blue_reachmen.5.t: "Of Elves and Men"
 flavour_blue_reachmen.5.desc: "Greetings Sister,\n\nYes yes, I know, the runaway elf has indeed neither been eaten by any of the beasts you doubtlessly imagine reside up here in the north nor has he lost his fingers to the freezing cold either, isn’t that grand?\n\nStill, despite the snark, I do hope you and our redglade kin have been faring well since last we wrote to each other. And did our brother Arfil ever get his name back from that Fey?.\n\nAlso, thank you again for organising that shipment of fine lumber from the glades, it sure made me and my carvings the talk of the town. Some rich Celmaldorian merchants even commissioned me to carve figureheads for their vessels. Sure never expected me and my ‘silly wooden trinkets’ to get that far, eh? One of my latest creations might even finally surpass the bow I left you when I departed.\n\nBut, now for the actual purpose of this letter, it seems - much to your surprise I imagine - that even poor fools like myself can find love in this turbulent world of ours. One of the Serpentgarder knights stationed here seems to have stolen my heart, just not as literally as poor Amarien lost hers to a nymph. And yes, we’ve done all the things you find in your romance novels, sister: moonlit walks, fine dining, riding out together and so forth.\n\nBy now it’s been close to one and a half years of us getting together officially and… well, the business of marriage has come up, a bit soon in mother's eyes I presume, but I can't afford to wait, as even for an elf I am getting up there in years.\n\nAs such, I have a favour to ask. Alongside this letter you’ll find both an invitation to the wedding as well as a collection of poems from Oloris Truehunter. I’d like each of you to learn at least one of the poems contained within to recite when the day comes, even if I imagine you’ll likely know the whole tome by heart soon enough. \n\nSee you then, dear sister, Yarric is definitely looking forward to meeting his soon-to-be extended family of in-laws.\n\nYour brother, Ivran, husband-to-be."
 flavour_blue_reachmen.5.a: "May they live happily ever after."

 flavour_blue_reachmen.6.t: "Maldorian’s Legacy"
 flavour_blue_reachmen.6.desc: "Where once the blood of Maldorian and the elves of his fleet was only found in the veins of the direct descendants of these legendary sailors, more and more children of the Reach now show the telltale signs of those blessed people mixed with the sturdiness found in the human inhabitants of the Reach.\n\nPerhaps a sign of things to come and of a Reach that will forge its varied peoples into one unbreakable alloy."
 flavour_blue_reachmen.6.a: "The more the merrier."

 flavour_blue_reachmen.7.t: "The Body"
 flavour_blue_reachmen.7.desc: "Greetings Commander,\n\nI apologise for a lack of communications in recent months, but the seas have not been kind to our messengers as of late.\n\nBut let it be known that after many long months of searching we have, at least partially, succeeded in our quest. While exploring one of the many frigid isles of the Giant’s Grave we came across an amazing sight, two figures frozen in a large block of permafrost. One of them as large and broad as several men, body covered in wounds and cuts as well as frozen blood gushing out of a massive neck-wound. While the other was unmistakably an elf, wearing a battered, yet incredibly finely wrought armour with a sigil emblazoned on it that made his identity unmistakeable: Maldorian!\n\nAdditionally, we did discover that we were not alone there on the isle, for we met a truly remarkable person, Iona Skjaldsdottir, a Gerudian Skald, and a harpy no less, who was studying the encased scene in hopes of learning the tale behind it.\n\nShe was more than happy to part with her gleaned knowledge after we introduced ourselves and shared our own knowledge regarding the figures encased in ice. According to Iona’s research, the icy display shows the final duel of Maldorian and the warchief of the Sea Trolls of old. The heroic elf appears to have been just about to cut the fiend down after a lengthy fight, but not before the warchief could cast a final spell, entombing both of them in unmelting ice.\n\nThe location of his sword, however, remains a mystery, as the blade frozen alongside Maldorian has little in common with the craftsmanship of his armour or similar elven artifacts that survive to this day. Our leading theory so far is that his original blade was likely lost in an earlier skirmish with the troll menace and is still buried on a forgotten battleground somewhere in the Frozen Pass, waiting to be reclaimed by Maldorian or a worthy successor.\n\nAdditionally, to aid in our search, I’d like to request leave and permission to travel to Skaldol alongside Iona, both to grant our crew some leave as well as finding more concrete hints regarding the whereabouts of his sword in their vast skaldic archives.\n\nMalliath’s might be with you.\n — Captain Aeril Silmaldorian Serpentgard"
 flavour_blue_reachmen.7.a: "And may Malliath be with you in turn."

 flavour_blue_reachmen.8.t: "The Blade"
 flavour_blue_reachmen.8.desc: "So...the lad has done it then? Found both your founder's body and his blade after years of being called a fool and dreamer?” the goblin remarked, a taunting smile on his face as he studied the expressions of his opposite. Usually he despised having such important negotiations interrupted, but the expressions of disbelief, shock, awe and speechlessness on the usually oh so stoic face of the serpentgarder commander was worth its weight in gold. ‘Course, by now probably every soul in the Reach has heard of young Aeril and his escapades, not the least because merchants like Colc kept telling everyone about it.”\n\n“Y-yes…stuck in a frozen tree in some long forgotten grotto. Even found himself a skald as a  wife in the process.” [Root.Monarch.GetName] muttered in response.\n\n“Oh really? I’m sure you’re already planning a grand parade for the returning hero, no, legend, eh? I might just know someone who can get you all you need for a phenomenal price. Something I’m sure you’ll appreciate, what with all the expenses coming your way: the phenomenal reward you’ll buy for him, a grand steed, land for his own castle, not to mention statues of him every-.”\n\n“Enough.” the Commander intervened, hand slamming down onto the wooden desk before him. “Haggle over things with our quartermaster, for we won’t need your help with picking a reward, as I imagine my council would have my head if I offered him anything but the opportunity to succeed me as leader of our order."
 flavour_blue_reachmen.8.a: "May his rule be long and prosperous."

 flavour_blue_reachmen.9.t: "Kobold Governance"
 flavour_blue_reachmen.9.desc: "Yarric couldn’t help but feel a little like someone was pulling a prank on him as he re-read the letter he received just now. He looked to the two kobolds who brought it to him, who in turn looked at him with a mixture of respect and awed reverence. But no, the letter and seal were indeed legitimate and informing him of the honour of being chosen to train his first set of squires. He heard of the battles around the Dragon Coast of course, how these scaly fellows defended their holes with a far greater ferocity than their small frame might suggest. But still, were they truly knightly material? Yet in the end that decision was out of his hands.\n\nYears later, as he watched the knighting ceremony before him, he couldn't help but laugh at himself and his former doubts, for in the time since these two became his squires they more than proved their worth. Both were as valorous and dedicated as the best of them, and had a good head on their shoulders, useful both for coming up with plans or bold schemes as well as for introducing some drunkard or rowdy citizen to a headbutt at just the right height.\nUnsurprisingly, it was his voice that cheered and roared the loudest when his protégés were called forth and rose as newly minted knights.\n\nWhen all was said and done a hushed silence fell across the hall as a messenger stepped forth with a scroll, proclaiming the decision made regarding the long discussed fate of the scaled knights within the order. At long last it would be settled whether they would join the order’s rank as full members of the Order of the Serpent, or be granted the honour of forming their own order in their homeland.\n\n“With this decree,” the elf started, “it is decided that the Scaleknights are granted the honour of..."
 flavour_blue_reachmen.9.a: "...administering their lands through their own Order of the Dragon."
 flavour_blue_reachmen.9.b: "...standing as full members of the Order of the Serpent."

 flavour_blue_reachmen.11.t: "Growing Kobold Hoardings"
 flavour_blue_reachmen.11.desc: "Once again the kobolds of the Dragoncoast have proven how resilient and tenacious they truly are. Our benevolent rule over the province of [Root.GetName] has allowed the local kobold population to thrive again and return to their caverns and homesteads alike, yet they now worship our own gods and not their own.\n\nAnd it does not seem like they plan on leaving anytime soon."
 flavour_blue_reachmen.11.a: "Praise Malliath!"
 flavour_blue_reachmen.11.b: "Praise Malliath! But don’t overdo it. (Hide these events henceforth)"

 flavour_blue_reachmen.15.t: "Celmaldor Accepts"
 flavour_blue_reachmen.15.desc: "Rejoice, oh faithful Serpentgarders!\n\nWhether through diplomatic guile or divine intervention, Celmaldor has seen the wisdom in our offer to assume the mantle of leadership over the League.\n\nNow nothing shall stand in our way as we work to unify the Reach under our guidance."
 flavour_blue_reachmen.15.a: "For Malliath! For the League! FOR THE REACH!"

 flavour_blue_reachmen.16.t: "Celmaldor Rejects"
 flavour_blue_reachmen.16.desc: "Curses!\n\nFor our messenger to Celmaldor has not returned with a signed acknowledgement of our new role as leader of the League as we had hoped for. Instead he merely brought a handful of ash and banishment from the White Harbour until we show proper penitence for our audacity.\n\nAs much as it hurts to admit, it seems the only way for us to assume control over the League now is by marching on Celmaldor and forcing it to accept our superiority in a bloody war of brother against brother."
 flavour_blue_reachmen.16.a: "May the Gods forgive us."
