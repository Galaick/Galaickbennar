 A93_not_empire_exists:0 "If the Empire of Anbennar no longer exists:"
 A93_when_we_form_eoa_tt:0 "If we form the Empire of Anbennar, the following effects will happen:"
 A93_eoa_modifier:0 "Protector of Esmaria"
 A93_prestenn_prismatics_mod:0 "Prestenn Prismatics"
 desc_A93_learning_the_method_mod:0 "While novel goods are being in this province, the scale of the production remains limited, we must increase our production capacity in order to fully realize this province's potential."
 desc_A93_well_paid_mercs:0 "Timely payments, countless pleasures, plentiful contracts, and a prestigious dynasty has transformed Estallen into a true heaven for mercenaries willing to earn an honest pay."
 A93_merc_ideas_tt:0 "We will gain §Y50§! military power for each idea we have taken in the §YMercenary§! idea group."
 A93_well_paid_mercs:0 "Well-Paid, Well-Sexed, Glory to síl Estallen!"
 A93_no_lib_from_integration_policy_tt:0 "The §YNobility Integration Policy§! estate privilege will no longer give Subject Liberty Desire."
 A93_upgrade_relations_mod_tt:0 "If the §YEstalleni Courtesans§! modifier is present, it will become §Ypermanent§! and §Yupgraded§! to grant an additional §G+10%§! Improve Relations Modifier."
 desc_A93_prestenn_prismatics:0 "Marion síl Prestenn's workshop located in Terr has become famous across cannor for its prismatic color effects, commanding much higher prices than normal dyes."
 desc_estalleni_silks:0 "Thanks to direct patronage from house síl Estallen, the city of Estallen proper has become home to major silk farms and workshops, drastically increasing its output of exquisite silk."
 desc_up_estalleni_courtesans:0 "Our courtesans have now become fluent in the language of intrigue and politics, and our court is already producing theories of what they call 'soft interrogation', allowing our agents to extract valuable information without needing to shed a single drop of blood or levy any threats."
 desc_estalleni_courtesans:0 "They say talking for half an hour without saying a word is the art of a true of a politician, but what do they talk about when they are close to a trusted companion, a partner, or an especially charming lady?"
 desc_estalleni_mercenary_relations:0 "We have proven our ability to honor the contracts we sign, this alone is enough to gain the attention of many mercenary bands."
 desc_estallen_imperial_heartland:0 "Damerians, Wexonards, the Lorentish alike all failed to rule the Empire from the fringes. Not so much the case for Estallen and Esmaria, our central position within the continent affords us a level of control on the provinces that would make even the most hardcore of EU5 minmaxxers blush."
 desc_A93_eoa_modifier:0 "Empire or not, Estallen's role as the largest and most propserous of Esmari realms has always been clear: we are the protectors of Esmaria, not just the land, but also the people, the culture, and the legacy.\n\nBy the grace of our divine ladies, let us wear this mantle with pride and do our people proud!"
 desc_lovers_of_ryala:0 "The Ryalites and Minarites bickering endlessly might, afterall, not be that bad. It gives us a destination to send our newly recruited diplomats to so that, they too, could learn the ability to speak for hours without making a single coherent argument or making anyone too angry."
 desc_heirs_of_balgar:0 "We have managed to convince many smallfolk to lend us their expertise, this has had especially notable effects in the construction sector which has faced a surge in available workforce."
 desc_children_of_esmaryal:0 "With a strong grasp over Esmaraine, the capital of Esmaria, we have become the custodians of Esmaryal's Temple, greatly increasing compliance with our rule."
 #insights
 estallen.2.tt:0 "For the longest time, Leslinpár has been our peer rival, undercutting our merchants and being a pathetic nuisance in our path for Esmari dominance. This shall end today as we we march into their city, and take the wealth that should have been ours all along!"
 estallen.3.tt:0 "We shall do all in our power to mediate between our own Minaran clergy and the Ryalan clergy of Ryalanar, making us capable of maintaining more diplomatic relations."
 estallen.4.tt:0 "Esmaryal is known as the mother of all Esmari, by protecting her main temple in Esmaraíne, we are sure to make people more content with our rule."
 estallen.5.tt:0 "Being the new protectors of their temple in Silverforge, we should not face much resistance convincing the Balgarites to lend us their expertise. Furthermore, §Thaving Silverforge as a loyal vassal while they are an elector may provide us with a once-in-a-lifetime opportunity!§!"
 estallen.6.tt:0 "Our ascension to the imperial throne will afford us unprecedented power, allowing us to rule the Empire in a much more efficient way."
 estallen.7.tt:0 "Estallen is already one of the Empire's richest provinces, but with a little bit of effort we can drastically increase its trade capacity as well as a blooming center of Esmari culture."
 estallen_esmari_fashion.tt:0 "If not yet present, §YEsmari Fashion§! is guaranteed to spawn in §YEstallen§!."
 estallen.8.tt:0 "Using our agents in Lencenor, we will be able to finally uncover the secrets to sericulture!"
 estallen.9.tt:0 "We will finally be able to realize the full potential of our provinces and drastically increase the production of our newly acquired goods!"
 estallen.10.tt:0 "The Pinklady Marauders have once again been wrecking the river parties, we should see what happened this time..."
 civi_was_here:0 "Trained courtesans shall be sent to foreign courts in our quest for political ascension within the Empire, giving us a §Ylimited opportunity§! to quickly increase our standing inside and outside the princely institution."
 estalleni_courtesans.tt:0 "Completing '§YThe Value of Friendship§!' before this modifier expires will cause the mission to yield greater rewards!"
 estallen_capstone_tooltip:0 "All of the following must be true:\n        §Y[Root.GetName]§! is the §YEmperor of EoA§!.\n§Y        Every member of the EoA§! has §Yless development§! and             a §Ysmaller army§! than §Y[Root.GetName]§!.\n        At least §Y4§! Electors are supporting §Y[Root.GetName]§! to become          the next Emperor."
 estallen_low_esmar_prosperous:0 "The state of §YLow Esmar§! is §Yprosperous§!!"
 estallen_no_cloth_anti_troll:0 "Center of Esmari Fashion"

 #present in Event file
 flavour_estallen.1.t:0 "An Esmari Rose"
 flavour_estallen.1.d:0 "Many among our Esmari brethren view our choice to join the Wexonards in their crusade against Dameria with contempt; to them, this decision might look like a betrayal. This view, rooted in emotion and shortsighted, is predictably wrong. Afterall, there is a more important question to be asked: why would we ever side with the Damerians? The Damerians have, over the centuries, done all in their power to keep the Esmari weak, treating them as mere subjects, treating our culture as inferior to theirs, and quashing all hopes of a functional, prosperous Esmari Grand Duchy.\n\nOur first step, of course, was the breaking of Leslinpár. Long have the Párians stood against everything we have believed in, everything we've attempted to achieve. There can be no new Esmaria so long as that obnoxious city still stands. We convinced Count Frederic of Terr to enter into an alliance with us in order to partition Leslinpár between ourselves, and launched a surprise assault in the latter half of the war. The Wexonards, of course, were more than happy to hear our vague promises of support. It would have been a crushing victory, if not for Terrman incompetence at Tendergrove... but it doesn't matter. Leslinpár's survival was a fluke. Though our victory has been delayed, none can doubt that the Párians are too weak to stand against us without blind luck on their side.\n\nThe so-called “Grand Duchy of Esmaria”, set to lord over us before it was dissolved in the first Lilac War, was nothing but a sham. It was weak, decentralised, and parasitic; siphoning our hard-earned taxes towards Esmarainé just so that those gluttonous and lustful dukes might grow fatter by the day. Our choice to join the Wexonards and the Lorentish was not a decision made out of affection; but one out of practicality. Only through breaking of the old order could we usher in a new, prosperous future for Esmaria.\n\nNow that goal is achieved, we are the strongest of the Esmari riverlords, but our duty, and our commitment, has just begun; and it begins here, today! We must secure our old claims quickly, and accrue enough power to deter the Wexonard hounds from smelling blood in Esmar’s waters."
 flavour_estallen.1.a:0 "The waiting game is over, let us dance!"
 flavour_estallen.2.t:0 "The Sack of Leslinpár"
 flavour_estallen.2.d:0 "While our claims in the upper Esmar basin were rooted in ancestral holdings and feudal traditions, the rivalry between Estallen and Leslinpár finds its origins in realpolitik. A fact which surfaced after the breaking up of the Kingdom of Esmaria as a result of the Treaty of Anbenncóst.\n\nLindelin of Estallen’s noble struggle against Leslin of Leslinpár was rooted in her mission of securing our realm a viable economic space. As Leslinpár sits on the chokepoint of upriver Logrodainé trade, they would simply use their position to purchase premium Estalleni products for cheap and sell them to their own customers upriver for far higher profits. This was the case for centuries on end, until today.\n\nNow, having acquired Leslin’s home by the right of conquest, we can address this generational injustice; we shall take all that is valuable to the Párians, just as they took what was ours for so many years, and bring them to Estallen, the true center of Esmari power."
 flavour_estallen.2.a:0 "Thus unto our foes."
 flavour_estallen.3.t:0 "Ryalan Traditions and Estalleni Liberties"
 flavour_estallen.3.d:0 "Esmaria is the land of goddesses; this is known. While the god-mother Esmaryal enjoys widespread veneration, her daughter Ryala and, by extension, Ryala’s deified champion, Minara, also enjoy major reverence.\n\nEstallen, while the largest of the Riverlord Realms, is in the minority of states that revere joyful Lady Minara as its patron goddess. For the longest time, there has been a divide in Esmaria between the snobbish and condescending clergy of Ryala with their rather prudish views on the matter of intercourse and worldly pleasure, and adherents of Minara who argue that such restrictive behaviour only results in pushing doubting individuals away from the teachings of the Court, not towards it.\n\nAs the new overlords of Ryalanar, we now stand burdened with the responsibility to mediate this theological dispute. Our stance is of course clearly in favor of our lovely Lady Minara, but we must take care not to alienate our new subjects and their supporters in the rest of Esmaria.\n\nWhat if we were to take a page out of Lady Minara’s own playbook and pretend the problem does not exist until it goes away?"
 flavour_estallen.3.a:0 "By Minara’s heaving bosom! What a genius solution!"
 flavour_estallen.4.t:0 "Children of Esmaryal"
 flavour_estallen.4.d:0 "Even if Estallen is devoted to Lady Minara, it is undeniable that Lady Esmaryal, the God-Mother, is the patron of all Esmaria. For the Esmari, it is not a question of whether she is worshipped, only a matter of the degree to which prayers are directed to her, going from swearing by her grace to full-on iconoclasm in certain regions.\n\nIndeed, it is by her grace that our rivers flow and feed our lands, it is by her grace that our children grow strong, and by her grace that no foreign foe has broken the will of our people.\n\nThe least we can do, as her devout followers and new protectors of her main temple, is to honor her family, as she has done for ours, and ensure that the God of Knights, Adean, her son, the Goddess of True Love, Ryala, her daughter, and the ruler of the court, Lord Castellos, her husband, are revered and held in the highest of regards, their clergy patronized, and their temples well maintained."
 flavour_estallen.4.a:0 "Long live the mother of all Esmari!"
 flavour_estallen.5.t:0 "Legacy of Balgar the Builder"
 flavour_estallen.5.d:0 "Balgar is somewhat of an anomaly in the Esmari pantheon, for his origins lie in the far away lands of Escann and the even more remote Dwarovar. Yet his kin, the dwarves of Silverforge, keep his temples lit during the night, pray to him, and consider themselves the bearer of his legacy.\n\nThey are enjoined in this by many smallfolk across the region, including Giberdi gnomes and even the halflings residing in Deamóine and elsewhere.\n\nThis suits us just fine, for Balgar’s eye for monumental grandeur shares much in common with the Estalleni desire for perfection, be it in crafts or weaves. Having brought his devout followers under our dominion, we shall do our utmost to honor his legacy and proclaim ourselves the patron of all smallfolk in Esmaria."
 flavour_estallen.5.a:0 "May our bonds grow as strong as Castanor’s white walls!"
 flavour_estallen.6.t:0 "The Heart of An Empire"
 flavour_estallen.6.d:0 "Damerians, Lorentish, Wexonards, powerhungry hypocrites one and all, now kneel before our splendor and witness the glory of a unified, resurgent, and determined Esmaria. Located in the center of the Empire and in a position to spread justice across it, Estallen is now the beating heart of Anbennar!\n\nWe, unlike all those thirsty hounds, believe in the dream of unity, Anbennar to us is not a mere experiment; it is an article of faith. So it shall be, for Estallen’s dream to bring Esmaria to the forefront is now realized; And we have set out on this undertaking not out of selfish greed but to ensure stability and prosperity in the Empire at large, and now we are finally in a position to enforce it.\n\nLet it be known that the Empire of Anbennar is back on the path set out by its august founders, led by the most sophisticated ruler of them all, the most enlightened, and the wisest.\n\nThe age of Esmari Emperors has just begun!"
 flavour_estallen.6.a:0 "Triumph! Esmaria must triumph!!"
 flavour_estallen.7.t:0 "Esteemed Estalleni Establishments"
 flavour_estallen.7.d:0 "Estallen is, as some say, the center of the most sophisticated fashion, wildest parties, and most exquisite pleasures in the empire. Having lived all their lives here in this blessed realm, many Estalleni do wonder how others could possibly live such boring and joyless lives if what is ordinary in Estallen is considered ‘decadent’ or ‘taboo’ in other realms?\n\nIndeed, many like to fool themselves by pretending the joy of worldly desires is a lesser endeavor and their pursuit somehow against divine guidance. How laughable! If they are so pure of heart, then why do they spend hundreds of crowns just to hire a single barge and fill it up with the most desirable of courtesans, songstresses, and performers to enjoy Esmari river parties?\n\nNay, we say. Us believers of Minara know better; to live honestly and joyfully IS a life led according to divine guidance. Others will come to see it the same way we do, sooner or later.\n\nNay, we say. Us believers of Minara know better; to live honestly and joyfully IS a life led according to divine guidance. Others will come to see it the same way we do, sooner or later.\n\nIt is, however, useful to promote the many esteemed establishments in our realm and to fully embrace our identity, for the truth about the wanton nights in Estallen is the best draw for our establishments we could hope for."
 flavour_estallen.7.a:0 "Living honestly is the only life worth living."
 flavour_estallen.8.t:0 "The Key to Sericulture"
 flavour_estallen.8.d:0 "Having grown considerably in wealth, much of our high society spends their income procuring luxury fabrics such as silk at exuberant prices from the elves of the Redglades or even from far-off Bulwar, when that income could be spent here with our own talented designers and tailors instead… and in due course be paid as tax to the treasury!!\n\nIt is rumored that the secret behind the production of silk, unlike say mining ores or shearing sheep for wool, is all about knowing how to properly care for the silk worms.\n\nQuite fortunately, many Estalleni courteseans visit Lencori courts and even the Redglades itself from time to time. We simply must remind these ladies of their duty towards their own people and have them determine just how talkative these elven cultivators and Lencori silk traders are when bedded on soft silken pillows."
 flavour_estallen.8.a:0 "So, how was the day at work, darling?"
 flavour_estallen.9.t:0 "The Pink Jewel of Esmar"
 flavour_estallen.9.d:0 "Our efforts to perfect the methods of producing our own silk and dyes have gone swimmingly, not only has our economy benefitted greatly, but we have secured our place at the forefront of fashion and cultural expression. Not just in Esmaria, no, not just in the Empire, no, in all of Cannor!\n\nEstallen has been dubbed the ‘Pink Jewel of Esmar’. It is not uncommon for a foreign duke to look like a common peasant amongst Estalleni high society as they make it a point to stay on top of popular trends, break the barriers of old conservatism, push towards the horizon at rapid pace, and elevate the fashion industry higher and higher. Many in our court also find it admirable that other Esmari nobles have tried their best to keep up with us, despite their limited opportunities to acquire the latest fashions, whereas other uncultured foreigners are lagging hopelessly behind.\n\nWhile many expect this cosmopolitanism to be confined to our major cities, this cannot be further from the truth; in fact, the current golden age would not have been possible without the Terrmen adopting and elevating the art of dye production. One man in particular, Marionn síl Prestenn, a former painter and novice mage, has distinguished himself due to his almost otherworldly talent for the art of dye-mixing. He now produces a type of enchanted dye that, when fitted specifically to Estalleni silk, produces a prismatic effect and changes color depending on lighting, emotional state of the wearer, and surges of mana.\n\nEstalleni nobles, mages, courtesans, artists, singers, performers, and the like, alongside other sophisticated Esmari, can now be seen wearing everything from token tight, form-fitting dresses and bodices to luxurious cloaks, intricate laceworks or prismatic suits engraved with filigree works. Ours is now a land where natural beauty blends seamlessly with human creativity."
 flavour_estallen.9.a:0 "Oh, I’m looking!!"
 flavour_estallen.10.t:0 "A Pinklady Marauder and the River Party"
 flavour_estallen.10.d:0 "“You should’ve seen the barge afterwards.”\n\nRean lowered her teacup, “I’ve heard the stories, in one, the marauder throws a man out of a window, the other says the reaver stabbed a duke.”\n\n“Neither is true.”\n\n“So what actually happened?”\n\nEvellen smiled into her tea, “Well, it began rather innocently:”\n\nShe remembered the man approaching her, Aumil-something was his name, she thought, but he’s gone down in stories as the Marauder. At first, Aumil made a surprisingly earnest attempt at a conversation.\n\nThey had been speaking for about five minutes when Aumel’s eyes drifted past her.\n\n“Oh, for fuck’s sake.”, he murmured.\n\nEvellen turned to see a tall, broad-shouldered, and well dressed man approaching, his face less scarred than the Marauder, yet eyes no less bloodshot.\n\n“That bad?” Rean asked.\n\n“Yeah, they already hated each other.”\n\nThe Reaver stepped beside Evellen and gave her a perfectly respectable bow.\n\n“My Lady.”\n\n“Good Sir.”\n\n“Enjoying the evening?”\n\n“Immensely, kind of you to ask.”\n\nThen the two men looked each other in the eye. The Reaver, asked with a wide smile:\n\n“Am I interrupting something?”\n\n“Yes.”\n\n“I see.”\n\nThe Reaver then turned back to Evellen, asking “I was wondering if you might care to dance.”\n\nAumil rolled his eyes, “Don’t even start.”\n\n“I beg your pardon?”\n\n“You heard me.”"
 flavour_estallen.10.a:0 "Well, what happened next?"
 flavour_estallen.10.b:0 "Oh I’ve heard this story before."
 flavour_estallen.11.t:0 "Old Habits Die Hard"
 flavour_estallen.11.d:0 "“Where was I?” Evellen tried to remember where she’d left off, “Oh yes, Reaver asking for a dance, and Aumil taking it personally. So it went something like this:”\n\nAumil said: “Don’t even start!”\n\n“‘I beg your pardon?”, replied the Reaver.\n\n“You heard me.”\n\n“Actually, I didn’t.”\n\n“You fucking heard me!”\n\nRean covered a smile with a healthy swallow from her cup, “And what did you do?”\n\n“I told them both to stop.”\n\n“You did not.”\n\n“I did.”\n\n“You encouraged them.”\n\n“I did no such thing!”\n\nEvellen had to admit that neither man seemed particularly gifted at courting a lady. Aumil's compliments were painfully direct, while the Reaver attempted to hide his own crude intentions behind considerably better manners, which he had apparently learned while in Themarenn. \n\nFor a while, it was charming, but then they began comparing their campaigns.\n\nThen their conquests.\n\nThen the fortunes they had looted.\n\nThen the number of men each had killed.\n\nThen came the insults.\n\n“You’re a pompous little shit.” said the Reaver.\n\n“At least I’m not a landlocked pirate.”\n\n“Say that again.”\n\n“Landlocked. Pirate.”\n\n“I’ll gut you.”\n\n“At the party?”\n\n“Right fucking here.”"
 flavour_estallen.11.a:0 "Rean’s smile was now harder to hide, amused by such brashness."
 flavour_estallen.12.t:0 "A Minor Incident"
 flavour_estallen.12.d:0 "The first punch was thrown over a glass of wine. The answer broke a chair. After that, everything happened rather quickly.\n\nThere was a table involved. Then a fruit plate. People screamed. The musicians upped the tempo. An expensive portrait went flying into the Esmar. Evellen distinctly remembered Aumil standing on a table, shouting something about the Reaver's mother, before the Reaver knocked him straight through the dessert table. \n\nRean stared at her.\n\n“You were smiling.”\n\n“I was scared for my life.”\n\n“You were.”\n\n“Perhaps a little.”\n\n“Did any of them remember that they were fighting over you?”\n\n“No.”\n\n“Did someone win?”\n\nShe took another sip of tea.\n\n“Oh, certainly.”\n\nRean raised an eyebrow.\n\n“Who?”\n\nEvellen smiled.\n\n“Me.”"
 flavour_estallen.12.a:0 "Surely, good company will force a change of habit at some point?"
 flavour_estallen.13.t:0 "The Tattletales of the Upper Courts"
 flavour_estallen.13.d:0 "The court of Estallen, over the years, has relied on royal marriages and courtly ceremonies to stay ahead in the vicious game of imperial politics, an unforgiving arena where some of the world’s most prolific schemers hide daggers behind sweet little lies and smiles that would fool anyone unaware of their game.\n\nIf we are to keep our influence, and indeed our heads, in the game, we must take the initiative, and not just react to the latest developments. It is only natural then for us to use our greatest assets; the ladies of the court. We shall send them out to infiltrate foreign courts and hear their whispers, learn their plots, understand the current political trends, and unravel the plots that are brewed behind closed doors.\n\nTo prepare them for this task, we shall train our agents not only in the ways of charm, but also provide them with an education in politics, history, natural science, and infiltration methods. Sending them to foreign courts as handmaidens to their duchesses and princesses is the next natural step - after all, there’s no better place to hear what their husbands are up to other than an afternoon tea break.\n\nIn addition, having such agents protect our own court against plots is also of paramount importance. The establishment of an unofficial group of maidens who officially perform courtly duties but are the [Root.Monarch.GetTitle]’s eyes and ears in every corner of the keep will ensure our survival as a dynasty."
 flavour_estallen.13.a:0 "Tell them sweet little lies, let them live in blissful ignorance."